reasoning by leveraging the intrinsic capabilities of LLMs via reinforcement learning (RL). To this end, we introduce hybrid reasoning policy optimization (HRPO), an RL-based hybrid latent reasoning approach that (1) integrates prior hidden states into sampled tokens with a learnable gating mechanism, and (2) initializes training with predominantly token embeddings while progressively incorporating more hidden features. This design maintains LLMs' generative capabilities and incentivizes hybrid reasoning using both discrete and continuous representations. In addition, the hybrid HRPO introduces stochasticity into latent reasoning via token sampling, thereby enabling RL-based optimization without requiring CoT trajectories. Extensive evaluations across diverse benchmarks show that HRPO outperforms prior methods in both knowledge- and reasoning-intensive tasks. Furthermore, HRPO-trained LLMs remain interpretable and exhibit intriguing behaviors like cross-lingual patterns and shorter completion lengths, highlighting the potential of our RL-based approach and offer insights for future work in latent reasoning.", "similarity": 0.7895914912223816, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.7, "specificity_informativeness": 0.35, "is_leaf": true, "avg_score": 4.25, "variance": 0.9166666666666666, "avg_rating": 4.25, "var_rating": 0.9166666666666666, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "33", "parentIds": ["65"], "name": "Beyond Accuracy: Dissecting Mathematical Reasoning for LLMs Under Reinforcement Learning. Reinforcement learning (RL) has become the dominant paradigm for improving the performance of language models ", "full_text": "Beyond Accuracy: Dissecting Mathematical Reasoning for LLMs Under Reinforcement Learning. Reinforcement learning (RL) has become the dominant paradigm for improving the performance of language models on complex reasoning tasks. Despite the substantial empirical gains demonstrated by RL-based training methods like GRPO, a granular understanding of why and how RL enhances performance is still lacking. To bridge this gap, we introduce SPARKLE, a fine-grained analytic framework to dissect the effects of RL across three key dimensions: (1) plan following and execution, (2) knowledge integration, and (3) chain of subproblems. Using this framework, we gain insights beyond mere accuracy. For instance, providing models with explicit human-crafted, step-by-step plans can surprisingly degrade performance on the most challenging benchmarks, yet RL-tuned models exhibit greater robustness, experiencing markedly smaller performance drops than base or SFT models. This suggests that RL may not primarily enhance the execution of external plans but rather empower models to formulate and follow internal strategies better suited to their reasoning processes. Conversely, we observe that RL enhances models' ability to integrate provided knowledge into their reasoning process, yielding consistent gains across diverse tasks. Finally, we study whether difficult problems---those yielding no RL signals and mixed-quality reasoning traces---can still be effectively used for training. We introduce SparkleRL-PSS, a multi-stage RL pipeline that reuses hard problems with partial step scaffolding, guiding exploration effectively without additional data generation. Together, our findings provide a principled foundation for understanding how RL shapes model behavior, offering practical insights for building more adaptive, data-efficient, and interpretable RL pipelines for reasoning tasks. Our code, data, and checkpoints are available at: https://sparkle-reasoning.github.io/.", "similarity": 0.8446864485740662, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.725, "specificity_informativeness": 0.6, "is_leaf": true, "avg_score": 4.0, "variance": 1.3333333333333333, "avg_rating": 4.0, "var_rating": 1.3333333333333333, "avg_quality": 2.75, "var_quality": 0.9166666666666666, "avg_clarity": 2.75, "var_clarity": 0.9166666666666666, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "34", "parentIds": ["88"], "name": "SwS: Self-aware Weakness-driven Problem Synthesis in Reinforcement Learning for LLM Reasoning. Reinforcement Learning with Verifiable Rewards (RLVR) has proven effective for training large language mo", "full_text": "SwS: Self-aware Weakness-driven Problem Synthesis in Reinforcement Learning for LLM Reasoning. Reinforcement Learning with Verifiable Rewards (RLVR) has proven effective for training large language models (LLMs) on complex reasoning tasks, such as mathematical problem solving. A prerequisite for the scalability of RLVR is a high-quality problem set with precise and verifiable answers. However, the scarcity of well-crafted human-labeled math problems and limited-verification answers in existing distillation-oriented synthetic datasets limit their effectiveness in RL. Additionally, most problem synthesis strategies indiscriminately expand the problem set without considering the model’s capabilities, leading to low efficiency in generating useful questions. To mitigate this issue, we introduce a Self-aware Weakness-driven problem Synthesis framework (SwS) that systematically identifies model deficiencies and leverages them for problem augmentation. Specifically, we define weaknesses as questions that the model consistently fails to learn through its iterative sampling during RL training. We then extract the core concepts from these failure cases and synthesize new problems to strengthen the model's weak areas in subsequent augmented training, enabling it to focus on and gradually overcome its weaknesses. Without relying on external knowledge distillation, our framework enables robust generalization by empowering the model to self-identify and address its weaknesses in RL, yielding average performance gains of 10% and 7.7% on 7B and 32B models across eight mainstream reasoning benchmarks. Our code and data are available at https://anonymous.4open.science/r/SwS-E6F5/", "similarity": 0.8144469261169434, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.45, "is_leaf": true, "avg_score": 4.0, "variance": 0.0, "avg_rating": 4.0, "var_rating": 0.0, "avg_quality": 2.6666666666666665, "var_quality": 0.33333333333333337, "avg_clarity": 2.3333333333333335, "var_clarity": 1.3333333333333333, "avg_significance": 2.6666666666666665, "var_significance": 0.33333333333333337, "avg_originality": 3.0, "var_originality": 1.0}, {"id": "35", "parentIds": ["93"], "name": "Learning to Think: Information-Theoretic Reinforcement Fine-Tuning for LLMs. Large language models (LLMs) excel at complex tasks thanks to advances in their reasoning abilities. However, existing meth", "full_text": "Learning to Think: Information-Theoretic Reinforcement Fine-Tuning for LLMs. Large language models (LLMs) excel at complex tasks thanks to advances in their reasoning abilities. However, existing methods overlook the trade-off between reasoning effectiveness and efficiency, often encouraging unnecessarily long reasoning chains and wasting tokens. To address this, we propose Learning to Think (L2T), an information-theoretic reinforcement fine-tuning framework for LLMs to make the models achieve optimal reasoning with fewer tokens. Specifically, L2T treats each query-response interaction as a hierarchical session of multiple episodes and proposes a universal dense process reward, i.e., quantifies the episode-wise information gain in parameters, requiring no extra annotations or task-specific evaluators. We propose a method to quickly estimate this reward based on PAC-Bayes bounds and the Fisher information matrix. Theoretical analyses show that it significantly reduces computational complexity with high estimation accuracy. By immediately rewarding each episode's contribution and penalizing excessive updates, L2T optimizes the model via reinforcement learning to maximize the use of each episode and achieve effective updates. Empirical results on various reasoning benchmarks and base models demonstrate the advantage of L2T across different tasks, boosting both reasoning effectiveness and efficiency.", "similarity": 0.7857006192207336, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.0, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 3.25, "var_significance": 0.25, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "36", "parentIds": ["76", "86"], "name": "Is PRM Necessary? Problem-Solving RL Implicitly Induces PRM Capability in LLMs. The development of reasoning capabilities represents a critical frontier in large language models (LLMs) research, where", "full_text": "Is PRM Necessary? Problem-Solving RL Implicitly Induces PRM Capability in LLMs. The development of reasoning capabilities represents a critical frontier in large language models (LLMs) research, where reinforcement learning (RL) and process reward models (PRMs) have emerged as predominant methodological frameworks. Contrary to conventional wisdom, empirical evidence from DeepSeek-R1 demonstrates that pure RL training focused on mathematical problem-solving can progressively enhance reasoning abilities without PRM integration, challenging the perceived necessity of process supervision.\nIn this study, we conduct a systematic investigation of the relationship between RL training and PRM capabilities. Our findings demonstrate that problem-solving proficiency and process supervision capabilities represent complementary dimensions of reasoning that co-evolve synergistically during pure RL training. In particular, current PRMs underperform simple baselines like majority voting when applied to state-of-the-art models such as DeepSeek-R1 and QwQ-32B. To address this limitation, we propose Self-PRM, an introspective framework in which models autonomously evaluate and rerank their generated solutions through self-reward mechanisms. Although Self-PRM consistently improves the accuracy of the benchmark (particularly with larger sample sizes), analysis exposes persistent challenges: The approach exhibits low precision (<10\\%) on difficult problems, frequently misclassifying flawed solutions as valid. These analyses underscore the need for combined training with process supervision and continued RL scaling to enhance reward alignment and introspective accuracy. We hope these findings provide actionable insights for building more reliable and self-aware complex reasoning models.", "similarity": 0.8276845812797546, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 4.0, "variance": 0.5, "avg_rating": 4.0, "var_rating": 0.5, "avg_quality": 2.8, "var_quality": 0.19999999999999996, "avg_clarity": 2.8, "var_clarity": 0.19999999999999996, "avg_significance": 2.6, "var_significance": 0.3, "avg_originality": 2.8, "var_originality": 0.19999999999999996}, {"id": "37", "parentIds": ["84", "67"], "name": "Consistent Paths Lead to Truth: Self-Rewarding Reinforcement Learning for LLM Reasoning. Recent advances of Reinforcement Learning (RL) have highlighted its potential in complex reasoning tasks, yet e", "full_text": "Consistent Paths Lead to Truth: Self-Rewarding Reinforcement Learning for LLM Reasoning. Recent advances of Reinforcement Learning (RL) have highlighted its potential in complex reasoning tasks, yet effective training often relies on external supervision, which limits the broader applicability. In this work, we propose a novel self-rewarding reinforcement learning framework to enhance Large Language Model (LLM) reasoning by leveraging the consistency of intermediate reasoning states across different reasoning trajectories. Our key insight is that correct responses often exhibit consistent trajectory patterns in terms of model likelihood: their intermediate reasoning states tend to converge toward their own final answers (*high consistency*) with minimal deviation toward other candidates (*low volatility*). Inspired by this observation, we introduce CoVo, an intrinsic reward mechanism that integrates ***Co***nsistency and ***Vo***latility via a robust vector-space aggregation strategy, complemented by a curiosity bonus to promote diverse exploration. CoVo enables LLMs to perform RL in a self-rewarding manner, offering a scalable pathway for learning to reason without external supervision. Extensive experiments on diverse reasoning benchmarks show that CoVo achieves performance comparable to or even surpassing supervised RL. Our code is available at https://github.com/sastpg/CoVo.", "similarity": 0.789513885974884, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.4, "is_leaf": true, "avg_score": 4.0, "variance": 0.6666666666666666, "avg_rating": 4.0, "var_rating": 0.6666666666666666, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.5, "var_significance": 1.0, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "38", "parentIds": ["92"], "name": "When Can Model-Free Reinforcement Learning be Enough for Thinking?. Recent work on large language models has demonstrated the use of model-free reinforcement learning (RL) to train reasoning-like capa", "full_text": "When Can Model-Free Reinforcement Learning be Enough for Thinking?. Recent work on large language models has demonstrated the use of model-free reinforcement learning (RL) to train reasoning-like capabilities. The emergence of \"thinking\" through model-free RL is interesting as thinking actions neither produce reward nor change the external world state to one where the agent is more likely to get reward. This paper seeks to build a domain-independent understanding of when model-free RL will lead to such \"thinking\" as a strategy for reward maximization. To build this understanding, we first introduce a theoretical model which we call a thought Markov decision process (MDP). Thought MDPs minimally extend the classical MDP model to include an abstract notion of thought state and thought action. Using the thought MDP model, we prove the importance of policy initialization in determining whether or not thinking emerges and show formally that thought actions are equivalent to the agent choosing to perform a step of policy improvement before continuing to act. We then show that open-source LLMs satisfy the conditions that our theory predicts are necessary for model-free RL to produce thinking-like behavior. Finally, we hypothesize sufficient conditions that would enable thinking to be learned outside of language generation and introduce a toy domain where a combination of multi-task pre-training and designated thought actions enable more data-efficient RL compared to non-thinking agents.", "similarity": 0.7155179381370544, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.4, "specificity_informativeness": 0.325, "is_leaf": true, "avg_score": 4.0, "variance": 0.5, "avg_rating": 4.0, "var_rating": 0.5, "avg_quality": 2.8, "var_quality": 0.19999999999999998, "avg_clarity": 3.0, "var_clarity": 0.5, "avg_significance": 2.8, "var_significance": 0.7, "avg_originality": 3.4, "var_originality": 0.3}, {"id": "39", "parentIds": ["78"], "name": "The Surprising Effectiveness of Negative Reinforcement in LLM Reasoning. Reinforcement learning with verifiable rewards (RLVR) is a promising approach for training language models (LMs) on reasoning t", "full_text": "The Surprising Effectiveness of Negative Reinforcement in LLM Reasoning. Reinforcement learning with verifiable rewards (RLVR) is a promising approach for training language models (LMs) on reasoning tasks that elicit emergent long chains of thought (CoTs). Unlike supervised learning, it updates the model using both correct and incorrect samples via policy gradients. To better understand its mechanism, we decompose the learning signal into reinforcing correct responses and penalizing incorrect ones, referred to as **P**ositive and **N**egative **S**ample **R**einforcement (**PSR** and **NSR**), respectively. We train `Qwen2.5-Math-7B`, `Qwen3-4B` and `Llama-3.1-8B-Instruct` on a mathematical reasoning dataset and uncover a surprising result: training with only negative samples — without reinforcing correct responses — can be highly effective: it consistently improves performance over the base model across the entire Pass@$k$ spectrum $k$ up to 256), often matching or surpassing PPO and GRPO. In contrast, reinforcing only correct responses improves Pass@1 but degrades performance at higher $k$, due to reduced diversity. These inference-scaling trends highlight that solely penalizing incorrect responses may contribute more to performance than previously recognized. Through gradient analysis, we show that NSR works by suppressing incorrect generations and redistributing probability mass toward other plausible candidates, guided by the model's prior beliefs. It refines the model's existing knowledge rather than introducing entirely new behaviors. Building on this insight, we propose a simple variant of the RL objective that upweights NSR, and show that it consistently improves overall Pass@$k$ performance on MATH, AIME 2025, and AMC23. Our code is available at [`https://github.com/TianHongZXY/RLVR-Decomposed`](https://github.com/TianHongZXY/RLVR-Decomposed).", "similarity": 0.7829241752624512, "summary_blocked": null, "evalScore": 0.6, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.4, "specificity_informativeness": 0.375, "is_leaf": true, "avg_score": 3.75, "variance": 1.5833333333333333, "avg_rating": 3.75, "var_rating": 1.5833333333333333, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "40", "parentIds": ["89"], "name": "Reasoning Models Hallucinate More: Factuality-Aware Reinforcement Learning for Large Reasoning Models. Large language models (LLMs) have significantly advanced in reasoning tasks through reinforcement", "full_text": "Reasoning Models Hallucinate More: Factuality-Aware Reinforcement Learning for Large Reasoning Models. Large language models (LLMs) have significantly advanced in reasoning tasks through reinforcement learning (RL) optimization, achieving impressive capabilities across various challenging benchmarks. However, our empirical analysis reveals a critical drawback: reasoning-oriented RL fine-tuning significantly increases the prevalence of hallucinations. We theoretically analyze the RL training dynamics, identifying high-variance gradient, entropy-induced randomness, and susceptibility to spurious local optima as key factors leading to hallucinations. To address this drawback, we propose Factuality-aware Step-wise Policy Optimization (FSPO), an innovative RL fine-tuning algorithm incorporating explicit factuality verification at each reasoning step. FSPO leverages automated verification against given evidence to dynamically adjust token-level advantage values, incentivizing factual correctness throughout the reasoning process. Experiments across mathematical reasoning and hallucination benchmarks using Qwen2.5 and Llama models demonstrate that FSPO effectively reduces hallucinations while enhancing reasoning accuracy, substantially improving both reliability and performance.", "similarity": 0.7669619917869568, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.55, "specificity_informativeness": 0.22499999999999998, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "41", "parentIds": ["85"], "name": "Optimizing Chain-of-Thought Reasoners via Gradient Variance Minimization in Rejection Sampling and RL. Chain-of-thought (CoT) reasoning in large language models (LLMs) can be formalized as a latent va", "full_text": "Optimizing Chain-of-Thought Reasoners via Gradient Variance Minimization in Rejection Sampling and RL. Chain-of-thought (CoT) reasoning in large language models (LLMs) can be formalized as a latent variable problem, where the model needs to generate intermediate reasoning steps. While prior approaches such as iterative reward-ranked fine-tuning (RAFT) have relied on such formulations, they typically apply uniform inference budgets across prompts, which fails to account for variability in difficulty and convergence behavior. This work identifies the main bottleneck in CoT training as inefficient stochastic gradient estimation due to static sampling strategies. We propose GVM-RAFT, a prompt-specific Dynamic Sample Allocation Strategy designed to minimize stochastic gradient variance under a computational budget constraint. The method dynamically allocates computational resources by monitoring prompt acceptance rates and stochastic gradient norms, ensuring that the resulting gradient variance is minimized. Our theoretical analysis shows that the proposed dynamic sampling strategy leads to accelerated convergence guarantees under suitable conditions. Experiments on mathematical reasoning show that GVM-RAFT achieves a 2-4x speedup and considerable accuracy improvements over vanilla RAFT. The proposed dynamic sampling strategy is general and can be incorporated into other reinforcement learning algorithms, such as GRPO, leading to similar improvements in convergence and test accuracy.", "similarity": 0.7895914912223816, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.8, "specificity_informativeness": 0.6, "is_leaf": true, "avg_score": 4.333333333333333, "variance": 0.33333333333333337, "avg_rating": 4.333333333333333, "var_rating": 0.33333333333333337, "avg_quality": 3.3333333333333335, "var_quality": 0.33333333333333337, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 3.3333333333333335, "var_significance": 0.33333333333333337, "avg_originality": 2.6666666666666665, "var_originality": 1.3333333333333333}, {"id": "42", "parentIds": ["65", "76"], "name": "ProRL: Prolonged Reinforcement Learning Expands Reasoning Boundaries in Large Language Models. Recent advances in reasoning-centric language models have highlighted reinforcement learning (RL) as a pr", "full_text": "ProRL: Prolonged Reinforcement Learning Expands Reasoning Boundaries in Large Language Models. Recent advances in reasoning-centric language models have highlighted reinforcement learning (RL) as a promising method for aligning models with verifiable rewards. However, it remains contentious whether RL truly expands a model’s reasoning capabilities or merely amplifies high-reward outputs already latent in the base model’s distribution, and whether continually scaling up RL compute reliably leads to improved reasoning performance. In this work, we challenge prevailing assumptions by demonstrating that prolonged RL (ProRL) training can uncover novel reasoning strategies that are inaccessible to base models, even under extensive sampling. We introduce ProRL, a novel training methodology that incorporates KL divergence control, reference policy resetting, and a diverse suite of tasks. Our empirical analysis reveals that RL-trained models consistently outperform base models across a wide range of pass@$k$ evaluations, including scenarios where base models fail entirely regardless of the number of attempts. We further show that reasoning boundary improvements correlates strongly with task competence of base model and training duration, suggesting that RL can explore and populate new regions of solution space over time.  These findings offer new insights into the conditions under which RL meaningfully expands reasoning boundaries in language models and establish a foundation for future work on long-horizon RL for reasoning. We will release model weights and data to support further research.", "similarity": 0.8446864485740662, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.575, "specificity_informativeness": 0.575, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 3.25, "var_significance": 0.9166666666666666, "avg_originality": 3.0, "var_originality": 0.6666666666666666}, {"id": "43", "parentIds": ["79"], "name": "DAPO: An Open-Source LLM Reinforcement Learning System at Scale. Inference scaling empowers LLMs with unprecedented reasoning ability, with reinforcement learning as the core technique to elicit compl", "full_text": "DAPO: An Open-Source LLM Reinforcement Learning System at Scale. Inference scaling empowers LLMs with unprecedented reasoning ability, with reinforcement learning as the core technique to elicit complex reasoning. However, key technical details of state-of-the-art reasoning LLMs are concealed (such as in OpenAI o1 blog and DeepSeek R1 technical report), thus the community still struggles to reproduce their RL training results. We propose the **D**ecoupled Clip and **D**ynamic s**A**mpling **P**olicy **O**ptimization (**DAPO**) algorithm, and fully open-source a state-of-the-art large-scale RL system that achieves 50 points on AIME 2024 using Qwen2.5-32B base model. Unlike previous works that withhold training details, we introduce four key techniques of our algorithm that make large-scale LLM RL a success. In addition, we open-source our training code, which is built on the verl framework, along with a carefully curated and processed dataset. These components of our open-source system enhance reproducibility and support future research in large-scale LLM RL.", "similarity": 0.7626391053199768, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.175, "is_leaf": true, "avg_score": 4.0, "variance": 2.0, "avg_rating": 4.0, "var_rating": 2.0, "avg_quality": 2.75, "var_quality": 0.9166666666666666, "avg_clarity": 3.0, "var_clarity": 0.6666666666666666, "avg_significance": 2.5, "var_significance": 1.0, "avg_originality": 2.5, "var_originality": 1.0}, {"id": "44", "parentIds": ["74"], "name": "RL Tango: Reinforcing Generator and Verifier Together for Language Reasoning. Reinforcement learning (RL) has recently emerged as a compelling approach for enhancing the reasoning capabilities of larg", "full_text": "RL Tango: Reinforcing Generator and Verifier Together for Language Reasoning. Reinforcement learning (RL) has recently emerged as a compelling approach for enhancing the reasoning capabilities of large language models (LLMs), where an LLM generator serves as a policy guided by a verifier (reward model). However, current RL post-training methods for LLMs typically use verifiers that are fixed (rule-based or frozen pretrained) or trained discriminatively via supervised fine-tuning (SFT). Such designs are susceptible to reward hacking and generalize poorly beyond their training distributions. To overcome these limitations, we propose Tango, a novel framework that uses RL to concurrently train both an LLM generator and a verifier in an interleaved manner. A central innovation of Tango is its generative, process-level LLM verifier, which is trained via RL and co-evolves with the generator. Importantly, the verifier is trained solely based on outcome-level verification correctness rewards without requiring explicit process-level annotations. This generative RL-trained verifier exhibits improved robustness and superior generalization compared to deterministic or SFT-trained verifiers, fostering effective mutual reinforcement with the generator.  Extensive experiments demonstrate that both components of Tango achieve state-of-the-art results among 7B/8B-scale models: the generator attains best-in-class performance across five competition-level math benchmarks and four challenging out-of-domain reasoning tasks, while the verifier leads on the ProcessBench dataset. Remarkably, both components exhibit particularly substantial improvements on the most difficult mathematical reasoning problems.", "similarity": 0.8121193647384644, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 5.0, "variance": 0.0, "avg_rating": 5.0, "var_rating": 0.0, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.5, "var_clarity": 1.0, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "45", "parentIds": ["64"], "name": "Reward Reasoning Models. Reward models play a critical role in guiding large language models toward outputs that align with human expectations. However, an open challenge remains in effectively utiliz", "full_text": "Reward Reasoning Models. Reward models play a critical role in guiding large language models toward outputs that align with human expectations. However, an open challenge remains in effectively utilizing test-time compute to enhance reward model performance. In this work, we introduce Reward Reasoning Models (RRMs), which are specifically designed to execute a deliberate reasoning process before generating final rewards. Through chain-of-thought reasoning, RRMs leverage additional test-time compute for complex queries where appropriate rewards are not immediately apparent. To develop RRMs, we implement a reinforcement learning framework that fosters self-evolved reward reasoning capabilities without requiring explicit reasoning traces as training data. Experimental results demonstrate that RRMs achieve superior performance on reward modeling benchmarks across diverse domains. Notably, we show that RRMs can adaptively exploit test-time compute to further improve reward accuracy. The pretrained models are available at https://huggingface.co/Reward-Reasoning.", "similarity": 0.8227683305740356, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.2, "is_leaf": true, "avg_score": 4.0, "variance": 0.6666666666666666, "avg_rating": 4.0, "var_rating": 0.6666666666666666, "avg_quality": 3.0, "var_quality": 1.3333333333333333, "avg_clarity": 2.5, "var_clarity": 0.3333333333333333, "avg_significance": 3.0, "var_significance": 0.6666666666666666, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "46", "parentIds": ["75"], "name": "Mixing Expert Knowledge: Bring Human Thoughts Back To the Game of Go. Large language models (LLMs) have demonstrated exceptional performance in reasoning tasks such as mathematics and coding, matching", "full_text": "Mixing Expert Knowledge: Bring Human Thoughts Back To the Game of Go. Large language models (LLMs) have demonstrated exceptional performance in reasoning tasks such as mathematics and coding, matching or surpassing human capabilities. However, these impressive reasoning abilities face significant challenges in specialized domains. Taking Go as an example, although AlphaGo has established the high performance ceiling of AI systems in Go, mainstream LLMs still struggle to reach even beginner-level proficiency, let alone perform natural language reasoning. This performance gap between general-purpose LLMs and domain experts is significantly limiting the application of LLMs on a wider range of domain-specific tasks. In this work, we aim to bridge the divide between LLMs' general reasoning capabilities and expert knowledge in domain-specific tasks. We perform mixed fine-tuning with structured Go expertise and general long Chain-of-Thought (CoT) reasoning data as a cold start, followed by reinforcement learning to integrate expert knowledge in Go with general reasoning capabilities. Through this methodology, we present LoGos, a powerful LLM that not only maintains outstanding general reasoning abilities, but also conducts Go gameplay in natural language, demonstrating effective strategic  reasoning and accurate next-move prediction. LoGos achieves performance comparable to human professional players, substantially surpassing all existing LLMs. Through this work, we aim to contribute insights on applying general LLM reasoning capabilities to specialized domains. We will release the first large-scale Go dataset for LLM training, the first LLM Go evaluation benchmark, and the first general LLM that reaches human expert-level performance in Go.", "similarity": 0.7125580310821533, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.6, "specificity_informativeness": 0.4, "is_leaf": true, "avg_score": 3.75, "variance": 0.9166666666666666, "avg_rating": 3.75, "var_rating": 0.9166666666666666, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 2.5, "var_clarity": 0.3333333333333333, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "47", "parentIds": ["90"], "name": "CPPO: Accelerating the Training of Group Relative Policy Optimization-Based Reasoning Models. This paper introduces Completion Pruning Policy Optimization (CPPO) to accelerate the training of reasonin", "full_text": "CPPO: Accelerating the Training of Group Relative Policy Optimization-Based Reasoning Models. This paper introduces Completion Pruning Policy Optimization (CPPO) to accelerate the training of reasoning models based on Group Relative Policy Optimization (GRPO). GRPO, while effective, incurs high training costs due to the need to sample multiple completions for each question. Our experiment and theoretical analysis reveal that the number of completions impacts model accuracy yet increases training time multiplicatively, and not all completions contribute equally to policy training---their contribution depends on their relative advantage. To address these issues, we propose CPPO, which prunes completions with low absolute advantages, significantly reducing the number needed for gradient calculation and updates. Additionally, we introduce a dynamic completion allocation strategy to maximize GPU utilization by incorporating additional questions, further enhancing training efficiency. Experiments show that CPPO achieves up to $7.98\\times$ speedup on GSM8K and $3.48\\times$ on Math while preserving or even enhancing the accuracy compared to the original GRPO. We release our code at https://github.com/lzhxmu/CPPO.", "similarity": 0.7592107057571411, "summary_blocked": null, "evalScore": 0.6, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.2, "is_leaf": true, "avg_score": 3.75, "variance": 1.5833333333333333, "avg_rating": 3.75, "var_rating": 1.5833333333333333, "avg_quality": 2.5, "var_quality": 1.0, "avg_clarity": 2.5, "var_clarity": 0.3333333333333333, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "48", "parentIds": ["70"], "name": "ExPO: Unlocking Hard Reasoning with Self-Explanation-Guided Reinforcement Learning. Self-improvement via RL often fails on complex reasoning tasks because GRPO-style post-training methods rely on the ", "full_text": "ExPO: Unlocking Hard Reasoning with Self-Explanation-Guided Reinforcement Learning. Self-improvement via RL often fails on complex reasoning tasks because GRPO-style post-training methods rely on the model’s initial ability to generate positive samples. Without guided exploration, these approaches merely reinforce what the model already knows (distribution-sharpening) rather than enabling the model to solve problems where it initially generates no correct solutions.\nTo unlock reasoning ability in such settings, the model must explore new reasoning trajectories beyond its current output distribution. Such exploration requires access to sufficiently good positive samples to guide the learning. \n\nWhile expert demonstrations seem like a natural solution, we find that they are often ineffective in RL post-training. Instead, we identify two key properties of effective positive samples: they should (1) be likely under the current policy, and (2) increase the model’s likelihood of predicting the correct answer. Based on these insights, we propose \\textbf{Self-Explanation Policy Optimization (ExPO)}—a simple and modular framework that generates such samples by conditioning on the ground-truth answer. ExPO enables efficient exploration and guides the model to produce reasoning trajectories more aligned with its policy than expert-written CoTs, while ensuring higher quality than its own (incorrect) samples. Experiments show that ExPO improves both learning efficiency and final performance on reasoning benchmarks, surpassing expert-demonstration-based methods in challenging settings such as MATH level-5, where the model initially struggles the most.", "similarity": 0.8217299580574036, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 4.25, "variance": 0.9166666666666666, "avg_rating": 4.25, "var_rating": 0.9166666666666666, "avg_quality": 2.5, "var_quality": 1.0, "avg_clarity": 2.25, "var_clarity": 0.25, "avg_significance": 3.0, "var_significance": 0.6666666666666666, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "49", "parentIds": ["82"], "name": "RAST: Reasoning Activation in LLMs via Small-model Transfer. Reinforcement learning (RL) has become a powerful approach for improving the reasoning capabilities of large language models (LLMs), as evi", "full_text": "RAST: Reasoning Activation in LLMs via Small-model Transfer. Reinforcement learning (RL) has become a powerful approach for improving the reasoning capabilities of large language models (LLMs), as evidenced by recent successes such as OpenAI's o1 and Deepseek-R1. However, applying RL at scale remains intimidatingly resource-intensive, requiring multiple model copies and extensive GPU workloads. On the other hand, while being powerful, recent studies suggest that RL does not fundamentally endow models with new knowledge; rather, it primarily reshapes the model's output distribution to activate reasoning capabilities latent in the base model. Building on this insight, we hypothesize that the changes in output probabilities induced by RL are largely model-size invariant, opening the door to a more efficient paradigm: training a small model with RL and transferring its induced probability shifts to larger base models. To verify our hypothesis, we conduct a token-level analysis of decoding trajectories and find high alignment in RL-induced output distributions across model scales, validating our hypothesis. Motivated by this, we propose RAST, a simple yet effective method that transfers reasoning behaviors by injecting RL-induced probability adjustments from a small RL-trained model into larger models. Experiments across multiple mathematical reasoning benchmarks show that RAST substantially and consistently enhances the reasoning capabilities of base models while requiring significantly lower GPU memory than direct RL training, sometimes even yielding better performance than the RL-trained counterparts. Our findings offer new insights into the nature of RL-driven reasoning and practical strategies for scaling its benefits without incurring its full computational cost. The project page of RAST is available at https://ozyyshr.github.io/RAST/.", "similarity": 0.761534571647644, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.4, "specificity_informativeness": 0.45, "is_leaf": true, "avg_score": 4.0, "variance": 1.5, "avg_rating": 4.0, "var_rating": 1.5, "avg_quality": 2.4, "var_quality": 0.3, "avg_clarity": 3.0, "var_clarity": 0.5, "avg_significance": 3.0, "var_significance": 0.5, "avg_originality": 2.6, "var_originality": 0.3}, {"id": "50", "parentIds": ["87"], "name": "SCAN: Self-Denoising Monte Carlo Annotation for Robust Process Reward Learning. Process reward models (PRMs) offer fine-grained, step-level evaluations that facilitate deeper reasoning processes in la", "full_text": "SCAN: Self-Denoising Monte Carlo Annotation for Robust Process Reward Learning. Process reward models (PRMs) offer fine-grained, step-level evaluations that facilitate deeper reasoning processes in large language models (LLMs), proving effective in complex tasks like mathematical reasoning. \nHowever, developing PRMs is challenging due to the high cost and limited scalability of human-annotated data.\nSynthetic data from Monte Carlo (MC) estimation is a promising alternative but suffers from a high noise ratio, which can cause overfitting and hinder large-scale training.\nIn this work, we conduct a preliminary study on the noise distribution in synthetic data from MC estimation, identifying that annotation models tend to both underestimate and overestimate step correctness due to limitations in their annotation capabilities. \nBuilding on these insights, we propose {\\bf S}elf-Denoising Monte {\\bf C}arlo {\\bf An}notation (\\textsc{Scan}), an efficient data synthesis and noise-tolerant learning framework.\nOur key findings indicate that:\n(1) Even lightweight models (e.g., 1.5B parameters) can produce high-quality annotations through self-denoising strategy, enabling PRMs to achieve superior performance with only 6\\% the inference cost required by vanilla MC estimation.\n(2) With our robust learning strategy, PRMs can effectively learn from this weak supervision, achieving a 39.2 F1 score improvement (from 19.9 to 59.1) in ProcessBench.\nDespite using only a compact synthetic dataset, our models surpass strong baselines, including those trained on large-scale human-annotated datasets such as PRM800K.\nFurthermore, performance continues to improve as we scale up the synthetic data, highlighting the potential of \\textsc{Scan} for scalable, cost-efficient, and robust PRM training.", "similarity": 0.7572029829025269, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.22499999999999998, "is_leaf": true, "avg_score": 5.0, "variance": 0.0, "avg_rating": 5.0, "var_rating": 0.0, "avg_quality": 3.0, "var_quality": 0.0, "avg_clarity": 2.6666666666666665, "var_clarity": 0.33333333333333337, "avg_significance": 3.0, "var_significance": 0.0, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "51", "parentIds": ["68"], "name": "KTAE: A Model-Free Algorithm to Key-Tokens Advantage Estimation in Mathematical Reasoning. Recent advances have demonstrated that integrating reinforcement learning with rule-based rewards can signifi", "full_text": "KTAE: A Model-Free Algorithm to Key-Tokens Advantage Estimation in Mathematical Reasoning. Recent advances have demonstrated that integrating reinforcement learning with rule-based rewards can significantly enhance the reasoning capabilities of large language models (LLMs), even without supervised fine-tuning (SFT). However, prevalent reinforcement learning algorithms such as GRPO and its variants like DAPO, suffer from a coarse granularity issue when computing the advantage. Specifically, they compute rollout-level advantages that assign identical values to every token within a sequence, failing to capture token-specific contributions. To address this limitation, we propose Key-token Advantage Estimation (KTAE)—a novel algorithm that estimates fine-grained, token-level advantages without introducing additional models. KTAE leverages the correctness of sampled rollouts and applies statistical analysis to quantify the importance of individual tokens within a sequence to the final outcome. This quantified token-level importance is then combined with the rollout-level advantage to obtain a more fine-grained token-level advantage estimation. Empirical results show that models trained with GRPO+KTAE and DAPO+KTAE outperform baseline methods across five mathematical reasoning benchmarks. Notably, they achieve higher accuracy with shorter responses and even surpass R1-Distill-Qwen-1.5B using the same base model.", "similarity": 0.763007402420044, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.44999999999999996, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "52", "parentIds": ["69"], "name": "LILO: Learning to Reason at the Frontier of Learnability. Reinforcement learning is widely adopted in post-training large language models, especially for reasoning-style tasks such as maths questions.", "full_text": "LILO: Learning to Reason at the Frontier of Learnability. Reinforcement learning is widely adopted in post-training large language models, especially for reasoning-style tasks such as maths questions. However, as we show, most existing methods will provably fail to learn from questions that are too hard, where the model always fails, or too easy, where the model always succeeds. Much human effort is therefore spent continually producing datasets of questions of a suitable difficulty for state-of-the-art models. Given this, we consider how to algorithmically identify questions that allow for maximally efficient training. We introduce a method, LILO (Learnability Improves LLMs Optimally), that prioritises training on questions with high variance of success, known as learnability, and we provide theory proving LILO maximises the expected improvement of the model. We run a wide range of experiments over multiple base models, algorithms and reasoning datasets to demonstrate that LILO consistently improves final test accuracy and can yield a 3x reduction in the number of training steps required to reach it. We explore how questions with high learnability can be efficiently identified, and discuss how learnability can be scaled to produce LLM agents that autonomously and open-endedly expand the frontier of human knowledge.", "similarity": 0.8396786451339722, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.22499999999999998, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 2.75, "var_significance": 0.9166666666666666, "avg_originality": 2.5, "var_originality": 1.0}, {"id": "53", "parentIds": ["83"], "name": "The Unreasonable Effectiveness of Entropy Minimization in LLM Reasoning. Entropy minimization (EM) trains the model to concentrate even more probability mass on its most confident outputs. \nWe show th", "full_text": "The Unreasonable Effectiveness of Entropy Minimization in LLM Reasoning. Entropy minimization (EM) trains the model to concentrate even more probability mass on its most confident outputs. \nWe show that this simple objective alone, without any labeled data, can substantially improve large language models’ (LLMs) performance on challenging math, physics, and coding tasks. We explore three approaches: (1) EM-FT minimizes token-level entropy similarly to instruction finetuning, but on unlabeled outputs drawn from the model; (2) EM-RL: reinforcement learning with negative entropy as the only reward to maximize; (3) EM-INF: inference-time logit adjustment to reduce entropy without any training data or parameter updates. \nOn Qwen-7B, EM-RL, without any labeled data, achieves comparable or better performance than strong RL baselines such as GRPO and RLOO that are trained on 60K labeled examples. Furthermore, EM-INF enables Qwen-32B to match or exceed the performance of proprietary models like GPT-4o, Claude 3 Opus, and Gemini 1.5 Pro on the challenging SciCode benchmark, while being 3x more efficient than self-consistency and sequential refinement. Our findings reveal that many pretrained LLMs possess previously underappreciated reasoning capabilities that can be effectively elicited through entropy minimization alone, without any labeled data or even any parameter updates.", "similarity": 0.8468068838119507, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.7, "specificity_informativeness": 0.525, "is_leaf": true, "avg_score": 5.25, "variance": 0.9166666666666666, "avg_rating": 5.25, "var_rating": 0.9166666666666666, "avg_quality": 3.25, "var_quality": 0.25, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 3.75, "var_significance": 0.25, "avg_originality": 3.5, "var_originality": 0.3333333333333333}, {"id": "54", "parentIds": ["81"], "name": "AdaReasoner: Adaptive Reasoning Enables More Flexible Thinking. LLMs often need effective configurations, like temperature and reasoning steps, to handle tasks requiring sophisticated reasoning and pr", "full_text": "AdaReasoner: Adaptive Reasoning Enables More Flexible Thinking. LLMs often need effective configurations, like temperature and reasoning steps, to handle tasks requiring sophisticated reasoning and problem-solving, ranging from joke generation to mathematical reasoning. Existing prompting approaches usually adopt general-purpose, fixed configurations that work “well enough” across tasks but seldom achieve task-specific optimality.\nTo address this gap, we introduce AdaReasoner, an LLM-agnostic plugin designed for any LLM to automate adaptive reasoning configurations for tasks requiring different types of thinking. AdaReasoner is trained using a reinforcement learning (RL) framework, combining a factorized action space with a targeted exploration strategy, along with  a pretrained reward model to optimize the policy model for reasoning configurations with only a few-shot guide.\nAdaReasoner is backed by theoretical guarantees and experiments of fast convergence and a sublinear policy gap. Across six different LLMs and a variety of reasoning tasks, it consistently outperforms standard baselines, preserves out-of-distribution robustness, \nand yield gains on knowledge-intensive tasks through tailored prompts.", "similarity": 0.7442485094070435, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.55, "specificity_informativeness": 0.575, "is_leaf": true, "avg_score": 4.75, "variance": 0.25, "avg_rating": 4.75, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 3.0, "var_originality": 0.6666666666666666}, {"id": "55", "parentIds": ["66"], "name": "First SFT, Second RL, Third UPT: Continual Improving Multi-Modal LLM Reasoning via Unsupervised Post-Training. Improving Multi-modal Large Language Models (MLLMs) in the post-training stage typically ", "full_text": "First SFT, Second RL, Third UPT: Continual Improving Multi-Modal LLM Reasoning via Unsupervised Post-Training. Improving Multi-modal Large Language Models (MLLMs) in the post-training stage typically relies on supervised fine-tuning (SFT) or reinforcement learning (RL), which require expensive and manually annotated multi-modal data--an ultimately unsustainable resource.\nThis limitation has motivated a growing interest in unsupervised paradigms as a third stage of post-training after SFT and RL.\nWhile recent efforts have explored this direction, their methods are complex and difficult to iterate.\nTo address this, we propose MM-UPT, a simple yet effective framework for unsupervised post-training of MLLMs, enabling continual self-improvement without any external supervision.\nThe training method of MM-UPT builds upon GRPO, replacing traditional reward signals with a self-rewarding mechanism based on majority voting over multiple sampled responses. \nOur experiments demonstrate that such training method effectively improves the reasoning ability of Qwen2.5-VL-7B (e.g., 66.3\\%$\\rightarrow$72.9\\% on MathVista, 62.9\\%$\\rightarrow$68.7\\% on We-Math), using standard dataset without ground truth labels.\nTo further explore scalability, we extend our framework to a data self-generation setting, designing two strategies that prompt the MLLM to synthesize new training samples on its own.\nAdditional experiments show that combining these synthetic data with the unsupervised training method can also boost performance, highlighting a promising approach for scalable self-improvement.\nOverall, MM-UPT offers a new paradigm for autonomous enhancement of MLLMs, serving as a critical third step after initial SFT and RL in the absence of external supervision.\nOur code is available at \\url{https://github.com/waltonfuture/MM-UPT}.", "similarity": 0.7361264824867249, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 1.5833333333333333, "avg_originality": 3.0, "var_originality": 0.6666666666666666}, {"id": "56", "parentIds": ["67"], "name": "Trust, But Verify: A Self-Verification Approach to Reinforcement Learning with Verifiable Rewards. Large Language Models (LLMs) show great promise in complex reasoning, with Reinforcement Learning wit", "full_text": "Trust, But Verify: A Self-Verification Approach to Reinforcement Learning with Verifiable Rewards. Large Language Models (LLMs) show great promise in complex reasoning, with Reinforcement Learning with Verifiable Rewards (RLVR) being a key enhancement strategy. However, a prevalent issue is ``superficial self-reflection'', where models fail to robustly verify their own outputs. We introduce RISE (Reinforcing Reasoning with Self-Verification), a novel online RL framework designed to tackle this. RISE explicitly and simultaneously trains an LLM to improve both its problem-solving and self-verification abilities within a single, integrated RL process. The core mechanism involves leveraging verifiable rewards from an outcome verifier to provide on-the-fly feedback for both solution generation and self-verification tasks. In each iteration, the model generates solutions, then critiques its own on-policy generated solutions, with both trajectories contributing to the policy update. \nExtensive experiments on diverse mathematical reasoning benchmarks show that RISE consistently improves model's problem-solving accuracy while concurrently fostering strong self-verification skills. Our analyses highlight the advantages of online verification and the benefits of increased verification compute. Additionally, RISE models exhibit more frequent and accurate self-verification behaviors during reasoning. These advantages reinforce RISE as a flexible and effective path towards developing more robust and self-aware reasoners.", "similarity": 0.8540194630622864, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.75, "specificity_informativeness": 0.5, "is_leaf": true, "avg_score": 4.25, "variance": 0.9166666666666666, "avg_rating": 4.25, "var_rating": 0.9166666666666666, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 2.5, "var_clarity": 0.3333333333333333, "avg_significance": 3.0, "var_significance": 0.6666666666666666, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "57", "parentIds": ["80"], "name": "d1: Scaling Reasoning in Diffusion Large Language Models via Reinforcement Learning. Recent large language models (LLMs) have demonstrated strong reasoning capabilities that benefits from online reinf", "full_text": "d1: Scaling Reasoning in Diffusion Large Language Models via Reinforcement Learning. Recent large language models (LLMs) have demonstrated strong reasoning capabilities that benefits from online reinforcement learning (RL).\nThese capabilities have primarily been demonstrated within the left-to-right autoregressive (AR) generation paradigm. \nIn contrast, non-autoregressive paradigms based on diffusion generate text in a coarse-to-fine manner. Although recent diffusion-based large language models (dLLMs) have achieved competitive language modeling performance compared to their AR counterparts, it remains unclear if dLLMs can also leverage recent advances in LLM reasoning.\nTo this end, we propose, a framework to adapt pre-trained masked dLLMs into reasoning models via a combination of supervised finetuning (SFT) and RL.\nSpecifically, we develop and extend techniques to improve reasoning in pretrained dLLMs: (a) we utilize a masked SFT technique to distill knowledge and instill self-improvement behavior directly from existing datasets, and (b) we introduce a novel critic-free, policy-gradient based RL algorithm called diffu-GRPO, the first integration of policy gradient methods to masked dLLMs. Through empirical studies, we investigate the performance of different post-training recipes on multiple mathematical and planning benchmarks. We find that d1 yields the best performance and significantly improves performance of a state-of-the-art dLLM.", "similarity": 0.7645437717437744, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.44999999999999996, "specificity_informativeness": 0.22499999999999998, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 2.75, "var_quality": 0.9166666666666666, "avg_clarity": 2.5, "var_clarity": 1.6666666666666667, "avg_significance": 3.0, "var_significance": 0.6666666666666666, "avg_originality": 3.5, "var_originality": 0.3333333333333333}, {"id": "58", "parentIds": ["81"], "name": "Reinforcement Learning Teachers of Test Time Scaling. Training reasoning language models (LMs) with reinforcement learning (RL) for one-hot correctness inherently relies on the LM being able to explor", "full_text": "Reinforcement Learning Teachers of Test Time Scaling. Training reasoning language models (LMs) with reinforcement learning (RL) for one-hot correctness inherently relies on the LM being able to explore and solve its task with some chance at initialization. Furthermore, a key use case of reasoning LMs is to act as teachers for distilling new students and cold-starting future RL iterations rather than being deployed themselves. From these considerations, we introduce a new framework that avoids RL's exploration challenge by training a new class of Reinforcement-Learned Teachers (RLTs) focused on yielding the most effective downstream distillation. RLTs are prompted with both the question and solution to each problem, and tasked to simply \"connect-the-dots\" with detailed explanations tailored for their students. We train RLTs with dense rewards obtained by feeding each explanation to the student and testing its understanding of the problem's solution. In practice, the raw outputs of a 7B RLT provide higher final performance on competition and graduate-level tasks than existing distillation and cold-starting pipelines that collect and postprocess the reasoning traces of orders of magnitude larger LMs. Furthermore, RLTs maintain their effectiveness when training larger students and when applied zero-shot to out-of-distribution tasks, unlocking new levels of efficiency and re-usability for the RL reasoning framework.", "similarity": 0.7442485094070435, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.55, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 4.75, "variance": 0.9166666666666666, "avg_rating": 4.75, "var_rating": 0.9166666666666666, "avg_quality": 3.25, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 3.25, "var_significance": 0.25, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "59", "parentIds": ["78"], "name": "Tapered Off-Policy REINFORCE - Stable and efficient reinforcement learning for large language models. We propose a new algorithm for fine-tuning large language models using reinforcement learning. Tap", "full_text": "Tapered Off-Policy REINFORCE - Stable and efficient reinforcement learning for large language models. We propose a new algorithm for fine-tuning large language models using reinforcement learning. Tapered Off-Policy REINFORCE (TOPR) uses an asymmetric, tapered variant of importance sampling to speed up learning while maintaining stable learning dynamics, even without the use of KL regularization. TOPR can be applied in a fully offline fashion, allows the handling of positive and negative examples in a unified framework, and benefits from the implementational simplicity that is typical of Monte Carlo algorithms. We demonstrate the effectiveness of our approach with a series of experiments on the GSM8K and MATH reasoning benchmarks, finding performance gains for training both a model for solution generation and as a generative verifier. We show that properly leveraging positive and negative examples alike in the off-policy regime simultaneously increases test-time accuracy and training data efficiency, all the while avoiding the ``wasted inference'' that comes with discarding negative examples. We find that this advantage persists over multiple iterations of training and can be amplified by dataset curation techniques, enabling us to match 70B-parameter model performance with 8B language models. As a corollary to this work, we find that REINFORCE's baseline parameter plays an important and unexpected role in defining dataset composition in the presence of negative examples, and is consequently critical in driving off-policy performance.", "similarity": 0.7829241752624512, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.7, "specificity_informativeness": 0.4, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 3.25, "var_clarity": 0.9166666666666666, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 3.0, "var_originality": 0.6666666666666666}, {"id": "60", "parentIds": ["86"], "name": "Agentic RL Scaling Law: Spontaneous Code Execution for Mathematical Problem Solving. Large Language Models (LLMs) often struggle with mathematical reasoning tasks requiring precise, verifiable computa", "full_text": "Agentic RL Scaling Law: Spontaneous Code Execution for Mathematical Problem Solving. Large Language Models (LLMs) often struggle with mathematical reasoning tasks requiring precise, verifiable computation. While Reinforcement Learning (RL) from outcome-based rewards  enhances text-based reasoning, understanding how agents autonomously learn to leverage external tools like code execution remains crucial. We investigate RL from outcome-based rewards for Tool-Integrated Reasoning, ZeroTIR, training base LLMs to spontaneously generate and execute Python code for mathematical problems without supervised tool-use examples. Our central contribution is we demonstrate that as RL training progresses, key metrics scale predictably. Specifically, we observe strong positive correlations where increased training steps lead to increases in the spontaneous code execution frequency, the average response length, and, critically, the final task accuracy. This suggests a quantifiable relationship between computational effort invested in training and the emergence of effective, tool-augmented reasoning strategies. We implement a robust framework featuring a decoupled code execution environment and validate our findings across standard RL algorithms and frameworks. Experiments show ZeroTIR significantly surpasses non-tool ZeroRL baselines on challenging math benchmarks. Our findings provide a foundational understanding of how autonomous tool use is acquired and scales within Agent RL, offering a reproducible benchmark for future studies. Code is released at \\href{https://github.com/yyht/openrlhf_async_pipline}{https://github.com/yyht/openrlhf\\_async\\_pipline}.", "similarity": 0.765845537185669, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.44999999999999996, "specificity_informativeness": 0.175, "is_leaf": true, "avg_score": 3.5, "variance": 1.6666666666666667, "avg_rating": 3.5, "var_rating": 1.6666666666666667, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.9166666666666666, "avg_significance": 2.25, "var_significance": 0.9166666666666666, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "61", "parentIds": ["77"], "name": "Solver-Informed RL: Grounding Large Language Models for Authentic Optimization Modeling. Optimization modeling is fundamental to decision-making in fields such as supply chain management, logistics, a", "full_text": "Solver-Informed RL: Grounding Large Language Models for Authentic Optimization Modeling. Optimization modeling is fundamental to decision-making in fields such as supply chain management, logistics, and financial engineering, but its complexity presents a major barrier to adoption. Automating model creation from natural language is key to improving efficiency and access. However, while Large Language Models (LLMs) are a promising tool for this, they often produce flawed or infeasible results due to errors and hallucinations.\n   To address this issue, we propose Solver-Informed Reinforcement Learning (SIRL), a framework that uses Reinforcement Learning with Verifiable Reward to improve LLMs’ ability to generate accurate and executable optimization models. Specifically, SIRL automatically assesses the executable code and the instance-level mathematical model represented by the associated .lp files. This process yields precise feedback on syntactic validity, feasibility, and solution quality, which serves as a direct reward signal to guide the reinforcement learning process. Furthermore, this verification mechanism also supports our instance-enhanced self-consistency method for creating high-quality training data.\n    Extensive experiments on diverse public benchmarks demonstrate that models trained with our SIRL framework achieve state-of-the-art performance, substantially outperforming existing methods in generating accurate and executable optimization models. Specifically, our SIRL-32B model surpasses DeepSeek-V3 and OpenAI-o3 on the majority of these benchmarks.\n    Our code is publicly available at https://github.com/Cardinal-Operations/SIRL.", "similarity": 0.6780867576599121, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.44999999999999996, "specificity_informativeness": 0.325, "is_leaf": true, "avg_score": 4.0, "variance": 0.5, "avg_rating": 4.0, "var_rating": 0.5, "avg_quality": 2.8, "var_quality": 0.7, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 2.6, "var_significance": 0.8, "avg_originality": 2.6, "var_originality": 0.3}, {"id": "62", "parentIds": ["64"], "name": "Think-RM: Enabling Long-Horizon Reasoning in Generative Reward Models. Reinforcement learning from human feedback (RLHF) has become a powerful post-training paradigm for aligning large language models", "full_text": "Think-RM: Enabling Long-Horizon Reasoning in Generative Reward Models. Reinforcement learning from human feedback (RLHF) has become a powerful post-training paradigm for aligning large language models with human preferences. A core challenge in RLHF is constructing accurate reward signals, where the conventional Bradley-Terry reward models (BT RMs) often suffer from sensitivity to data size and coverage, as well as vulnerability to reward hacking. Generative reward models (GenRMs) offer a more robust alternative by generating chain-of-thought (CoT) rationales followed by a final verdict. However, existing GenRMs rely on shallow, vertically scaled reasoning, limiting their capacity to handle nuanced or complex tasks. Moreover, their pairwise preference outputs are incompatible with standard RLHF algorithms that require pointwise reward signals. In this work, we introduce Think-RM, a training framework that enables long-horizon reasoning in GenRMs by modeling an internal thinking process. Rather than producing structured, externally provided rationales, Think-RM generates flexible, self-guided reasoning traces that support advanced capabilities such as self-reflection, hypothetical reasoning, and divergent reasoning. To elicit these reasoning abilities, we first warm-up the models by supervised fine-tuning (SFT) over long CoT data. We then further improve the model's long-horizon abilities by rule-based reinforcement learning (RL). In addition, we propose a novel pairwise RLHF pipeline that directly optimizes policies from pairwise comparisons, eliminating the need for pointwise reward conversion. Experiments show that Think-RM outperforms baselines on both in-distribution and out-of-distribution tasks, with particularly strong gains on reasoning-heavy benchmarks: more than 10\\% and 5\\% on RewardBench's Chat Hard and Reasoning, and 12\\% on RM-Bench's Math domain. When combined with our pairwise RLHF pipeline, it demonstrates superior end-policy performance compared to traditional approaches. This depth-oriented approach not only broadens the GenRM design space but also establishes a new paradigm for preference-based policy optimization in RLHF.", "similarity": 0.8227683305740356, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 1.5833333333333333, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.25, "var_originality": 0.25}, {"id": "63", "parentIds": ["90"], "name": "Optimizing Anytime Reasoning via Budget Relative Policy Optimization. Scaling test-time compute is crucial for enhancing the reasoning capabilities of large language models (LLMs). Existing approaches", "full_text": "Optimizing Anytime Reasoning via Budget Relative Policy Optimization. Scaling test-time compute is crucial for enhancing the reasoning capabilities of large language models (LLMs). Existing approaches typically employ reinforcement learning (RL) to maximize a verifiable reward obtained at the end of reasoning traces. However, such methods optimize only the final performance under a large and fixed token budget, which hinders efficiency in both training and deployment. In this work, we present **AnytimeReasoner**, a novel framework for optimizing reasoning performance under varying thinking budget constraints. To achieve this, we truncate the complete thinking process to fit within sampled token budgets from a prior distribution, compelling the model to summarize the optimal answer for each truncated thinking for verification. This introduces verifiable dense rewards into the reasoning process, facilitating more effective credit assignment in RL optimization. We then optimize the thinking and summary policies in a decoupled manner to maximize the cumulative reward. Additionally, we introduce a novel variance reduction technique, **Budget Relative Policy Optimization (BRPO)**, to enhance the robustness and efficiency of the learning process when reinforcing the thinking policy. Empirical results in mathematical reasoning tasks demonstrate that our method consistently outperforms GRPO across all thinking budgets under various prior distributions, enhancing both training and token efficiency.", "similarity": 0.7592107057571411, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.0, "variance": 0.6666666666666666, "avg_rating": 4.0, "var_rating": 0.6666666666666666, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "64", "parentIds": ["108"], "name": "Generative reward models that incorporate chain-of-thought reasoning processes enhance the alignment of large language models with human preferences. These models leverage extended reasoning at test t", "full_text": "Generative reward models that incorporate chain-of-thought reasoning processes enhance the alignment of large language models with human preferences. These models leverage extended reasoning at test time to improve reward accuracy and robustness compared to conventional approaches. By enabling deliberate reasoning before generating final reward signals, such models demonstrate superior performance on complex reasoning tasks and can be integrated into reinforcement learning frameworks to optimize model outputs according to human feedback.", "similarity": null, "summary_blocked": false, "evalScore": null, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": null, "specificity_informativeness": null, "is_leaf": false, "avg_score": 4.25, "variance": 0.5, "avg_rating": 4.25, "var_rating": 0.5, "avg_quality": 2.875, "var_quality": 0.7916666666666666, "avg_clarity": 2.625, "var_clarity": 0.9583333333333333, "avg_significance": 2.625, "var_significance": 0.4583333333333333, "avg_originality": 2.625, "var_originality": 0.125}, {"id": "65", "parentIds": ["104"], "name": "Reinforcement learning enhances language model reasoning capabilities beyond what base models can achieve through sampling alone. Both studies demonstrate that RL training enables models to develop im", "full_text": "Reinforcement learning enhances language model reasoning capabilities beyond what base models can achieve through sampling alone. Both studies demonstrate that RL training enables models to develop improved reasoning strategies across complex tasks, with gains that extend beyond simply amplifying existing high-reward outputs. The improvements manifest across multiple dimensions of reasoning performance, including better handling of challenging problems and more robust generalization. These enhancements depend on training methodology and duration, with careful design of RL pipelines—such as appropriate reward structures and training configurations—being critical for achieving reliable performance gains on reasoning benchmarks. The findings suggest that RL fundamentally shapes how models approach reasoning problems rather than merely optimizing surface-level accuracy metrics.", "similarity": null, "summary_blocked": false, "evalScore": null, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": null
