window.__EMBEDDED_TREE_DATA__ = [{"id": "0", "parentIds": ["71"], "name": "The Overthinker's DIET: Cutting Token Calories with DIfficulty-AwarE Training. Recent large language models (LLMs) exhibit impressive reasoning but often \\textit{overthink}, generating excessively lon", "full_text": "The Overthinker's DIET: Cutting Token Calories with DIfficulty-AwarE Training. Recent large language models (LLMs) exhibit impressive reasoning but often \\textit{overthink}, generating excessively long responses that hinder efficiency. We introduce DIET (DIfficulty-AwarE Training), a framework that systematically cuts these \"token calories\" by integrating on-the-fly problem difficulty into the reinforcement learning (RL) process. DIET dynamically adapts token compression strategies by modulating token penalty strength and conditioning target lengths on estimated task difficulty, to optimize the performance-efficiency trade-off. We also theoretically analyze the pitfalls of naive reward weighting in group-normalized RL algorithms like GRPO, and propose \\textit{Advantage Weighting} technique, which enables stable and effective implementation of these difficulty-aware objectives. Experimental results demonstrate that DIET significantly reduces token counts while simultaneously improving reasoning performance. Beyond raw token reduction, we show two crucial benefits largely overlooked by prior work: (1) DIET leads to superior \\textbf{inference scaling}. By maintaining high per-sample quality with fewer tokens, it enables better scaling performance via majority voting under fixed computational budgets, an area where other methods falter. (2) DIET enhances the natural positive correlation between response length and problem difficulty, ensuring verbosity is appropriately allocated, unlike many existing compression methods that disrupt this relationship. Our analyses provide a principled and effective framework for developing more efficient, practical, and high-performing LLMs.", "similarity": 1.509087324142456, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.22499999999999998, "is_leaf": true, "avg_score": 4.333333333333333, "variance": 0.33333333333333337, "avg_rating": 4.333333333333333, "var_rating": 0.33333333333333337, "avg_quality": 2.6666666666666665, "var_quality": 0.33333333333333337, "avg_clarity": 3.0, "var_clarity": 1.0, "avg_significance": 2.6666666666666665, "var_significance": 0.33333333333333337, "avg_originality": 2.6666666666666665, "var_originality": 0.33333333333333337}, {"id": "1", "parentIds": ["66"], "name": "Absolute Zero: Reinforced Self-play Reasoning with Zero Data. Reinforcement learning with verifiable rewards (RLVR) has shown promise in enhancing the reasoning capabilities of large language models b", "full_text": "Absolute Zero: Reinforced Self-play Reasoning with Zero Data. Reinforcement learning with verifiable rewards (RLVR) has shown promise in enhancing the reasoning capabilities of large language models by learning directly from rule-based outcome rewards. Recent RLVR works that operate under the zero setting avoid supervision in labeling the reasoning process, but still depend on manually curated collections of questions and answers for training. The scarcity of high-quality, human-produced examples raises concerns about the long-term scalability of relying on human supervision, a challenge already evident in the domain of language model pretraining. Furthermore, in a hypothetical future where AI surpasses human intelligence, tasks provided by humans may offer limited learning potential for a superintelligent system. To address these concerns, we propose a new RLVR paradigm called Absolute Zero, in which a single model learns to propose tasks that maximize its own learning progress and improves reasoning by solving them, without relying on any external human or distillation data. Under this paradigm, we introduce the Absolute Zero Reasoner (AZR), a system that self-evolves its training curriculum and reasoning ability. AZR uses a code executor to both validate self-proposed code reasoning tasks and verify answers, serving as an unified source of verifiable feedback to guide open-ended yet grounded learning. Despite being trained entirely without external data, AZR achieves overall SOTA performance on coding and mathematical reasoning tasks, outperforming existing zero-setting models that rely on tens of thousands of in-domain human-curated examples. Furthermore, we demonstrate that AZR can be effectively applied across different model scales and is compatible with various model classes.", "similarity": 1.4428741931915283, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.6499999999999999, "specificity_informativeness": 0.5, "is_leaf": true, "avg_score": 5.0, "variance": 0.0, "avg_rating": 5.0, "var_rating": 0.0, "avg_quality": 3.6666666666666665, "var_quality": 0.33333333333333337, "avg_clarity": 3.6666666666666665, "var_clarity": 0.33333333333333337, "avg_significance": 3.3333333333333335, "var_significance": 0.33333333333333337, "avg_originality": 3.3333333333333335, "var_originality": 0.33333333333333337}, {"id": "2", "parentIds": ["89"], "name": "Act Only When It Pays: Efficient Reinforcement Learning for LLM Reasoning via Selective Rollouts. Reinforcement learning, such as PPO and GRPO, has powered recent breakthroughs in LLM reasoning. Scali", "full_text": "Act Only When It Pays: Efficient Reinforcement Learning for LLM Reasoning via Selective Rollouts. Reinforcement learning, such as PPO and GRPO, has powered recent breakthroughs in LLM reasoning. Scaling rollout to sample more prompts enables models to selectively use higher-quality data for training, which can stabilize RL training and improve model performance, but at the cost of significant computational overhead. In this paper, we first show that a substantial portion of this overhead can be avoided by skipping uninformative prompts before rollout. Our analysis of reward dynamics reveals a strong temporal consistency in prompt value: prompts that are uninformative in one epoch of training are likely to remain uninformative in near future epochs. Based on these insights, we propose GRESO (GRPO with Efficient Selective Rollout), an online, lightweight pre-rollout filtering algorithm that predicts and skips uninformative prompts using reward training dynamics. By evaluating GRESO on a broad range of math reasoning benchmarks and models, like Qwen2.5-Math-1.5B, DeepSeek-R1-Distill-Qwen-1.5B, Qwen2.5-Math-7B, Qwen2.5-14B, and Qwen2.5-32B, we show that GRESO achieves up to 2.4x wall-clock time speedup in rollout and up to 2.0x speedup in total training time without accuracy degradation. We make our code publicly available at https://github.com/Infini-AI-Lab/GRESO/.", "similarity": 1.4828941822052002, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.55, "specificity_informativeness": 0.325, "is_leaf": true, "avg_score": 4.0, "variance": 0.6666666666666666, "avg_rating": 4.0, "var_rating": 0.6666666666666666, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "3", "parentIds": ["94"], "name": "ReMA: Learning to Meta-Think for LLMs with Multi-agent Reinforcement Learning. Recent research on Reasoning of Large Language Models (LLMs) has sought to further enhance their performance by integrati", "full_text": "ReMA: Learning to Meta-Think for LLMs with Multi-agent Reinforcement Learning. Recent research on Reasoning of Large Language Models (LLMs) has sought to further enhance their performance by integrating meta-thinking—enabling models to monitor, evaluate, and control their reasoning processes for more adaptive and effective problem-solving.\nHowever, current single-agent work lacks a specialized design for acquiring meta-thinking, resulting in low efficacy.\nTo address this challenge, we introduce Reinforced Meta-thinking Agents (ReMA), a novel framework that leverages Multi-Agent Reinforcement Learning (MARL) to elicit meta-thinking behaviors, encouraging LLMs to think about thinking.\nReMA decouples the reasoning process into two hierarchical agents: a high-level meta-thinking agent responsible for generating strategic oversight and plans, and a low-level reasoning agent for detailed executions.\nThrough iterative reinforcement learning with aligned objectives, these agents explore and learn collaboration, leading to improved generalization and robustness.\nEmpirical results from single-turn experiments demonstrate that ReMA outperforms single-agent RL baselines on complex reasoning tasks, including competitive-level mathematical benchmarks and LLM-as-a-Judge benchmarks.\nAdditionally, we further extend ReMA to multi-turn interaction settings, leveraging turn-level ratio and parameter sharing to improve efficiency.\nComprehensive ablation studies further illustrate the evolving dynamics of each distinct agent, providing valuable insights into how the meta-thinking reasoning process enhances the reasoning capabilities of LLMs.", "similarity": 1.3451690673828125, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.0, "variance": 1.3333333333333333, "avg_rating": 4.0, "var_rating": 1.3333333333333333, "avg_quality": 3.0, "var_quality": 0.0, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 3.0, "var_significance": 0.0, "avg_originality": 3.0, "var_originality": 0.6666666666666666}, {"id": "4", "parentIds": ["80"], "name": "$Q\\sharp$: Provably Optimal Distributional RL for LLM Post-Training. Reinforcement learning (RL) post-training is crucial for LLM alignment and reasoning, but existing policy-based methods, such as PP", "full_text": "$Q\\sharp$: Provably Optimal Distributional RL for LLM Post-Training. Reinforcement learning (RL) post-training is crucial for LLM alignment and reasoning, but existing policy-based methods, such as PPO and DPO, can fall short of fixing shortcuts inherited from pre-training. In this work, we introduce $Q\\sharp$, a value-based algorithm for KL-regularized RL that guides the reference policy using the optimal regularized $Q$ function. We propose to learn the optimal $Q$ function using distributional RL on an aggregated online dataset. Unlike prior value-based baselines that guide the model using unregularized $Q$-values, our method is theoretically principled and provably learns the optimal policy for the KL-regularized RL problem. Empirically, $Q\\sharp$ outperforms prior baselines in math reasoning benchmarks while maintaining a smaller KL divergence to the reference policy. Theoretically, we establish a reduction from KL-regularized RL to no-regret online learning, providing the first bounds for deterministic MDPs under only realizability. Thanks to distributional RL, our bounds are also variance-dependent and converge faster when the reference policy has small variance. In sum, our results highlight $Q\\sharp$ as an effective approach for post-training LLMs, offering both improved performance and theoretical guarantees. The code can be found at \\url{https://github.com/jinpz/q_sharp}.", "similarity": 1.420008659362793, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.35, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 2.75, "var_quality": 0.9166666666666666, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "5", "parentIds": ["81"], "name": "Exploring Data Scaling Trends and Effects in Reinforcement Learning from Human Feedback. Reinforcement Learning from Human Feedback (RLHF) is essential for aligning large language models (LLMs) with h", "full_text": "Exploring Data Scaling Trends and Effects in Reinforcement Learning from Human Feedback. Reinforcement Learning from Human Feedback (RLHF) is essential for aligning large language models (LLMs) with human preferences and values. While recent research has primarily focused on algorithmic advancements—such as reducing computational overhead or strengthening reward models to mitigate reward hacking—the critical role of prompt-data construction and its scalability has received comparatively less attention. In this paper, we address this gap by systematically exploring data-driven bottlenecks that currently hinder RLHF performance scaling, focusing specifically on the challenges posed by reward hacking and decreasing response diversity.\nTo mitigate reward hacking, we introduce a hybrid reward system combining reasoning task verifiers (RTV) and a generative reward model (GenRM). This approach not only exhibits enhanced resistance to reward hacking, but also enables accurate assessment of responses against clearly defined ground-truth solutions. Additionally, in order to ensure response diversity and enhance learning effectiveness, we propose a novel prompt-selection method named \\textbf{Pre-PPO}, explicitly identifying training prompts that are inherently challenging and thus less prone to reward hacking. Furthermore, we find that \\textbf{prioritizing mathematical and coding tasks during the early phases of RLHF training} significantly boosts performance, given that these tasks naturally encode fine-grained response distinctions and possess clearly defined ground truths.\nThrough comprehensive experiments conducted across two model sizes, we validate the effectiveness and scalability of our proposed methods. Results show that RTV exhibits the strongest resistance to reward hacking, followed by GenRM with ground truth, and finally GenRM relying on SFT Best-of-N responses. Moreover, our proposed strategies enable the model to rapidly capture subtle task-specific distinctions, leading to substantial improvements in overall RLHF performance. This work underscores the importance of careful data construction and provides practical methodologies to overcome critical performance barriers in RLHF.", "similarity": 1.2928192615509033, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.22499999999999998, "is_leaf": true, "avg_score": 3.75, "variance": 0.9166666666666666, "avg_rating": 3.75, "var_rating": 0.9166666666666666, "avg_quality": 2.5, "var_quality": 1.0, "avg_clarity": 2.25, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "6", "parentIds": ["93"], "name": "Diversity-Aware Policy Optimization for Large Language Model Reasoning. The reasoning capabilities of large language models (LLMs) have advanced rapidly, particularly following the release of DeepSeek", "full_text": "Diversity-Aware Policy Optimization for Large Language Model Reasoning. The reasoning capabilities of large language models (LLMs) have advanced rapidly, particularly following the release of DeepSeek-R1, which has inspired a surge of research into data quality and reinforcement learning (RL) algorithms. Despite the pivotal role diversity plays in RL, its influence on LLM reasoning remains largely underexplored. To bridge this gap, this work presents a systematic investigation into the impact of diversity in RL-based training for LLM reasoning, and proposes a novel diversity-aware policy optimization method. Across evaluations on 12 LLMs, we observe a strong positive correlation between the solution diversity and potential@k (a novel metric quantifying an LLM’s reasoning potential) in high-performing models. This finding motivates our method to explicitly promote diversity during RL training. Specifically,  we design a token-level diversity and reformulate it into a practical objective, then we selectively apply it to positive samples. Integrated into the R1-zero training framework, our method achieves a 3.5\\% average improvement across four mathematical reasoning benchmarks, while generating more diverse and robust solutions.", "similarity": 1.557905673980713, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.4, "specificity_informativeness": 0.525, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 3.0, "var_originality": 0.6666666666666666}, {"id": "7", "parentIds": ["69"], "name": "Co-Evolving LLM Coder and Unit Tester via Reinforcement Learning. Mathematical reasoning in large language models has been successfully incentivized through reinforcement learning with verifiable rewa", "full_text": "Co-Evolving LLM Coder and Unit Tester via Reinforcement Learning. Mathematical reasoning in large language models has been successfully incentivized through reinforcement learning with verifiable rewards, leading to improved one-shot precision. In this work, we turn our focus to the coding domain. Beyond one-shot precision, we highlight unit test generation as another key factor for enhancing coding ability, since accurate unit tests are essential for enabling self-checking and self-correction during inference.\nTraditional approaches for fine-tuning LLMs on unit test generation rely heavily on ground-truth code solutions in the training data. We propose CURE, a novel reinforcement learning framework with a dedicated reward design that co-evolves coding and unit test generation capabilities based on their interaction outcomes—without any ground-truth code as supervision. This approach enables flexible and scalable training and allows the unit tester to learn directly from the coder’s mistakes.\nThrough extensive evaluations, we demonstrate that our CURE models, derived from base models of varying sizes, excel in both code generation and unit test generation. They naturally extend to downstream tasks such as test-time scaling—achieving a 6.2\\% improvement over the base model—and agentic unit test generation, with a 25.1\\% improvement. Our 4B model consistently outperforms Qwen3-4B while achieving 64.8\\% inference efficiency in unit test generation. Notably, we also find that the CURE model can serve as an effective reward model for reinforcement learning on base models, even in the absence of any labeled supervision.", "similarity": 1.3476142883300781, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.7, "specificity_informativeness": 0.5, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.25, "var_quality": 0.25, "avg_clarity": 3.75, "var_clarity": 0.25, "avg_significance": 3.25, "var_significance": 0.25, "avg_originality": 2.75, "var_originality": 0.9166666666666666}, {"id": "8", "parentIds": ["87"], "name": "On the Effect of Negative Gradient in Group Relative Deep Reinforcement Optimization. Reinforcement learning (RL) has become popular in enhancing the reasoning capabilities of large language models (L", "full_text": "On the Effect of Negative Gradient in Group Relative Deep Reinforcement Optimization. Reinforcement learning (RL) has become popular in enhancing the reasoning capabilities of large language models (LLMs), with Group Relative Policy Optimization (GRPO) emerging as a widely used algorithm in recent systems. Despite GRPO's widespread adoption, we identify a previously unrecognized phenomenon we term Lazy Likelihood Displacement (LLD), wherein the likelihood of correct responses marginally increases or even decreases during training. This behavior mirrors a recently discovered misalignment issue in Direct Preference Optimization (DPO), attributed to the influence of negative gradients. We provide a theoretical analysis of GRPO’s learning dynamic, identifying the source of LLD as the naive penalization of all tokens in incorrect responses with the same strength. To address this, we develop a method called NTHR, which downweights penalties on tokens contributing to the LLD. Unlike prior DPO-based approaches, NTHR takes advantage of GRPO’s group-based structure, using correct responses as anchors to identify influential tokens. Experiments on math reasoning benchmarks demonstrate that NTHR effectively mitigates LLD, yielding consistent performance gains across models ranging from 0.5B to 3B parameters.", "similarity": 1.30939519405365, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 3.75, "variance": 0.25, "avg_rating": 3.75, "var_rating": 0.25, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 3.5, "var_clarity": 0.3333333333333333, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "9", "parentIds": ["75"], "name": "Beyond Verifiable Rewards: Scaling Reinforcement Learning in Language Models to Unverifiable Data. We propose to scale RL to unverifiable data with a novel algorithm JEPO (Jensen's Evidence lower boun", "full_text": "Beyond Verifiable Rewards: Scaling Reinforcement Learning in Language Models to Unverifiable Data. We propose to scale RL to unverifiable data with a novel algorithm JEPO (Jensen's Evidence lower bound for Policy Optimization). While most prior effort on scaling RL for LLMs focuses on verifiable data where ground truth answers are typically short-form and can be matched easily, we investigate the case where such assumptions are less valid (e.g., when answers are long-form such as mathematical proofs). To scale RL training to unverifiable data with contemporary training constraints, we propose JEPO. JEPO applies Jensen's evidence lower bound, a pragmatic simplification of the evidence lower bound which views chain-of-thought as a latent variable in the generative process. We show that on verifiable datasets (math), JEPO is as effective as RL with verifiable reward; on semi-verifiable and unverifiable datasets (numina and numina-proof), JEPO improves on soft-match based evaluations compared to RL with verifiable reward which can only leverage a subset of the data source as well as test set likelihood evaluations.", "similarity": 1.3714148998260498, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.8, "specificity_informativeness": 0.8, "is_leaf": true, "avg_score": 4.0, "variance": 0.6666666666666666, "avg_rating": 4.0, "var_rating": 0.6666666666666666, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.9166666666666666, "avg_originality": 2.75, "var_originality": 0.9166666666666666}, {"id": "10", "parentIds": ["91", "68", "65"], "name": "ReasonFlux-PRM: Trajectory-Aware PRMs for Long Chain-of-Thought Reasoning in LLMs. Process Reward Models (PRMs) have recently emerged as a powerful framework for supervising intermediate reasoning ste", "full_text": "ReasonFlux-PRM: Trajectory-Aware PRMs for Long Chain-of-Thought Reasoning in LLMs. Process Reward Models (PRMs) have recently emerged as a powerful framework for supervising intermediate reasoning steps in large language models (LLMs). Previous PRMs are primarily trained on model final output responses and struggle to evaluate intermediate thinking trajectories robustly, especially in the emerging setting of trajectory–response outputs generated by frontier reasoning models like Deepseek-R1.  In this work, we introduce ReasonFlux-PRM, a novel trajectory-aware PRM explicitly designed to evaluate the trajectory-response type of reasoning traces. ReasonFlux-PRM incorporates both step-level and trajectory-level supervision, enabling fine-grained reward assignment aligned with structured chain-of-thought data. We adapt ReasonFlux-PRM to support reward supervision under both offline and online settings, including (i) selecting high-quality model distillation data for downstream supervised fine-tuning of smaller models, (ii) providing dense process-level rewards for policy optimization during reinforcement learning, and (iii) enabling reward-guided Best-of-N test-time scaling.  Empirical results on challenging downstream benchmarks such as AIME, MATH500, and GPQA-Diamond demonstrate that ReasonFlux-PRM-7B selects higher quality data than strong PRMs (e.g., Qwen2.5-Math-PRM-72B) and human-curated baselines. Furthermore, ReasonFlux-PRM-7B yields consistent performance improvements, achieving average gains of 12.1\\% in supervised fine-tuning, 4.5\\% in reinforcement learning, and 6.3\\% in test-time scaling. We also release an efficient ReasonFlux-PRM-1.5B for resource-constrained applications and edge deployment. Our code and models are released at https://github.com/Gen-Verse/ReasonFlux.", "similarity": 1.4284770488739014, "summary_blocked": null, "evalScore": 0.6, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.4, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 3.0, "var_originality": 0.6666666666666666}, {"id": "11", "parentIds": ["80"], "name": "Trajectory Bellman Residual Minimization: A Simple Value-Based Method for LLM Reasoning. Policy-based methods currently dominate reinforcement learning (RL) pipelines for large language model (LLM) re", "full_text": "Trajectory Bellman Residual Minimization: A Simple Value-Based Method for LLM Reasoning. Policy-based methods currently dominate reinforcement learning (RL) pipelines for large language model (LLM) reasoning, leaving value-based approaches largely unexplored. We revisit the classical paradigm of Bellman Residual Minimization and introduce Trajectory Bellman Residual Minimization (TBRM), an algorithm that naturally adapts this idea to LLMs, yielding a simple yet effective off-policy algorithm that optimizes a single trajectory-level Bellman objective using the model's own logits as $Q$-values. TBRM removes the need for critics, importance-sampling ratios, or clipping, and can operate with only one rollout per prompt. We prove convergence to the near-optimal KL-regularized policy from arbitrary off-policy data via an improved change-of-trajectory-measure analysis. Experiments on standard mathematical-reasoning benchmarks show that TBRM matches or surpasses policy-based baselines, like PPO and GRPO, with comparable or lower computational and memory overhead. Our results indicate that value-based RL might be a principled and efficient alternative for enhancing reasoning capabilities in LLMs. The codebase for TBRM is publicly available at [https://github.com/rlx-lab/TBRM](https://github.com/rlx-lab/TBRM).", "similarity": 1.420008659362793, "summary_blocked": null, "evalScore": 0.6, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "12", "parentIds": ["70"], "name": "GPO: Learning from Critical Steps to Improve LLM Reasoning. Large language models (LLMs) are increasingly used in various domains, showing impressive potential on various tasks. \n    Recently, reasoni", "full_text": "GPO: Learning from Critical Steps to Improve LLM Reasoning. Large language models (LLMs) are increasingly used in various domains, showing impressive potential on various tasks. \n    Recently, reasoning LLMs have been proposed to improve the \\textit{reasoning} or \\textit{thinking} capabilities of LLMs to solve complex problems. \n    Despite the promising results of reasoning LLMs, enhancing the multi-step reasoning capabilities of LLMs still remains a significant challenge. \n    While existing optimization methods have advanced the LLM reasoning capabilities, they often treat reasoning trajectories as a whole, without considering the underlying critical steps within the trajectory. In this paper, we introduce \\textbf{G}uided \\textbf{P}ivotal \\textbf{O}ptimization (GPO), a novel fine-tuning strategy that dives into the reasoning process to enable more effective improvements. \n    GPO first identifies the `critical step' within a reasoning trajectory - a point that the model must carefully proceed so as to succeed at the problem. We locate the critical step by estimating the advantage function.\n    GPO then resets the policy to the critical step and samples the new rollout and prioritizes learning process on those rollouts. \n    This focus allows the model to learn more effectively from pivotal moments within the reasoning process to improve the reasoning performance.\n    We demonstrate that GPO is not a standalone method, but rather a general strategy that can be integrated with various optimization methods to improve reasoning performance. \n    Besides theoretical analysis, our experiments across challenging reasoning benchmarks show that GPO can consistently and significantly enhances the performance of existing optimization methods, showcasing its effectiveness and generalizability in improving LLM reasoning by concentrating on pivotal moments within the generation process.", "similarity": 1.4403833150863647, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.44999999999999996, "specificity_informativeness": 0.5, "is_leaf": true, "avg_score": 4.333333333333333, "variance": 0.33333333333333337, "avg_rating": 4.333333333333333, "var_rating": 0.33333333333333337, "avg_quality": 3.0, "var_quality": 0.0, "avg_clarity": 2.6666666666666665, "var_clarity": 0.33333333333333337, "avg_significance": 2.3333333333333335, "var_significance": 0.33333333333333337, "avg_originality": 2.3333333333333335, "var_originality": 0.33333333333333337}, {"id": "13", "parentIds": ["79"], "name": "DisCO: Reinforcing Large Reasoning Models with Discriminative Constrained Optimization. The recent success and openness of DeepSeek-R1 have brought widespread attention to Group Relative Policy Optimi", "full_text": "DisCO: Reinforcing Large Reasoning Models with Discriminative Constrained Optimization. The recent success and openness of DeepSeek-R1 have brought widespread attention to Group Relative Policy Optimization (GRPO) as a reinforcement learning method for large reasoning models (LRMs). In this work, we analyze the GRPO objective under a binary reward setting and reveal an inherent limitation of question-level difficulty bias arising from its group relative advantage function. We also identify a connection between GRPO and traditional discriminative methods in supervised learning. Motivated by these insights, we introduce a new **Discriminative Constrained Optimization (DisCO)** framework for reinforcing LRMs, grounded in the principle of discriminative learning: increasing the scores of positive answers while decreasing those of negative ones. The main differences between DisCO and GRPO and its recent variants are: (1) it replaces the group relative objective with a discriminative objective defined by a scoring function; (2) it abandons clipping-based surrogates in favor of non-clipping RL surrogate objectives used as scoring functions; (3) it employs a simple yet effective constrained optimization approach to enforce the KL divergence constraint.  As a result, DisCO offers notable advantages over GRPO and its variants: (i)  it completely eliminates difficulty bias by adopting discriminative objectives; (ii) it addresses the entropy instability in GRPO and its variants through the use of non-clipping scoring functions and a constrained optimization approach, yielding long and stable training dynamics; (iii) it allows the incorporation of advanced discriminative learning techniques to address data imbalance, where a significant number of questions have more negative than positive generated answers during training. Our experiments on enhancing the mathematical reasoning capabilities of SFT-finetuned models show that DisCO significantly outperforms GRPO and its improved variants such as DAPO, achieving average gains of 7\\% over GRPO and 6\\% over DAPO across six benchmark tasks for a 1.5B model.", "similarity": 1.4760875701904297, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.4, "specificity_informativeness": 0.22499999999999998, "is_leaf": true, "avg_score": 5.0, "variance": 0.0, "avg_rating": 5.0, "var_rating": 0.0, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.25, "var_originality": 0.9166666666666666}, {"id": "14", "parentIds": ["85", "93"], "name": "Does Reinforcement Learning Really Incentivize Reasoning Capacity in LLMs Beyond the Base Model?. Reinforcement Learning with Verifiable Rewards (RLVR) has recently demonstrated notable success in enh", "full_text": "Does Reinforcement Learning Really Incentivize Reasoning Capacity in LLMs Beyond the Base Model?. Reinforcement Learning with Verifiable Rewards (RLVR) has recently demonstrated notable success in enhancing the reasoning performance of large language models (LLMs), particularly in mathematics and programming tasks. \nIt is widely believed that, similar to how traditional RL helps agents to explore and learn new strategies, RLVR enables LLMs to continuously self-improve, thus acquiring novel reasoning abilities that exceed the capacity of the corresponding base models. \nIn this study, we take a critical look at \\textit{the current state of RLVR} by systematically probing the reasoning capability boundaries of RLVR-trained LLMs across diverse model families, RL algorithms, and math/coding/visual reasoning benchmarks, using pass@\\textit{k} at large \\textit{k} values as the evaluation metric.\nWhile RLVR improves sampling efficiency towards the correct path, we surprisingly find that current training does \\emph{not} elicit fundamentally new reasoning patterns.\nWe observe that while RLVR-trained models outperform their base models at smaller values of $k$ (\\eg, $k$=1), base models achieve higher pass@$k$ score when $k$ is large.\nMoreover, we observe that the reasoning capability boundary of LLMs often narrows as RLVR training progresses.\nFurther coverage and perplexity analysis shows that the reasoning paths generated by RLVR models are already included in the base models' sampling distribution, suggesting that their reasoning abilities originate from and are \\textit{bounded} by the base model. \nFrom this perspective, treating the base model as an upper bound, our quantitative analysis shows that six popular RLVR algorithms perform similarly and remain far from optimal in fully leveraging the potential of the base model.\nIn contrast, we find that distillation can introduce new reasoning patterns from the teacher and genuinely expand the model’s reasoning capabilities.\nTaken together, our findings suggest that current RLVR methods have not fully realized the potential of RL to elicit genuinely novel reasoning abilities in LLMs. This underscores the need for improved RL paradigms—such as continual scaling and multi-turn agent-environment interaction—to unlock this potential.", "similarity": 1.5155761241912842, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.35, "is_leaf": true, "avg_score": 6.0, "variance": 0.0, "avg_rating": 6.0, "var_rating": 0.0, "avg_quality": 3.5, "var_quality": 0.3333333333333333, "avg_clarity": 3.75, "var_clarity": 0.25, "avg_significance": 3.5, "var_significance": 0.3333333333333333, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "15", "parentIds": ["84"], "name": "TTRL: Test-Time Reinforcement Learning. This paper investigates Reinforcement Learning (RL) on data without explicit labels for reasoning tasks in Large Language Models (LLMs). The core challenge of t", "full_text": "TTRL: Test-Time Reinforcement Learning. This paper investigates Reinforcement Learning (RL) on data without explicit labels for reasoning tasks in Large Language Models (LLMs). The core challenge of the problem is reward estimation during inference while not having access to ground-truth information. While this setting appears elusive, we find that common practices in Test-Time Scaling (TTS), such as majority voting, yield surprisingly effective rewards suitable for driving RL training. In this work, we introduce Test-Time Reinforcement Learning (TTRL), a novel method for training LLMs using RL on unlabeled data. TTRL enables self-evolution of LLMs by utilizing the priors in the pre-trained models. Our experiments demonstrate that TTRL consistently improves performance across a variety of tasks and models. Notably, TTRL boosts the pass@1 performance of Qwen-2.5-Math-7B by approximately 211% on the AIME 2024 with only unlabeled test data. Furthermore, although TTRL is only supervised by the Maj@N metric, TTRL has demonstrated performance to consistently surpass the upper limit of the initial model, and approach the performance of models trained directly on test data with ground-truth labels. Our experimental findings validate the general effectiveness of TTRL across various tasks and highlight TTRL's potential for broader tasks and domains.", "similarity": 1.4807755947113037, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.45, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 2.5, "var_clarity": 0.3333333333333333, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "16", "parentIds": ["74"], "name": "SPC: Evolving Self-Play Critic via Adversarial Games for LLM Reasoning. Evaluating the step-by-step reliability of large language model (LLM) reasoning, such as Chain-of-Thought, remains challenging d", "full_text": "SPC: Evolving Self-Play Critic via Adversarial Games for LLM Reasoning. Evaluating the step-by-step reliability of large language model (LLM) reasoning, such as Chain-of-Thought, remains challenging due to the difficulty and cost of obtaining high-quality step-level supervision. In this paper, we introduce Self-Play Critic (SPC), a novel approach where a critic model evolves its ability to assess reasoning steps through adversarial self-play games, eliminating the need for manual step-level annotation. SPC involves fine-tuning two copies of a base model to play two roles, namely a \"sneaky generator\" that deliberately produces erroneous steps designed to be difficult to detect, and a \"critic\" that analyzes the correctness of reasoning steps. These two models engage in an adversarial game in which the generator aims to fool the critic, while the critic model seeks to identify the generator's errors. Using reinforcement learning based on the game outcomes, the models iteratively improve; the winner of each confrontation receives a positive reward and the loser receives a negative reward, driving continuous self-evolution. Experiments on three reasoning process benchmarks (ProcessBench, PRM800K, DeltaBench) demonstrate that our SPC progressively enhances its error detection capabilities (e.g., accuracy increases from 70.8% to 77.7% on ProcessBench) and surpasses strong baselines, including distilled R1 model. Furthermore, SPC can guide the test-time search of diverse LLMs and significantly improve their mathematical reasoning performance on MATH500 and AIME2024, surpassing those guided by state-of-the-art process reward models.", "similarity": 1.446880578994751, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.44999999999999996, "specificity_informativeness": 0.25, "is_leaf": true, "avg_score": 4.4, "variance": 0.7999999999999999, "avg_rating": 4.4, "var_rating": 0.7999999999999999, "avg_quality": 3.2, "var_quality": 0.19999999999999998, "avg_clarity": 3.4, "var_clarity": 0.3, "avg_significance": 3.2, "var_significance": 0.7, "avg_originality": 2.8, "var_originality": 1.2}, {"id": "17", "parentIds": ["77"], "name": "Learning to Reason under Off-Policy Guidance. Recent advances in large reasoning models (LRMs) demonstrate that sophisticated behaviors such as multi-step reasoning and self-reflection can emerge via ", "full_text": "Learning to Reason under Off-Policy Guidance. Recent advances in large reasoning models (LRMs) demonstrate that sophisticated behaviors such as multi-step reasoning and self-reflection can emerge via reinforcement learning with verifiable rewards~(RLVR). \nHowever, existing RLVR approaches are inherently ``on-policy'', limiting learning to a model's own outputs and failing to acquire reasoning abilities beyond its initial capabilities. \nTo address this issue, we introduce LUFFY (Learning to reason Under oFF-policY guidance), a framework that augments RLVR with off-policy reasoning traces. \nLUFFY dynamically balances imitation and exploration by combining off-policy demonstrations with on-policy rollouts during training. \nSpecifically, LUFFY combines the Mixed-Policy GRPO framework, which has a theoretically guaranteed convergence rate, alongside policy shaping via regularized importance sampling to avoid superficial and rigid imitation during mixed-policy training. \nCompared with previous RLVR methods, LUFFY achieves an over +6.4 average gain across six math benchmarks and an advantage of over +6.2 points in out-of-distribution tasks.\nMost significantly, we show that LUFFY successfully trains weak models in scenarios where on-policy RLVR completely fails. These results provide compelling evidence that LUFFY transcends the fundamental limitations of on-policy RLVR and demonstrates the great potential of utilizing off-policy guidance in RLVR.", "similarity": 1.4474873542785645, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.325, "is_leaf": true, "avg_score": 4.666666666666667, "variance": 0.33333333333333337, "avg_rating": 4.666666666666667, "var_rating": 0.33333333333333337, "avg_quality": 2.6666666666666665, "var_quality": 0.33333333333333337, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 3.0, "var_significance": 1.0, "avg_originality": 2.6666666666666665, "var_originality": 0.33333333333333337}, {"id": "18", "parentIds": ["82", "93"], "name": "Accelerating RL for LLM Reasoning with Optimal Advantage Regression. Reinforcement learning (RL) has emerged as a powerful tool for fine-tuning large language models (LLMs) to improve complex reasonin", "full_text": "Accelerating RL for LLM Reasoning with Optimal Advantage Regression. Reinforcement learning (RL) has emerged as a powerful tool for fine-tuning large language models (LLMs) to improve complex reasoning abilities. However, state-of-the-art policy optimization methods often suffer from high computational overhead and memory consumption, primarily due to the need for multiple generations per prompt and the reliance on critic networks or advantage estimates of the current policy. In this paper, we propose $A^\\star$-PO, a novel two-stage policy optimization framework that directly approximates the optimal advantage function and enables efficient training of LLMs for reasoning tasks. In the first stage, we leverage offline sampling from a reference policy to estimate the optimal value function $V^\\star$, eliminating the need for costly online value estimation. In the second stage, we perform on-policy updates using a simple least-squares regression loss with only a single generation per prompt. Theoretically, we establish performance guarantees and prove that the KL-regularized RL objective can be optimized without requiring complex exploration strategies. Empirically, $A^\\star$-PO achieves competitive performance across a wide range of mathematical reasoning benchmarks, while reducing training time by up to 2$\\times$ and peak memory usage by over 30\\% compared to PPO, GRPO, and REBEL. Implementation of $A^\\star$-PO can be found at https://github.com/ZhaolinGao/A-PO.", "similarity": 1.6168147325515747, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.125, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 3.0, "var_clarity": 0.6666666666666666, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "19", "parentIds": ["88"], "name": "Reinforcing the Diffusion Chain of Lateral Thought with Diffusion Language Models. We introduce the Diffusion Chain of Lateral Thought (DCoLT), a reasoning framework for diffusion language models. DCo", "full_text": "Reinforcing the Diffusion Chain of Lateral Thought with Diffusion Language Models. We introduce the Diffusion Chain of Lateral Thought (DCoLT), a reasoning framework for diffusion language models. DCoLT treats each intermediate step in the reverse diffusion process as a latent \"thinking\" action and optimizes the entire reasoning trajectory to maximize the reward on the correctness of the final answer with outcome-based Reinforcement Learning (RL). Unlike traditional Chain-of-Thought (CoT) methods that follow a causal, linear thinking process, DCoLT allows bidirectional, non-linear reasoning with no strict rule on grammatical correctness amid its intermediate steps of thought. We implement DCoLT on two representative Diffusion Language Models (DLMs). First, we choose SEDD as a representative continuous-time discrete diffusion model, where its concrete score derives a probabilistic policy to maximize the RL reward over the entire sequence of intermediate diffusion steps.  We further consider the discrete-time masked diffusion language model -- LLaDA, and find that the order to predict and unmask tokens plays an essential role to optimize its RL action resulting from the ranking-based Unmasking Policy Module (UPM) defined by the Plackett-Luce model. Experiments on both math and code generation tasks show that using only public data and 16 H800 GPUs, DCoLT-reinforced DLMs outperform other DLMs trained by SFT or RL or even both. Notably, DCoLT-reinforced LLaDA boosts its reasoning accuracy by +9.8%, +5.7%, +11.4%, +19.5% on GSM8K, MATH, MBPP, and HumanEval.", "similarity": 1.4207345247268677, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.85, "specificity_informativeness": 0.575, "is_leaf": true, "avg_score": 4.0, "variance": 0.6666666666666666, "avg_rating": 4.0, "var_rating": 0.6666666666666666, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "20", "parentIds": ["86"], "name": "AdaSTaR: Adaptive Data Sampling for Training Self-Taught Reasoners. Self-Taught Reasoners (STaR), synonymously known as Rejection sampling Fine-Tuning (RFT), is an integral part of the training pipeli", "full_text": "AdaSTaR: Adaptive Data Sampling for Training Self-Taught Reasoners. Self-Taught Reasoners (STaR), synonymously known as Rejection sampling Fine-Tuning (RFT), is an integral part of the training pipeline of self-improving reasoning Language Models (LMs). \nThe self-improving mechanism often employs random observation (data) sampling. \nHowever, this results in trained observation imbalance; inefficiently over-training on solved examples while under-training on challenging ones. \nIn response, we introduce Adaptive STaR (AdaSTaR), a novel algorithm that rectifies this by integrating two adaptive sampling principles: (1) Adaptive Sampling for Diversity: promoting balanced training across observations, and (2) Adaptive Sampling for Curriculum: dynamically adjusting data difficulty to match the model's evolving strength. Across six benchmarks, AdaSTaR achieves best test accuracy in all instances (6/6) and reduces training FLOPs by an average of 58.6\\% against an extensive list of baselines. These improvements in performance and efficiency generalize to different pre-trained LMs and larger models, paving the way for more efficient and effective self-improving LMs.", "similarity": 1.3854126930236816, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.22499999999999998, "is_leaf": true, "avg_score": 4.25, "variance": 0.9166666666666666, "avg_rating": 4.25, "var_rating": 0.9166666666666666, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 2.5, "var_clarity": 0.3333333333333333, "avg_significance": 3.0, "var_significance": 0.6666666666666666, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "21", "parentIds": ["95"], "name": "Right Question is Already Half the Answer: Fully Unsupervised LLM Reasoning Incentivization. Existing methods to enhance the reasoning capability of large language models predominantly rely on supervi", "full_text": "Right Question is Already Half the Answer: Fully Unsupervised LLM Reasoning Incentivization. Existing methods to enhance the reasoning capability of large language models predominantly rely on supervised fine-tuning (SFT) followed by reinforcement learning (RL) on reasoning-specific data. These approaches critically depend on external supervisions--such as labeled reasoning traces, verified golden answers, or pre-trained reward models. In this work, we propose Entropy Minimized Policy Optimization (EMPO), which makes an early attempt at fully unsupervised LLM reasoning incentivization. By minimizing the semantic entropy of LLMs on unlabeled questions, EMPO achieves competitive performance compared to supervised counterparts. Specifically, without any supervised signals, EMPO boosts the accuracy of Qwen2.5-Math-7B Base from 33.7\\% to 51.6\\% on math benchmarks and improves the accuracy of Qwen2.5-7B Base from 32.1\\% to 50.1\\% on MMLU-Pro. Primary analysis are also provided to interpret the effectiveness of EMPO. Code is available at https://github.com/QingyangZhang/EMPO.", "similarity": 1.5243010520935059, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.44999999999999996, "specificity_informativeness": 0.4, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.5, "var_clarity": 0.3333333333333333, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 3.0, "var_originality": 0.6666666666666666}, {"id": "22", "parentIds": ["73"], "name": "BREAD: Branched Rollouts from Expert Anchors Bridge SFT & RL for Reasoning. Small language models (SLMs) struggle to learn complex reasoning behaviors, especially when high-quality traces are scarce o", "full_text": "BREAD: Branched Rollouts from Expert Anchors Bridge SFT & RL for Reasoning. Small language models (SLMs) struggle to learn complex reasoning behaviors, especially when high-quality traces are scarce or difficult to learn from. A typical approach for training such models combines a supervised fine-tuning (SFT) stage, often to distill reasoning capabilities from a larger model, followed by a reinforcement learning (RL) stage such as Group Relative Policy Optimization (GRPO). In this paper, we investigate the fundamental limitations of this SFT + RL paradigm and propose methods to overcome them. Using a toy student-expert model over Markov chains, we demonstrate that the SFT + RL strategy can fail completely when (1) the expert's traces are too difficult for the small model to express, or (2) the small model's initialization achieves exponentially sparse rewards as task complexity grows. To address these, we introduce BREAD, a GRPO variant that bridges SFT and RL via partial expert guidance and branch rollouts. When self-generated traces fail, BREAD adaptively inserts short expert prefixes/hints, allowing the small model to complete the rest of the reasoning path, and ensuring that each update includes at least one successful trace. This mechanism both densifies the reward signal and induces a natural learning curriculum. BREAD requires fewer than 40\\% of ground-truth traces, consistently outperforming standard GRPO while speeding up the training by about 3$\\times$. Importantly, we find that BREAD helps the model solve problems that are otherwise unsolvable by the SFT + RL strategy, highlighting how branch rollouts and expert guidance can aid SLM reasoning.", "similarity": 1.2445695400238037, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.7, "specificity_informativeness": 0.45, "is_leaf": true, "avg_score": 4.6, "variance": 0.30000000000000004, "avg_rating": 4.6, "var_rating": 0.30000000000000004, "avg_quality": 2.6, "var_quality": 0.3, "avg_clarity": 3.4, "var_clarity": 0.3, "avg_significance": 3.0, "var_significance": 0.5, "avg_originality": 2.6, "var_originality": 1.3}, {"id": "23", "parentIds": ["72"], "name": "SATURN: SAT-based Reinforcement Learning to Unleash LLMs Reasoning. How to design reinforcement learning (RL) tasks that effectively unleash the reasoning capability of large language models (LLMs) re", "full_text": "SATURN: SAT-based Reinforcement Learning to Unleash LLMs Reasoning. How to design reinforcement learning (RL) tasks that effectively unleash the reasoning capability of large language models (LLMs) remains an open question. Existing RL tasks (e.g., math, programming, and constructing reasoning tasks) suffer from three key limitations: (1) Scalability. They rely heavily on human annotation or expensive LLM synthesis to generate sufficient training data. (2) Verifiability. LLMs' outputs are hard to verify automatically and reliably. (3) Controllable Difficulty. Most tasks lack fine-grained difficulty control, making it hard to train LLMs to develop reasoning ability from easy to hard.\n\nTo address these limitations, we propose Saturn, a SAT-based RL framework that uses Boolean Satisfiability (SAT) problems to train and evaluate LLMs reasoning. Saturn enables scalable task construction, rule-based verification, and precise difficulty control. Saturn designs a curriculum learning pipeline that continuously improves LLMs' reasoning capability by constructing SAT tasks of increasing difficulty and training LLMs from easy to hard. To ensure stable training, we design a principled mechanism to control difficulty transitions.\n\nWe introduce Saturn-2.6k, a dataset of 2,660 SAT problems with varying difficulty. It supports the evaluation of how LLM reasoning changes with problem difficulty. We apply Saturn to DeepSeek-R1-Distill-Qwen and obtain Saturn-1.5B and Saturn-7B. We achieve several notable results:\n(1) On SAT problems, Saturn-1.5B and Saturn-7B achieve average pass@3 improvements of +14.0 and +28.1, respectively.\n(2) On math and programming tasks, Saturn-1.5B and Saturn-7B improve average scores by +4.9 and +1.8 on benchmarks (e.g., AIME, LiveCodeBench).\n(3) Compared to the state-of-the-art (SOTA) approach in constructing RL tasks, Saturn achieves further improvements of +8.8\\%.\nWe release the source code, data, and models to support future research.", "similarity": 1.4194409847259521, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.725, "specificity_informativeness": 0.725, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "24", "parentIds": ["92", "76"], "name": "SeRL: Self-play Reinforcement Learning for Large Language Models with Limited Data. Recent advances have demonstrated the effectiveness of Reinforcement Learning (RL) in improving the reasoning capabi", "full_text": "SeRL: Self-play Reinforcement Learning for Large Language Models with Limited Data. Recent advances have demonstrated the effectiveness of Reinforcement Learning (RL) in improving the reasoning capabilities of Large Language Models (LLMs). However, existing works inevitably rely on high-quality instructions and verifiable rewards for effective training, both of which are often difficult to obtain in specialized domains. In this paper, we propose Self-play Reinforcement Learning (SeRL) to bootstrap LLM training with limited initial data. Specifically, SeRL comprises two complementary modules: self-instruction and self-rewarding. The former module generates additional instructions based on the available data at each training step, employing comprehensive online filtering strategies to ensure instruction quality, diversity, and difficulty. The latter module introduces a simple yet effective majority-voting mechanism to estimate response rewards for additional instructions, eliminating the need for external annotations. Finally, SeRL performs conventional RL based on the generated data, facilitating iterative self-play learning.\nExtensive experiments on various reasoning benchmarks and across different LLM backbones demonstrate that the proposed SeRL yields results superior to its counterparts and achieves performance on par with those obtained by high-quality data with verifiable rewards. Our code is available at https://github.com/wantbook-book/SeRL.", "similarity": 1.4934473037719727, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.44999999999999996, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.75, "var_originality": 0.9166666666666666}, {"id": "25", "parentIds": ["74"], "name": "Incentivizing LLMs to Self-Verify Their Answers. Large Language Models (LLMs) have demonstrated remarkable progress in complex reasoning tasks through both post-training and test-time scaling laws. Wh", "full_text": "Incentivizing LLMs to Self-Verify Their Answers. Large Language Models (LLMs) have demonstrated remarkable progress in complex reasoning tasks through both post-training and test-time scaling laws. While prevalent test-time scaling approaches are often realized by using external reward models to guide the model generation process, we find that only marginal gains can be acquired when scaling a model post-trained on specific reasoning tasks. We identify that the limited improvement stems from distribution discrepancies between the specific post-trained generator and the general reward model. To address this, we propose a framework that incentivizes LLMs to self-verify their own answers. By unifying answer generation and verification within a single reinforcement learning (RL) process, we train models that can effectively assess the correctness of their own solutions. The trained model can further scale its performance at inference time by verifying its generations, without the need for external verifiers. We train our self-verification models based on Qwen2.5-Math-7B and DeepSeek-R1-Distill-Qwen-1.5B, demonstrating their capabilities across varying reasoning context lengths. Experiments on multiple mathematical reasoning benchmarks show that our models can not only improve post-training performance but also enable effective test-time scaling. Our code is available at https://github.com/mansicer/self-verification.", "similarity": 1.446880578994751, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.55, "specificity_informativeness": 0.725, "is_leaf": true, "avg_score": 4.0, "variance": 0.0, "avg_rating": 4.0, "var_rating": 0.0, "avg_quality": 2.75, "var_quality": 0.9166666666666666, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "26", "parentIds": ["87"], "name": "ReDit: Reward Dithering for Improved LLM Policy Optimization. DeepSeek-R1 has successfully enhanced Large Language Model (LLM) reasoning capabilities through its rule-based reward system. While it's a", "full_text": "ReDit: Reward Dithering for Improved LLM Policy Optimization. DeepSeek-R1 has successfully enhanced Large Language Model (LLM) reasoning capabilities through its rule-based reward system. While it's a ''perfect'' reward system that effectively mitigates reward hacking, such reward functions are often discrete. Our experimental observations suggest that discrete rewards can lead to gradient anomaly, unstable optimization, and slow convergence. To address this issue, we propose ReDit (Reward Dithering), a method that dithers the discrete reward signal by adding simple random noise. With this perturbed reward, exploratory gradients are continuously provided throughout the learning process, enabling smoother gradient updates and accelerating convergence. The injected noise also introduces stochasticity into flat reward regions, encouraging the model to explore novel policies and escape local optima. Experiments across diverse tasks demonstrate the effectiveness and efficiency of ReDit. On average, ReDit achieves performance comparable to vanilla GRPO with only approximately 10% the training steps, and furthermore, still exhibits a 4% performance improvement over vanilla GRPO when trained for a similar duration. Visualizations confirm significant mitigation of gradient issues with ReDit. Moreover, theoretical analyses are provided to further validate these advantages.", "similarity": 1.30939519405365, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.375, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 2.25, "var_quality": 0.25, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "27", "parentIds": ["78"], "name": "AceReason-Nemotron: Advancing Math and Code Reasoning through Reinforcement Learning. Despite recent progress in large-scale reinforcement learning (RL) for reasoning, the training recipe for building", "full_text": "AceReason-Nemotron: Advancing Math and Code Reasoning through Reinforcement Learning. Despite recent progress in large-scale reinforcement learning (RL) for reasoning, the training recipe for building high-performing reasoning models remains elusive. Key implementation details of frontier models, such as DeepSeek-R1, including data curation strategies and RL training recipe, are often omitted. Moreover, recent research indicates distillation remains more effective than RL for smaller models. In this work, we demonstrate that large-scale RL can significantly enhance the reasoning capabilities of strong, small- and mid-sized models, achieving results that surpass those of state-of-the-art distillation-based models. We systematically study the RL training process through extensive ablations and propose a simple yet effective approach: first training on math-only prompts, then on code-only prompts. \nNotably, we find that math-only RL not only significantly enhances the performance of strong distilled models on math benchmarks (e.g., +14.6\\% / +17.2\\% on AIME 2025 for the 7B / 14B models), but also code reasoning tasks (e.g., +6.8\\% / +5.8\\% on LiveCodeBench for the 7B / 14B models).  In addition, extended code-only RL further improves code benchmark performance while causing minimal degradation in math results.  We develop a robust data curation pipeline to collect challenging prompts with high-quality, verifiable answers and test cases to enable verification-based RL across both domains. The dataset will be released to support open research.\nFinally, we identify key experimental insights, including curriculum learning with progressively increasing response lengths and the stabilizing effect of on-policy parameter updates.  We find that RL not only elicits the foundational reasoning capabilities acquired during pretraining and supervised fine-tuning (SFT), but also pushes the limits of the model’s reasoning ability, enabling it to solve problems that were previously unsolvable.", "similarity": 1.4512929916381836, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.0, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "28", "parentIds": ["70"], "name": "Beyond the 80/20 Rule: High-Entropy Minority Tokens Drive Effective Reinforcement Learning for LLM Reasoning. Reinforcement Learning with Verifiable Rewards (RLVR) has emerged as a powerful approach t", "full_text": "Beyond the 80/20 Rule: High-Entropy Minority Tokens Drive Effective Reinforcement Learning for LLM Reasoning. Reinforcement Learning with Verifiable Rewards (RLVR) has emerged as a powerful approach to enhancing the reasoning capabilities of Large Language Models (LLMs), yet its underlying mechanisms remain insufficiently understood. In this work, we undertake a pioneering exploration of RLVR through the novel perspective of token entropy patterns, comprehensively analyzing how different tokens influence reasoning performance. By examining token entropy patterns in Chain-of-Thought (CoT) reasoning, we observe that only a small fraction (approximately 20\\%) of tokens exhibit high entropy, and these tokens semantically act as critical forks that steer the model toward diverse reasoning pathways. We further demonstrate that moderately increasing the entropy of these high-entropy tokens via decoding temperature adjustments leads to improved performance, quantitatively confirming their role as decision points in reasoning. We ultimately refine RLVR by restricting policy gradient updates to these forking tokens. Despite utilizing only 20\\% of tokens, our approach achieves comparable performance to full-gradient updates on the Qwen3-8B base model. Moreover, it demonstrates remarkable improvements on the larger Qwen3-32B base model, boosting AIME'25 scores by 11.04 and AIME'24 scores by 7.71. In contrast, training exclusively on the 80\\% lowest-entropy tokens leads to a marked decline in performance. These findings indicate that the efficacy of RLVR primarily arises from optimizing the high-entropy tokens that dictate key reasoning directions. Collectively, our results suggest promising avenues for optimizing RLVR algorithms by strategically leveraging the potential of these high-entropy minority tokens to further enhance the reasoning abilities of LLMs.", "similarity": 1.4403833150863647, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.75, "variance": 0.25, "avg_rating": 4.75, "var_rating": 0.25, "avg_quality": 3.5, "var_quality": 0.3333333333333333, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 3.5, "var_significance": 0.3333333333333333, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "29", "parentIds": ["83"], "name": "Behavior Injection: Preparing Language Models for Reinforcement Learning. Reinforcement learning (RL) has emerged as a powerful post-training technique to incentivize the reasoning ability of large la", "full_text": "Behavior Injection: Preparing Language Models for Reinforcement Learning. Reinforcement learning (RL) has emerged as a powerful post-training technique to incentivize the reasoning ability of large language models (LLMs). However, LLMs can respond very inconsistently to RL finetuning: some show substantial performance gains, while others plateau or even degrade. To understand this divergence, we analyze the per-step influence of the RL objective and identify two key conditions for effective post-training: (1) RL-informative rollout accuracy, and (2) strong data co-influence, which quantifies how much the training data affects performance on other samples. Guided by these insights, we propose behavior injection, a task-agnostic data augmentation scheme applied prior to RL. Behavior injection enriches the supervised finetuning (SFT) data by seeding exploratory and exploitative behaviors, effectively making the model more RL-ready. We evaluate our method across two reasoning benchmarks with multiple base models. The results demonstrate that our theoretically motivated augmentation can significantly increase the performance gain from RL over the pre-RL model.", "similarity": 1.448441982269287, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.55, "specificity_informativeness": 0.375, "is_leaf": true, "avg_score": 4.75, "variance": 0.25, "avg_rating": 4.75, "var_rating": 0.25, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 3.0, "var_significance": 0.6666666666666666, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "30", "parentIds": ["67"], "name": "AREAL: A Large-Scale Asynchronous Reinforcement Learning System for Language Reasoning. Reinforcement learning (RL) has become a trending paradigm for training large language models (LLMs), particular", "full_text": "AREAL: A Large-Scale Asynchronous Reinforcement Learning System for Language Reasoning. Reinforcement learning (RL) has become a trending paradigm for training large language models (LLMs), particularly for reasoning tasks. Effective RL for LLMs requires massive parallelization and poses an urgent need for efficient training systems. Most existing large-scale RL systems for LLMs are synchronous by alternating generation and training in a batch setting, where the rollouts in each training batch are generated by the same (or latest) model. This stabilizes RL training but suffers from severe system-level inefficiency. Generation must wait until the longest output in the batch is completed before model update, resulting in GPU underutilization. We present AReaL, a fully asynchronous RL  system that completely decouples generation from training. Rollout workers in AReaL continuously generate new outputs without waiting, while training workers update the model whenever a batch of data is collected. AReaL also incorporates a collection of system-level optimizations, leading to substantially higher GPU utilization. To stabilize RL training, AReaL balances the workload of rollout and training workers to control data staleness, and adopts a staleness-enhanced PPO variant to better handle outdated training samples. Extensive experiments on math and code reasoning benchmarks show that AReaL achieves up to 2.77x training speedup compared to synchronous systems with the same number of GPUs and matched or even improved final performance. The code of AReaL is available at https://github.com/inclusionAI/AReaL/.", "similarity": 1.2944891452789307, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.44999999999999996, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 5.0, "variance": 0.0, "avg_rating": 5.0, "var_rating": 0.0, "avg_quality": 3.25, "var_quality": 0.25, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 3.25, "var_significance": 0.25, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "31", "parentIds": ["89"], "name": "Improving Data Efficiency for LLM Reinforcement Fine-tuning Through Difficulty-targeted Online Data Selection and Rollout Replay. Reinforcement learning (RL) has become an effective approach for fine-", "full_text": "Improving Data Efficiency for LLM Reinforcement Fine-tuning Through Difficulty-targeted Online Data Selection and Rollout Replay. Reinforcement learning (RL) has become an effective approach for fine-tuning large language models (LLMs), particularly to enhance their reasoning capabilities. However, RL fine-tuning remains highly resource-intensive, and existing work has largely overlooked the problem of data efficiency. In this paper, we propose two techniques to improve data efficiency in LLM RL fine-tuning: difficulty-targeted online data selection and rollout replay. We introduce the notion of adaptive difficulty to guide online data selection, prioritizing questions of moderate difficulty that are more likely to yield informative learning signals. To estimate adaptive difficulty efficiently, we develop an attention-based framework that requires rollouts for only a small reference set of questions. The adaptive difficulty of the remaining questions is then estimated based on their similarity to this set. To further reduce rollout cost, we introduce a rollout replay mechanism inspired by experience replay in traditional RL. This technique reuses recent rollouts, lowering per-step computation while maintaining stable updates. Experiments across 6 LLM-dataset combinations show that our method reduces RL fine-tuning time by 23% to 62% while reaching the same level of performance as the original GRPO algorithm. \nOur code repository is available at https://github.com/ASTRAL-Group/data-efficient-llm-rl/.", "similarity": 1.4828941822052002, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.55, "specificity_informativeness": 0.325, "is_leaf": true, "avg_score": 4.0, "variance": 0.0, "avg_rating": 4.0, "var_rating": 0.0, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 2.25, "var_significance": 0.9166666666666666, "avg_originality": 2.25, "var_originality": 0.25}, {"id": "32", "parentIds": ["75"], "name": "Hybrid Latent Reasoning via Reinforcement Learning. Recent advances in large language models (LLMs) have introduced latent reasoning as a promising alternative to autoregressive reasoning. By performi", "full_text": "Hybrid Latent Reasoning via Reinforcement Learning. Recent advances in large language models (LLMs) have introduced latent reasoning as a promising alternative to autoregressive reasoning. By performing internal computation with hidden states from previous steps, latent reasoning benefit from more informative features rather than sampling a discrete chain-of-thought (CoT) path. Yet latent reasoning approaches are often incompatible with LLMs, as their continuous paradigm conflicts with the discrete nature of autoregressive generation. Moreover, these methods rely on CoT traces for training and thus fail to exploit the inherent reasoning patterns of LLMs. In this work, w
