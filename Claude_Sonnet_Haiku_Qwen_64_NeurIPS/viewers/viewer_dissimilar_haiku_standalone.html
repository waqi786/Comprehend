window.__EMBEDDED_TREE_DATA__ = [{"id": "0", "parentIds": ["64"], "name": "Distributional Autoencoders Know the Score. The Distributional Principal Autoencoder (DPA) combines distributionally correct reconstruction with principal-component-like interpretability of the encodi", "full_text": "Distributional Autoencoders Know the Score. The Distributional Principal Autoencoder (DPA) combines distributionally correct reconstruction with principal-component-like interpretability of the encodings. In this work, we provide exact theoretical guarantees on both fronts. First, we derive a closed-form relation linking each optimal level-set geometry to the data-distribution score. This result explains DPA's empirical ability to disentangle factors of variation of the data, as well as allows the score to be recovered directly from samples. When the data follows the Boltzmann distribution, we demonstrate that this relation yields an approximation of the minimum free-energy path for the Müller–Brown potential in a single fit. Second, we prove that if the data lies on a manifold that can be approximated by the encoder, latent components beyond the manifold dimension are conditionally independent of the data distribution - carrying no additional information - and thus reveal the intrinsic dimension. Together, these results show that a single model can learn the data distribution and its intrinsic dimension with exact guarantees simultaneously, unifying two longstanding goals of unsupervised learning.", "similarity": 0.5255228281021118, "summary_blocked": null, "evalScore": 0.0, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.75, "variance": 0.9166666666666666, "avg_rating": 4.75, "var_rating": 0.9166666666666666, "avg_quality": 3.25, "var_quality": 0.25, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "1", "parentIds": ["74"], "name": "SpecMAS: A Multi-Agent System for Self-Verifying System Generation via Formal Model Checking. We present SpecMAS, a novel multi-agent system that autonomously constructs and formally verifies executab", "full_text": "SpecMAS: A Multi-Agent System for Self-Verifying System Generation via Formal Model Checking. We present SpecMAS, a novel multi-agent system that autonomously constructs and formally verifies executable system models from natural language specifications. Given a Standard Operating Procedure (SOP) describing a target system, SpecMAS parses the specification, identifies relevant operational modes, variables, transitions, and properties, and generates a formal model in NuSMV code syntax, an industry-standard symbolic model checker. A dedicated reasoning agent extracts both explicit and implicit properties from the SOP, and verification is performed via temporal logic model checking. If any properties fail to verify, an autonomous debugging agent analyzes counterexamples and iteratively corrects the model until all properties are satisfied. This closed-loop system design guarantees provable correctness by construction and advances the state of the art in automated, interpretable, and deployable verification pipelines. We demonstrate the generality, correctness, and practical feasibility of SpecMAS across a set of representative case studies and propose a new benchmark dataset for the evaluation and comparison of model checking performance.", "similarity": 0.7077814340591431, "summary_blocked": null, "evalScore": 0.2, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.0, "is_leaf": true, "avg_score": 4.25, "variance": 0.9166666666666666, "avg_rating": 4.25, "var_rating": 0.9166666666666666, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 1.5833333333333333, "avg_significance": 3.0, "var_significance": 0.6666666666666666, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "2", "parentIds": ["87"], "name": "Near-Optimal Regret-Queue Length Tradeoff in Online Learning for Two-Sided Markets. We study a two-sided market, wherein, price-sensitive heterogeneous customers and servers arrive and join their resp", "full_text": "Near-Optimal Regret-Queue Length Tradeoff in Online Learning for Two-Sided Markets. We study a two-sided market, wherein, price-sensitive heterogeneous customers and servers arrive and join their respective queues.\nA compatible customer-server pair can then be matched by the platform, at which point, they leave the system.\nOur objective is to design pricing and matching algorithms that maximize the platform's profit, while maintaining reasonable queue lengths.\nAs the demand and supply curves governing the price-dependent arrival rates may not be known in practice, we design a novel online-learning-based pricing policy and establish its near-optimality. In particular, we prove a tradeoff among three performance metrics: $\\tilde{O}(T^{1-\\gamma})$ regret, $\\tilde{O}(T^{\\gamma/2})$ average queue length, and $\\tilde{O}(T^{\\gamma})$ maximum queue length for $\\gamma \\in (0, 1/6]$, significantly improving over existing results (Yang & Ying, 2024). Moreover, barring the permissible range of $\\gamma$, we show that this trade-off between regret and average queue length is optimal up to logarithmic factors under a class of policies, matching the optimal one as in (Varma et al., 2023) which assumes the demand and supply curves to be known.\nOur proposed policy has two noteworthy features: a dynamic component that optimizes the tradeoff between low regret and small queue lengths; and a probabilistic component that resolves the tension between obtaining useful samples for fast learning and maintaining small queue lengths.", "similarity": 0.573499858379364, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.22499999999999998, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 3.0, "var_clarity": 0.6666666666666666, "avg_significance": 3.0, "var_significance": 0.6666666666666666, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "3", "parentIds": ["79"], "name": "Dual-Comb Ghost Imaging with Transformer-Based Reconstruction for Optical Fiber Endomicroscopy. Endoscopic imaging is indispensable for visualizing internal organs, yet conventional systems remain bul", "full_text": "Dual-Comb Ghost Imaging with Transformer-Based Reconstruction for Optical Fiber Endomicroscopy. Endoscopic imaging is indispensable for visualizing internal organs, yet conventional systems remain bulky and costly because they rely on large, multi-element optics, which limits their ability to access and image certain areas of the body. Achieving high-quality endomicroscopy with hundred micron-scale and inexpensive hardware remains a grand challenge. Optical fibers offer a sub-millimeter-scale imaging conduit that could meet this need, but existing fiber-based approaches typically require either raster scanning or multicore bundles, which limit resolution and speed of imaging. In this work, we overcome these limitations by combining dual-comb interferometry with optical ghost imaging and advanced algorithm. Optical frequency combs enable precise and parallel speckle illumination via wavelength-division multiplexing through a single-core fiber, while our dual-comb compressive ghost imaging approach enables snapshot detection of bucket-sum signals using a single-pixel detector, eliminating the need for both spatial and spectral scanning. To reconstruct images from these highly compressed measurements, we introduce Optical Ghost-GPT, a transformer-based image reconstruction model that enables fast, high-fidelity recovery at low sampling rates. Our dual-comb ghost imaging approach, combined with the novel algorithm, outperforms classical ghost imaging techniques in both speed and accuracy, enabling real-time, high-resolution endoscopic imaging with a significantly reduced device footprint. This advancement paves the way for non-invasive, high-resolution, low-cost endomicroscopy and other sensing applications constrained by hardware size and complexity.", "similarity": 0.5596079230308533, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.0, "variance": 0.6666666666666666, "avg_rating": 4.0, "var_rating": 0.6666666666666666, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.0, "var_clarity": 0.6666666666666666, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 2.75, "var_originality": 0.9166666666666666}, {"id": "4", "parentIds": ["76"], "name": "A Cautionary Tale on Integrating Studies with Disparate Outcome Measures for Causal Inference. Data integration approaches are increasingly used to enhance the efficiency and generalizability of studi", "full_text": "A Cautionary Tale on Integrating Studies with Disparate Outcome Measures for Causal Inference. Data integration approaches are increasingly used to enhance the efficiency and generalizability of studies. However, a key limitation of these methods is the assumption that outcome measures are identical across datasets -- an assumption that often does not hold in practice. Consider the following opioid use disorder (OUD) studies: the XBOT trial and the POAT study, both evaluating the effect of medications for OUD on withdrawal symptom severity (not the primary outcome of either trial). While XBOT measures withdrawal severity using the subjective opiate withdrawal scale, POAT uses the clinical opiate withdrawal scale. We analyze this realistic yet challenging setting where outcome measures differ across studies and where neither study records both types of outcomes. Our paper studies whether and when integrating studies with disparate outcome measures leads to efficiency gains. We introduce three sets of assumptions -- with varying degrees of strength -- linking both outcome measures. Our theoretical and empirical results highlight a cautionary tale: integration can improve asymptotic efficiency only under the strongest assumption linking the outcomes. However, misspecification of this assumption leads to bias. In contrast, a milder assumption may yield finite-sample efficiency gains, yet these benefits diminish as sample size increases. We illustrate these trade-offs via a case study integrating the XBOT and POAT datasets to estimate the comparative effect of two medications for opioid use disorder on withdrawal symptoms. By systematically varying the assumptions linking the SOW and COW scales, we show potential efficiency gains and the risks of bias. Our findings emphasize the need for careful assumption selection when fusing datasets with differing outcome measures, offering guidance for researchers navigating this common challenge in modern data integration.", "similarity": 0.6835752725601196, "summary_blocked": null, "evalScore": 0.25, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.4, "specificity_informativeness": 0.45, "is_leaf": true, "avg_score": 3.75, "variance": 3.5833333333333335, "avg_rating": 3.75, "var_rating": 3.5833333333333335, "a vg_originality": 3.0, "var_originality": 0.0}, {"id": "6", "parentIds": ["92"], "name": "REGen: Multimodal Retrieval-Embedded Generation for Long-to-Short Video Editing. Short videos are an effective tool for promoting contents and improving knowledge accessibility. While existing extract", "full_text": "REGen: Multimodal Retrieval-Embedded Generation for Long-to-Short Video Editing. Short videos are an effective tool for promoting contents and improving knowledge accessibility. While existing extractive video summarization methods struggle to produce a coherent narrative, existing abstractive methods cannot `quote' from the input videos, i.e., inserting short video clips in their outputs. In this work, we explore novel video editing models for generating shorts that feature a coherent narrative with embedded video insertions extracted from a long input video. We propose a novel retrieval-embedded generation framework that allows a large language model to quote multimodal resources while maintaining a coherent narrative. Our proposed REGen system first generates the output story script with quote placeholders using a finetuned large language model, and then uses a novel retrieval model to replace the quote placeholders by selecting a video clip that best supports the narrative from a pool of candidate quotable video clips. We examine the proposed method on the task of documentary teaser generation, where short interview insertions are commonly used to support the narrative of a documentary. Our objective evaluations show that the proposed method can effectively insert short video clips while maintaining a coherent narrative. In a subjective survey, we show that our proposed method outperforms existing abstractive and extractive approaches in terms of coherence, alignment, and realism in teaser generation.", "similarity": 0.5892847776412964, "summary_blocked": null, "evalScore": 0.85, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 4.0, "variance": 0.0, "avg_rating": 4.0, "var_rating": 0.0, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "7", "parentIds": ["90"], "name": "Affine-Invariant Global Non-Asymptotic Convergence Analysis of BFGS under Self-Concordance. In this paper, we establish global non-asymptotic convergence guarantees for the BFGS quasi-Newton method wi", "full_text": "Affine-Invariant Global Non-Asymptotic Convergence Analysis of BFGS under Self-Concordance. In this paper, we establish global non-asymptotic convergence guarantees for the BFGS quasi-Newton method without requiring strong convexity or the Lipschitz continuity of the gradient or Hessian. Instead, we consider the setting where the objective function is strictly convex and strongly self-concordant. For an arbitrary initial point and any arbitrary positive-definite initial Hessian approximation, we prove global linear and superlinear convergence guarantees for BFGS when the step size is determined using a line search scheme satisfying the weak Wolfe conditions.  Moreover, all our global guarantees are affine-invariant, with the convergence rates depending solely on the initial error and the strongly self-concordant constant. Our results extend the global non-asymptotic convergence theory of BFGS beyond traditional assumptions and, for the first time, establish affine-invariant convergence guarantees—aligning with the inherent affine invariance of the BFGS method.", "similarity": 0.6058147549629211, "summary_blocked": null, "evalScore": 0.2, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 5.5, "variance": 0.3333333333333333, "avg_rating": 5.5, "var_rating": 0.3333333333333333, "avg_quality": 3.5, "var_quality": 0.3333333333333333, "avg_clarity": 3.25, "var_clarity": 0.9166666666666666, "avg_significance": 3.5, "var_significance": 0.3333333333333333, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "8", "parentIds": ["72"], "name": "Improved Algorithms for Overlapping and Robust Clustering of Edge-Colored Hypergraphs: An LP-Based Combinatorial Approach. Clustering is a fundamental task in both machine learning and data mining. Am", "full_text": "Improved Algorithms for Overlapping and Robust Clustering of Edge-Colored Hypergraphs: An LP-Based Combinatorial Approach. Clustering is a fundamental task in both machine learning and data mining. Among various methods, edge-colored clustering (ECC) has emerged as a useful approach for handling categorical data. Given a hypergraph with (hyper)edges labeled by colors, ECC aims to assign vertex colors to minimize the number of edges where the vertex color differs from the edge's color. However, traditional ECC has inherent limitations, as it enforces a nonoverlapping and exhaustive clustering. To tackle these limitations, three versions of ECC have been studied: Local ECC and Global ECC, which allow overlapping clusters, and Robust ECC, which accounts for vertex outliers. For these problems, both linear programming (LP) rounding algorithms and greedy combinatorial algorithms have been proposed. While these LP-rounding algorithms provide high-quality solutions, they demand substantial computation time; the greedy algorithms, on the other hand, run very fast but often compromise solution quality. In this paper, we present a family of algorithms that combines the strengths of LP with the computational efficiency of combinatorial algorithms. Both experimental and theoretical analyses show that our algorithms efficiently produce high-quality solutions for all three problems: Local, Global, and Robust ECC. We complement our algorithmic contributions with complexity-theoretic inapproximability results and integrality gap bounds, which suggest that significant theoretical improvements are unlikely. Our results also answer two open questions previously raised in the literature.", "similarity": 0.6109022498130798, "summary_blocked": null, "evalScore": 0.35, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.5, "var_quality": 0.3333333333333333, "avg_clarity": 3.5, "var_clarity": 0.3333333333333333, "avg_significance": 3.0, "var_significance": 0.0, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "9", "parentIds": ["78"], "name": "CodeGEMM: A Codebook-Centric Approach to Efficient GEMM in Quantized LLMs. Weight-only quantization is widely used to mitigate the memory-bound nature of LLM inference. Codebook-based methods extend t", "full_text": "CodeGEMM: A Codebook-Centric Approach to Efficient GEMM in Quantized LLMs. Weight-only quantization is widely used to mitigate the memory-bound nature of LLM inference. Codebook-based methods extend this trend by achieving strong accuracy in the extremely low-bit regime (e.g., 2-bit). However, current kernels rely on dequantization, which repeatedly fetches centroids and reconstructs weights, incurring substantial latency and cache pressure. We present CodeGEMM, a codebook-centric GEMM kernel that replaces dequantization with precomputed inner products between centroids and activations stored in a lightweight Psumbook. At inference, code indices directly gather these partial sums, eliminating per-element lookups and reducing the on-chip footprint. The kernel supports the systematic exploration of latency–memory–accuracy trade-offs under a unified implementation.\nOn Llama-3 models, CodeGEMM delivers 1.83x (8B) and 8.93x (70B) speedups in the 2-bit configuration compared to state-of-the-art codebook-based quantization at comparable accuracy and further improves computing efficiency and memory subsystem utilization.", "similarity": 0.6299013495445251, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.0, "variance": 0.6666666666666666, "avg_rating": 4.0, "var_rating": 0.6666666666666666, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 1.75, "var_significance": 0.25, "avg_originality": 2.25, "var_originality": 0.25}, {"id": "10", "parentIds": ["89"], "name": "Stabilizing LTI Systems under Partial Observability: Sample Complexity and Fundamental Limits. We study the problem of stabilizing an unknown partially observable linear time-invariant (LTI) system. F", "full_text": "Stabilizing LTI Systems under Partial Observability: Sample Complexity and Fundamental Limits. We study the problem of stabilizing an unknown partially observable linear time-invariant (LTI) system. For fully observable systems, leveraging an unstable/stable subspace decomposition approach, state-of-art sample complexity is independent from system dimension $n$ and only scales with respect to the dimension of the unstable subspace. However, it remains open whether such sample complexity can be achieved for partially observable systems because such systems do not admit a uniquely identifiable unstable subspace. In this paper, we propose LTS-P, a novel technique that leverages compressed singular value decomposition (SVD) on the ''lifted'' Hankel matrix to estimate the unstable subsystem up to an unknown transformation. Then, we design a stabilizing controller that integrates a robust stabilizing controller for the unstable mode and a small-gain-type assumption on the stable subspace. We show that LTS-P stabilizes unknown partially observable LTI systems with state-of-the-art sample complexity that is dimension-free and only scales with the number of unstable modes, which significantly reduces data requirements for high-dimensional systems with many stable modes.", "similarity": 0.5046330690383911, "summary_blocked": null, "evalScore": 0.0, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.0, "is_leaf": true, "avg_score": 4.75, "variance": 0.25, "avg_rating": 4.75, "var_rating": 0.25, "avg_quality": 3.25, "var_quality": 0.25, "avg_clarity": 3.25, "var_clarity": 0.9166666666666666, "avg_significance": 3.0, "var_significance": 0.0, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "11", "parentIds": ["71"], "name": "Neural Correlates of Serial Dependence: Synaptic Short-term Plasticity Orchestrates Repulsion and Attraction. Serial dependence reflects how recent sensory history shapes current perception, producing", "full_text": "Neural Correlates of Serial Dependence: Synaptic Short-term Plasticity Orchestrates Repulsion and Attraction. Serial dependence reflects how recent sensory history shapes current perception, producing two opposing biases: repulsion, where perception is repelled from recent stimuli, and attraction, where perception is drawn toward them. Repulsion typically occurs at the sensory perception stage, while attraction arises at the post-perception stage. To uncover the neural basis of these effects, we developed a two-layer continuous attractor neural network model incorporating synaptic short-term plasticity (STP). The lower layer, dominated by synaptic depression, models sensory processing and drives repulsion due to sustained neurotransmitter depletion. The higher layer, dominated by synaptic facilitation, models post-perception processing and drives attraction by sustained high neurotransmitter release probability. Our model successfully explains the serial dependence phenomena observed in the visual orientation judgment experiments, highlighting STP as the critical mechanism, with its time constants defining the temporal windows of repulsion and attraction. Furthermore, the model provides a neural foundation for the Bayesian interpretation of serial dependence. This study advances our understanding of how the neural system leverages STP to balance sensitivity in sensory perception with stability in post-perceptual cognition.", "similarity": 0.6391973495483398, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.2, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 3.0, "var_clarity": 0.6666666666666666, "avg_significance": 3.0, "var_significance": 0.6666666666666666, "avg_originality": 3.0, "var_originality": 0.6666666666666666}, {"id": "12", "parentIds": ["95"], "name": "Bézier Splatting for Fast and Differentiable Vector Graphics Rendering. Differentiable vector graphics (VGs) are widely used in image vectorization and vector synthesis, while existing representations", "full_text": "Bézier Splatting for Fast and Differentiable Vector Graphics Rendering. Differentiable vector graphics (VGs) are widely used in image vectorization and vector synthesis, while existing representations are costly to optimize and struggle to achieve high-quality rendering results for high-resolution images. This work introduces a new differentiable VG representation, dubbed Bézier Splatting, that enables fast yet high-fidelity VG rasterization. Bézier Splatting samples 2D Gaussians along Bézier curves, which naturally provide positional gradients at object boundaries. Thanks to the efficient splatting-based differentiable rasterizer, Bézier Splatting achieves 30× and 150× faster per forward and backward rasterization step for open curves compared to DiffVG. Additionally, we introduce an adaptive pruning and densification strategy that dynamically adjusts the spatial distribution of curves to escape local minima, further improving VG quality. Furthermore, our new VG representation supports conversion to standard XML-based SVG format, enhancing interoperability with existing VG tools and pipelines. Experimental results show that Bézier Splatting significantly outperforms existing methods with better visual fidelity and significant optimization speedup.", "similarity": 0.5096790194511414, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.25, "is_leaf": true, "avg_score": 4.666666666666667, "variance": 0.33333333333333337, "avg_rating": 4.666666666666667, "var_rating": 0.33333333333333337, "avg_quality": 3.0, "var_quality": 1.0, "avg_clarity": 3.0, "var_clarity": 1.0, "avg_significance": 3.0, "var_significance": 1.0, "avg_originality": 2.6666666666666665, "var_originality": 0.33333333333333337}, {"id": "13", "parentIds": ["77"], "name": "Zero-shot protein stability prediction by inverse folding models: a free energy interpretation. Inverse folding models have proven to be highly effective zero-shot predictors of protein stability. Des", "full_text": "Zero-shot protein stability prediction by inverse folding models: a free energy interpretation. Inverse folding models have proven to be highly effective zero-shot predictors of protein stability. Despite this success, the link between the amino acid preferences of an inverse folding model and the free-energy considerations underlying thermodynamic stability remains incompletely understood. A better understanding would be of interest not only from a theoretical perspective, but also potentially provide the basis for stronger zero-shot stability prediction. In this paper, we take steps to clarify the free-energy foundations of inverse folding models. Our derivation reveals the standard practice of likelihood ratios as a simplistic approximation and suggests several paths towards better estimates of the relative stability. We empirically assess these approaches and demonstrate that considerable gains in zero-shot performance can be achieved with fairly simple means.", "similarity": 0.6216722726821899, "summary_blocked": null, "evalScore": 0.7, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.4, "specificity_informativeness": 0.3, "is_leaf": true, "avg_score": 4.4, "variance": 0.3, "avg_rating": 4.4, "var_rating": 0.3, "avg_quality": 2.8, "var_quality": 0.19999999999999998, "avg_clarity": 3.2, "var_clarity": 0.19999999999999996, "avg_significance": 2.4, "var_significance": 0.8, "avg_originality": 2.8, "var_originality": 0.7}, {"id": "14", "parentIds": ["81"], "name": "A Closed-Form Solution for Fast and Reliable Adaptive Testing. Human ability estimation is essential for educational assessment, career advancement, and professional certification. Adaptive Testing sy", "full_text": "A Closed-Form Solution for Fast and Reliable Adaptive Testing. Human ability estimation is essential for educational assessment, career advancement, and professional certification. Adaptive Testing systems can improve estimation efficiency by selecting fewer, targeted questions, and are widely used in exams, e.g., GRE, GMAT, and Duolingo English Test. However, selecting an optimal subset of questions remains a challenging nested optimization problem. Existing methods rely on costly approximations or data-intensive training, making them unsuitable for today's large-scale and complex testing environments. Thus, we propose a Closed-Form solution for question subset selection in Adaptive Testing. It directly minimizes ability estimation error by reducing ability parameter's gradient bias while maintaining Hessian stability, which enables a simple greedy algorithm for question selection. Moreover, it can quantify the impact of human behavioral perturbations on ability estimation. Extensive experiments on large-scale educational datasets demonstrate that it reduces the number of required questions by 10% compared to SOTA methods, while maintaining the same estimation accuracy.", "similarity": 0.6565032005310059, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.0, "is_leaf": true, "avg_score": 4.0, "variance": 0.6666666666666666, "avg_rating": 4.0, "var_rating": 0.6666666666666666, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "15", "parentIds": ["88"], "name": "MODEM: A Morton-Order Degradation Estimation Mechanism for Adverse Weather Image Recovery. Restoring images degraded by adverse weather remains a significant challenge due to the highly non-uniform an", "full_text": "MODEM: A Morton-Order Degradation Estimation Mechanism for Adverse Weather Image Recovery. Restoring images degraded by adverse weather remains a significant challenge due to the highly non-uniform and spatially heterogeneous nature of weather-induced artifacts, \\emph{e.g.}, fine-grained rain streaks versus widespread haze. Accurately estimating the underlying degradation can intuitively provide restoration models with more targeted and effective guidance, enabling adaptive processing strategies. To this end, we propose a Morton-Order Degradation Estimation Mechanism (MODEM) for adverse weather image restoration. Central to MODEM is the Morton-Order 2D-Selective-Scan Module (MOS2D), which integrates Morton-coded spatial ordering with selective state-space models to capture long-range dependencies while preserving local structural coherence. Complementing MOS2D, we introduce a Dual Degradation Estimation Module (DDEM) that disentangles and estimates both global and local degradation priors. These priors dynamically condition the MOS2D modules, facilitating adaptive and context-aware restoration. Extensive experiments and ablation studies demonstrate that MODEM achieves state-of-the-art results across multiple benchmarks and weather types, highlighting its effectiveness in modeling complex degradation dynamics. Our code will be released soon.", "similarity": 0.6536622643470764, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 3.75, "variance": 0.25, "avg_rating": 3.75, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.25, "var_clarity": 0.9166666666666666, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "16", "parentIds": ["67"], "name": "Does Representation Guarantee Welfare?. A panel satisfies *descriptive representation* when its composition reflects the population. We examine the role of descriptive representation in collective dec", "full_text": "Does Representation Guarantee Welfare?. A panel satisfies *descriptive representation* when its composition reflects the population. We examine the role of descriptive representation in collective decision making through an optimization lens, asking whether representative panels make decisions that maximize social welfare for the underlying population. Our main results suggest that, in general, representation with respect to *intersections* of two or more features guarantees higher social welfare than that achieved by the status quo of proportionally representing individual features. Moreover, an analysis of real data suggests that representation with respect to pairs of features is feasible in practice. These results have significant implications for the design of *citizens' assemblies*, which are gaining prominence in AI governance.", "similarity": 0.4762704372406006, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.4, "variance": 0.30000000000000004, "avg_rating": 4.4, "var_rating": 0.30000000000000004, "avg_quality": 3.4, "var_quality": 0.3, "avg_clarity": 3.6, "var_clarity": 0.3, "avg_significance": 3.0, "var_significance": 0.0, "avg_originality": 2.8, "var_originality": 0.19999999999999998}, {"id": "17", "parentIds": ["85"], "name": "Provable Watermarking for Data Poisoning Attacks. In recent years, data poisoning attacks have been increasingly designed to appear harmless and even beneficial, often with the intention of verifying ", "full_text": "Provable Watermarking for Data Poisoning Attacks. In recent years, data poisoning attacks have been increasingly designed to appear harmless and even beneficial, often with the intention of verifying dataset ownership or safeguarding private data from unauthorized use. However, these developments have the potential to cause misunderstandings and conflicts, as data poisoning has traditionally been regarded as a security threat to machine learning systems. To address this issue, it is imperative for harmless poisoning generators to claim ownership of their generated datasets, enabling users to identify potential poisoning to prevent misuse. In this paper, we propose the deployment of watermarking schemes as a solution to this challenge. We introduce two provable and practical watermarking approaches for data poisoning: post-poisoning watermarking and poisoning-concurrent watermarking. Our analyses demonstrate that when the watermarking length is $\\Theta(\\sqrt{d}/\\epsilon_w)$ for post-poisoning watermarking, and falls within the range of $\\Theta(1/\\epsilon_w^2)$ to $O(\\sqrt{d}/\\epsilon_p)$ for poisoning-concurrent watermarking, the watermarked poisoning dataset provably ensures both watermarking detectability and poisoning utility, certifying the practicality of watermarking under data poisoning attacks. We validate our theoretical findings through experiments on several attacks, models, and datasets.", "similarity": 0.38121145963668823, "summary_blocked": null, "evalScore": 0.25, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.2, "variance": 0.19999999999999996, "avg_rating": 4.2, "var_rating": 0.19999999999999996, "avg_quality": 2.6, "var_quality": 0.3, "avg_clarity": 2.6, "var_clarity": 0.3, "avg_significance": 2.6, "var_significance": 0.3, "avg_originality": 3.0, "var_originality": 0.5}, {"id": "18", "parentIds": ["79"], "name": "ChromFound: Towards A Universal Foundation Model for Single-Cell Chromatin Accessibiltiy Data. The advent of single-cell Assay for Transposase-Accessible Chromatin using sequencing (scATAC-seq) offers", "full_text": "ChromFound: Towards A Universal Foundation Model for Single-Cell Chromatin Accessibiltiy Data. The advent of single-cell Assay for Transposase-Accessible Chromatin using sequencing (scATAC-seq) offers an innovative perspective for deciphering regulatory mechanisms by assembling a vast repository of single-cell chromatin accessibility data. While foundation models have achieved significant success in single-cell transcriptomics, there is currently no foundation model for scATAC-seq that supports zero-shot high-quality cell identification and comprehensive multi-omics analysis simultaneously. Key challenges lie in the high dimensionality and sparsity of scATAC-seq data, as well as the lack of a standardized schema for representing open chromatin regions (OCRs). Here, we present ChromFound, a foundation model tailored for scATAC-seq. ChromFound utilizes a hybrid architecture and genome-aware tokenization to effectively capture genome-wide long contexts and regulatory signals from dynamic chromatin landscapes. Pretrained on 1.97 million cells from 30 tissues and 6 disease conditions, ChromFound demonstrates broad applicability across 6 diverse tasks. Notably, it achieves robust zero-shot performance in generating universal cell representations and exhibits excellent transferability in cell type annotation and cross-omics prediction. By uncovering enhancer-gene links undetected by existing computational methods, ChromFound offers a promising framework for understanding disease risk variants in the noncoding genome. The implementation of ChromFound is available via https://github.com/JohnsonKlose/ChromFound.", "similarity": 0.5596079230308533, "summary_blocked": null, "evalScore": 0.1, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.75, "variance": 0.9166666666666666, "avg_rating": 4.75, "var_rating": 0.9166666666666666, "avg_quality": 3.25, "var_quality": 0.9166666666666666, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.9166666666666666, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "19", "parentIds": ["94"], "name": "Scaling Epidemic Inference on Contact Networks: Theory and Algorithms. Computational epidemiology is crucial in understanding and controlling infectious diseases, as highlighted by large-scale outbrea", "full_text": "Scaling Epidemic Inference on Contact Networks: Theory and Algorithms. Computational epidemiology is crucial in understanding and controlling infectious diseases, as highlighted by large-scale outbreaks such as COVID-19. Given the inherent uncertainty and variability of disease spread, Monte Carlo (MC) simulations are widely used to predict infection peaks, estimate reproduction numbers, and evaluate the impact of non-pharmaceutical interventions (NPIs). While effective, MC-based methods require numerous runs to achieve statistically reliable estimates and variance, which suffer from high computational costs. In this work, we present a unified theoretical framework for analyzing disease spread dynamics on both directed and undirected contact networks, and propose an algorithm, **RAPID**, that significantly improves computational efficiency. Our contributions are threefold. First, we derive an asymptotic variance lower bound for MC estimates and identify the key factors influencing estimation variance. Second, we provide a theoretical analysis of the probabilistic disease spread process using linear approximations and derive the convergence conditions under non-reinfection epidemic models. Finally, we conduct extensive experiments on six real-world datasets, demonstrating our method's effectiveness and robustness in estimating the nodes' final state distribution. Specifically, our proposed method consistently produces accurate estimates aligned with results from a large number of MC simulations, while maintaining a runtime comparable to a single MC simulation. Our code and datasets are available at https://github.com/GuanghuiMin/RAPID.", "similarity": 0.5665081143379211, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.25, "variance": 2.25, "avg_rating": 4.25, "var_rating": 2.25, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.25, "var_significance": 0.9166666666666666, "avg_originality": 2.5, "var_originality": 1.0}, {"id": "20", "parentIds": ["66"], "name": "Compliant Residual DAgger: Improving Real-World Contact-Rich Manipulation with Human Corrections. We address key challenges in Dataset Aggregation (DAgger) for real-world contact-\nrich manipulation: h", "full_text": "Compliant Residual DAgger: Improving Real-World Contact-Rich Manipulation with Human Corrections. We address key challenges in Dataset Aggregation (DAgger) for real-world contact-\nrich manipulation: how to collect informative human correction data and how to\neffectively update policies with this new data. We introduce Compliant Residual\nDAgger (CR-DAgger), which contains two novel components: 1) a Compliant\nIntervention Interface that leverages compliance control, allowing humans to pro-\nvide gentle, accurate delta action corrections without interrupting the ongoing\nrobot policy execution; and 2) a Compliant Residual Policy formulation that learns\nfrom human corrections while incorporating force feedback and force control.\nOur system significantly enhances performance on precise contact-rich manipu-\nlation tasks using minimal correction data, improving base policy success rates\nby over 60% on two challenging tasks (book flipping and belt assembly) while\noutperforming both retraining-from-scratch and finetuning approaches. Through\nextensive real-world experiments, we provide practical guidance for implementing\neffective DAgger in real-world robot learning tasks.", "similarity": 0.6159420013427734, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.05, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 2.75, "var_quality": 0.9166666666666666, "avg_clarity": 3.25, "var_clarity": 0.9166666666666666, "avg_significance": 3.0, "var_significance": 0.6666666666666666, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "21", "parentIds": ["85"], "name": "Scaling Image Geo-Localization to Continent Level. Determining the precise geographic location of an image at a global scale remains an unsolved challenge. \nStandard image retrieval techniques are ine", "full_text": "Scaling Image Geo-Localization to Continent Level. Determining the precise geographic location of an image at a global scale remains an unsolved challenge. \nStandard image retrieval techniques are inefficient due to the sheer volume of images (>100M) and fail when coverage is insufficient. Scalable solutions, however, involve a trade-off: global classification typically yields coarse results (10+ kilometers), while cross-view retrieval between ground and aerial imagery suffers from a domain gap and has been primarily studied on smaller regions. \nThis paper introduces a hybrid approach that achieves fine-grained geo-localization across a large geographic expanse the size of a continent. \nWe leverage a proxy classification task during training to learn rich feature representations that implicitly encode precise location information. \nWe combine these learned prototypes with embeddings of aerial imagery to increase robustness to the sparsity of ground-level data. \nThis enables direct, fine-grained retrieval over areas spanning multiple countries. \nOur extensive evaluation demonstrates that our approach can localize within 200m more than 68\\% of queries of a dataset covering a large part of Europe. \nThe code is publicly available at [scaling-geoloc.github.io](https://scaling-geoloc.github.io).", "similarity": 0.38121145963668823, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 3.25, "var_quality": 0.25, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 3.0, "var_significance": 0.6666666666666666, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "22", "parentIds": ["80"], "name": "Active Seriation: Efficient Ordering Recovery with Statistical Guarantees. Active seriation aims at recovering an unknown ordering of $n$ items by adaptively querying pairwise similarities. \nThe obser", "full_text": "Active Seriation: Efficient Ordering Recovery with Statistical Guarantees. Active seriation aims at recovering an unknown ordering of $n$ items by adaptively querying pairwise similarities. \nThe observations are noisy measurements of entries of an underlying $n \\times n$ permuted Robinson matrix, whose permutation encodes the latent ordering. The framework allows the algorithm to start with partial information on the latent ordering, including seriation from scratch as a special case. We propose an active seriation algorithm that provably recovers the latent ordering with high probability. Under a uniform separation condition on the similarity matrix, optimal performance guarantees are established, both in terms of the probability of error and the number of observations required for successful recovery.", "similarity": 0.6813068985939026, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.55, "specificity_informativeness": 0.375, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "23", "parentIds": ["70"], "name": "PhysioWave: A Multi-Scale Wavelet-Transformer for Physiological Signal Representation. Physiological signals are often corrupted by motion artifacts, baseline drift, and other low-SNR disturbances, po", "full_text": "PhysioWave: A Multi-Scale Wavelet-Transformer for Physiological Signal Representation. Physiological signals are often corrupted by motion artifacts, baseline drift, and other low-SNR disturbances, posing significant challenges for analysis. Additionally, these signals exhibit strong non-stationarity, with sharp peaks and abrupt changes that evolve continuously, making them difficult to represent using traditional time-domain or filtering methods. To address these issues, a novel wavelet-based approach for physiological signal analysis is presented, aimed at capturing multi-scale time-frequency features across various physiological signals. Leveraging this technique, two large-scale pretrained models specific to EMG and ECG are introduced for the first time, achieving superior performance and setting new baselines in downstream tasks. Additionally, a unified multi-modal framework is constructed by integrating a pretrained EEG model, where each modality is guided through its dedicated branch and fused via learnable weighted fusion. This design effectively addresses challenges such as low signal-to-noise ratio, high inter-subject variability, and device mismatch, outperforming existing methods on multi-modal tasks. The proposed wavelet-based architecture lays a solid foundation for the analysis of diverse physiological signals, while the multi-modal design points to next-generation physiological signal processing with potential impacts on wearable health monitoring, clinical diagnostics, and broader biomedical applications. Code and\ndata are available at: github.com/ForeverBlue816/PhysioWave", "similarity": 0.6096270680427551, "summary_blocked": null, "evalScore": 0.45, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.22499999999999998, "is_leaf": true, "avg_score": 4.25, "variance": 0.9166666666666666, "avg_rating": 4.25, "var_rating": 0.9166666666666666, "avg_quality": 3.25, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 3.0, "var_significance": 1.3333333333333333, "avg_originality": 3.0, "var_originality": 0.6666666666666666}, {"id": "24", "parentIds": ["75"], "name": "Learning to Insert for Constructive Neural Vehicle Routing Solver. Neural Combinatorial Optimisation (NCO) is a promising learning-based approach for solving Vehicle Routing Problems (VRPs) without ex", "full_text": "Learning to Insert for Constructive Neural Vehicle Routing Solver. Neural Combinatorial Optimisation (NCO) is a promising learning-based approach for solving Vehicle Routing Problems (VRPs) without extensive manual design. While existing constructive NCO methods typically follow an appending-based paradigm that sequentially adds unvisited nodes to partial solutions, this rigid approach often leads to suboptimal results. To overcome this limitation, we explore the idea of the insertion-based paradigm and propose Learning to Construct with Insertion-based Paradigm (L2C-Insert), a novel learning-based method for constructive NCO. Unlike traditional approaches, L2C-Insert builds solutions by strategically inserting unvisited nodes at any valid position in the current partial solution, which can significantly enhance the flexibility and solution quality. The proposed framework introduces three key components: a novel model architecture for precise insertion position prediction, an efficient training scheme for model optimization, and an advanced inference technique that fully exploits the insertion paradigm's flexibility. Extensive experiments on both synthetic and real-world instances of the Travelling Salesman Problem (TSP) and Capacitated Vehicle Routing Problem (CVRP) demonstrate that L2C-Insert consistently achieves superior performance across various problem sizes. The code is available at [https://github.com/CIAM-Group/L2C\\_Insert](https://github.com/CIAM-Group/L2C\\_Insert).", "similarity": 0.6142994165420532, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.0, "variance": 2.0, "avg_rating": 4.0, "var_rating": 2.0, "avg_quality": 2.5, "var_quality": 1.6666666666666667, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.5, "var_significance": 1.6666666666666667, "avg_originality": 2.75, "var_originality": 0.9166666666666666}, {"id": "25", "parentIds": ["65"], "name": "3DPE-Gaze:Unlocking the Potential of 3D Facial Priors for Generalized Gaze Estimation. In recent years, face-based deep-learning gaze estimation methods have achieved significant advancements. However", "full_text": "3DPE-Gaze:Unlocking the Potential of 3D Facial Priors for Generalized Gaze Estimation. In recent years, face-based deep-learning gaze estimation methods have achieved significant advancements. However, while face images provide supplementary information beneficial for gaze inference, the substantial extraneous information they contain also increases the risk of overfitting during model training and compromises generalization capability. To alleviate this problem, we propose the 3DPE-Gaze framework, explicitly modeling 3D facial priors for feature decoupling and generalized gaze estimation. The 3DPE-Gaze framework consists of two core modules: the 3D Geometric Prior Module (3DGP) incorporating the FLAME model to parameterize facial structures and gaze-irrelevant facial appearances while extracting gaze features; the Semantic Concept Alignment Module (SCAM) separates gaze-related and unrelated concepts through CLIP-guided contrastive learning. Finally, the 3DPE-Gaze framework combines 3D facial landmark as prior for generalized gaze estimation. Experimental results show that 3DPE-Gaze outperforms existing state-of-the-art methods on four major cross-domain tasks, with particularly outstanding performance in challenging scenarios such as lighting variations, extreme head poses, and glasses occlusion.", "similarity": 0.512381911277771, "summary_blocked": null, "evalScore": 0.25, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.4, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 4.25, "variance": 0.9166666666666666, "avg_rating": 4.25, "var_rating": 0.9166666666666666, "avg_quality": 2.25, "var_quality": 0.9166666666666666, "avg_clarity": 2.75, "var_clarity": 0.9166666666666666, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.0, "var_originality": 0.6666666666666666}, {"id": "26", "parentIds": ["93"], "name": "Universal Causal Inference in a Topos. In this paper, we explore the universal properties underlying causal inference by  formulating it in terms of a topos. More concretely, we introduce topos causal", "full_text": "Universal Causal Inference in a Topos. In this paper, we explore the universal properties underlying causal inference by  formulating it in terms of a topos. More concretely, we introduce topos causal models (TCMs), a strict generalization of the popular structural causal models (SCMs).  A topos category has several properties that make it attractive: a general theory for how to combine local functions that define ``independent causal mechanisms\" into a consistent global function building on the theory of sheaves in a topos; a generic way to define causal interventions using a subobject classifier in a topos  category; and finally, an internal logical language for causal and counterfactual reasoning that emerges from the topos itself.  A striking characteristic of subobject classifiers is that they induce an intuitionistic logic, whose semantics is based on the partially ordered lattice of subobjects. We show that the underlying subobject classifier for causal inference is not Boolean in general, but forms a Heyting algebra.  We define the internal Mitchell-B\\'enabou language, a typed local set theory, associated with causal models, and  its associated Kripke-Joyal intuitionistic semantics.  We prove a universal property of TCM, namely that any causal functor mapping decomposable structure to probabilistic semantics  factors uniquely through a TCM representation.", "similarity": 0.5910847187042236, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.5, "variance": 1.6666666666666667, "avg_rating": 4.5, "var_rating": 1.6666666666666667, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 2.75, "var_clarity": 1.5833333333333333, "avg_significance": 2.5, "var_significance": 1.6666666666666667, "avg_originality": 3.0, "var_originality": 0.6666666666666666}, {"id": "27", "parentIds": ["87"], "name": "Near-Optimal Quantum Algorithms for Computing (Coarse) Correlated Equilibria of General-Sum Games. Computing Nash equilibria of zero-sum games in classical and quantum settings is extensively studied.", "full_text": "Near-Optimal Quantum Algorithms for Computing (Coarse) Correlated Equilibria of General-Sum Games. Computing Nash equilibria of zero-sum games in classical and quantum settings is extensively studied. For general-sum games, computing Nash equilibria is PPAD-hard and the computing of a more general concept called correlated equilibria has been widely explored in game theory. In this paper, we initiate the study of quantum algorithms for computing $\\varepsilon$-approximate correlated equilibria (CE) and coarse correlated equilibria (CCE) in multi-player normal-form games. Our approach utilizes quantum improvements to the multi-scale Multiplicative Weight Update (MWU) method for CE calculations, achieving a query complexity of $\\tilde{O}(m\\sqrt{n})$ for fixed $\\varepsilon$. For CCE, we extend techniques from quantum algorithms for zero-sum games to multi-player settings, achieving query complexity $\\tilde{O}(m\\sqrt{n}/\\varepsilon^{2.5})$. Both algorithms demonstrate a near-optimal scaling in the number of players $m$ and actions $n$, as confirmed by our quantum query lower bounds.", "similarity": 0.573499858379364, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.0, "variance": 0.0, "avg_rating": 4.0, "var_rating": 0.0, "avg_quality": 3.0, "var_quality": 0.0, "avg_clarity": 2.5, "var_clarity": 0.3333333333333333, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "28", "parentIds": ["89"], "name": "Conformal Prediction for Time-series Forecasting with Change Points. Conformal prediction has been explored as a general and efficient way to provide uncertainty quantification for time series. Howeve", "full_text": "Conformal Prediction for Time-series Forecasting with Change Points. Conformal prediction has been explored as a general and efficient way to provide uncertainty quantification for time series. However, current methods struggle to handle time series data with change points — sudden shifts in the underlying data-generating process. In this paper, we propose a novel Conformal Prediction for Time-series with Change points (CPTC) algorithm, addressing this gap by integrating a model to predict the underlying state with online conformal prediction to model uncertainties in non-stationary time series. We prove CPTC's validity and improved adaptivity in the time series setting under minimum assumptions, and demonstrate CPTC's practical effectiveness on 6 synthetic and real-world datasets, showing improved validity and adaptivity compared to state-of-the-art baselines.", "similarity": 0.5046330690383911, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.8, "specificity_informativeness": 0.35, "is_leaf": true, "avg_score": 4.0, "variance": 0.0, "avg_rating": 4.0, "var_rating": 0.0, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 3.0, "var_clarity": 0.6666666666666666, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "29", "parentIds": ["76"], "name": "From Replication to Redesign: Exploring Pairwise Comparisons for LLM-Based Peer Review. The advent of large language models (LLMs) offers unprecedented opportunities to reimagine peer review beyond th", "full_text": "From Replication to Redesign: Exploring Pairwise Comparisons for LLM-Based Peer Review. The advent of large language models (LLMs) offers unprecedented opportunities to reimagine peer review beyond the constraints of traditional workflows.\nDespite these opportunities, prior efforts have largely focused on replicating traditional review workflows with LLMs serving as direct substitutes for human reviewers, while limited attention has been given to exploring new paradigms that fundamentally rethink how LLMs can participate in the academic review process.\nIn this paper, we introduce and explore a novel mechanism that employs LLM agents to perform pairwise comparisons among manuscripts instead of individual scoring. By aggregating outcomes from substantial pairwise evaluations, this approach enables a more accurate and robust measure of relative manuscript quality.\nOur experiments demonstrate that this comparative approach significantly outperforms traditional rating-based methods in identifying high-impact papers. However, our analysis also reveals emergent biases in the selection process, notably a reduced novelty in research topics and an increased institutional imbalance. These findings highlight both the transformative potential of rethinking peer review with LLMs and critical challenges that future systems must address to ensure equity and diversity.", "similarity": 0.6835752725601196, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.425, "is_leaf": true, "avg_score": 4.25, "variance": 0.9166666666666666, "avg_rating": 4.25, "var_rating": 0.9166666666666666, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.0, "var_clarity": 0.6666666666666666, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "30", "parentIds": ["84"], "name": "On Efficiency-Effectiveness Trade-off of Diffusion-based Recommenders. Diffusion models have emerged as a powerful paradigm for generative sequential recommendation, which typically generate next item", "full_text": "On Efficiency-Effectiveness Trade-off of Diffusion-based Recommenders. Diffusion models have emerged as a powerful paradigm for generative sequential recommendation, which typically generate next items to recommend guided by user interaction histories with a multi-step denoising process. However, the multi-step process relies on discrete approximations, introducing discretization error that creates a trade-off between computational efficiency and recommendation effectiveness.\nTo address this trade-off, we propose TA-Rec, a two-stage framework that achieves one-step generation by smoothing the denoising function during pretraining while alleviating trajectory deviation by aligning with user preferences during fine-tuning. Specifically, to improve the efficiency without sacrificing the recommendation performance, TA-Rec pretrains the denoising model with Temporal Consistency Regularization (TCR), enforcing the consistency between the denoising results across adjacent steps. Thus, we can smooth the denoising function to map the noise as oracle items in one step with bounded error. To further enhance effectiveness, TA-Rec introduces Adaptive Preference Alignment (APA) that aligns the denoising process with user preference adaptively based on preference pair similarity and timesteps. Extensive experiments prove that TA-Rec’s two-stage objective effectively mitigates the discretization errors-induced trade-off, enhancing both efficiency and effectiveness of diffusion-based recommenders. Our code is available at https://github.com/maowenyu-11/TA-Rec.", "similarity": 0.5845444202423096, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.4, "specificity_informativeness": 0.25, "is_leaf": true, "avg_score": 3.8,
