": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.4, "variance": 0.30000000000000004, "avg_rating": 4.4, "var_rating": 0.30000000000000004, "avg_quality": 3.4, "var_quality": 0.3, "avg_clarity": 3.0, "var_clarity": 0.5, "avg_significance": 2.8, "var_significance": 0.19999999999999998, "avg_originality": 3.2, "var_originality": 0.19999999999999998}, {"id": "32", "parentIds": ["94"], "name": "Refinement Methods for Distributed Distribution Estimation under $\\ell^p$-Losses. Consider the communication-constrained estimation of discrete distributions under $\\ell^p$ losses, where each distribu", "full_text": "Refinement Methods for Distributed Distribution Estimation under $\\ell^p$-Losses. Consider the communication-constrained estimation of discrete distributions under $\\ell^p$ losses, where each distributed terminal holds multiple independent samples and uses limited number of bits to describe the samples. We obtain the minimax optimal rates of the problem for most parameter regimes. As a result, an elbow effect of the optimal rates at $p=2$ is clearly identified. In order to achieve the optimal rates for different parameter regimes, we introduce refinement methods and develop additional customized techniques in the estimation protocols. The general idea of the refinement methods is to first generate rough estimate by partial information and then establish  refined estimate in subsequent steps guided by the rough estimate. Then customized techniques such as successive refinement, sample compression, thresholding and random hashing are leveraged to achieve the optimal rates in different parameter regimes. The optimality of the estimation protocols is shown by deriving compatible minimax lower bounds.", "similarity": 0.5665081143379211, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.0, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "33", "parentIds": ["77"], "name": "Reinforced Active Learning for Large-Scale Virtual Screening with Learnable Policy Model. Virtual Screening (VS) is vital for drug discovery but struggles with low hit rates and high computational cos", "full_text": "Reinforced Active Learning for Large-Scale Virtual Screening with Learnable Policy Model. Virtual Screening (VS) is vital for drug discovery but struggles with low hit rates and high computational costs. While Active Learning (AL) has shown promise in improving the efficiency of VS, traditional methods rely on inflexible and handcrafted heuristics, limiting adaptability in complex chemical spaces, particularly in balancing molecular diversity and selection accuracy. \nTo overcome these challenges, we propose GLARE, a reinforced active learning framework that reformulates VS as a Markov Decision Process (MDP). Using Group Relative Policy Optimization (GRPO), GLARE dynamically balances chemical diversity, biological relevance, and computational constraints, eliminating the need for inflexible heuristics.\nExperiments show GLARE outperforms state-of-the-art AL methods, with a 64.8% average improvement in Enrichment Factors (EF). Additionally, GLARE enhances the performance of VS foundation models like DrugCLIP, achieving up to an 8-fold improvement in  EF$_{0.5\\\\%}$ with as few as 15 active molecules. These results highlight the transformative potential of GLARE for adaptive and efficient drug discovery.", "similarity": 0.6216722726821899, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.0, "variance": 0.6666666666666666, "avg_rating": 4.0, "var_rating": 0.6666666666666666, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.0, "var_clarity": 0.6666666666666666, "avg_significance": 2.75, "var_significance": 0.9166666666666666, "avg_originality": 2.5, "var_originality": 1.0}, {"id": "34", "parentIds": ["82"], "name": "Generalizing Single-Frame Supervision to Event-Level Understanding for Video Anomaly Detection. Video Anomaly Detection (VAD) aims to identify abnormal frames from discrete events within video sequenc", "full_text": "Generalizing Single-Frame Supervision to Event-Level Understanding for Video Anomaly Detection. Video Anomaly Detection (VAD) aims to identify abnormal frames from discrete events within video sequences. Existing VAD methods suffer from heavy annotation burdens in fully-supervised paradigm, insensitivity to subtle anomalies in semi-supervised paradigm, and vulnerability to noise in weakly-supervised paradigm. To address these limitations, we propose a novel paradigm: Single-Frame supervised VAD (SF-VAD), which uses a single annotated abnormal frame per abnormal video. SF-VAD ensures annotation efficiency while offering precise anomaly reference, facilitating robust anomaly modeling, and enhancing the detection of subtle anomalies in complex visual contexts. To validate its effectiveness, we construct three SF-VAD benchmarks by manually re-annotating the ShanghaiTech, UCF-Crime, and XD-Violence datasets in a practical procedure. Further, we devise Frame-guided Progressive Learning (FPL), to generalize sparse frame supervision to event-level anomaly understanding. FPL first leverages evidential learning to estimate anomaly relevance guided by annotated frames. Then it extends anomaly supervision by mining discrete abnormal events based on anomaly relevance and feature similarity. Meanwhile, FPL decouples normal patterns by isolating distinct normal frames outside abnormal events, reducing false alarms.  Extensive experiments show SF-VAD achieves state-of-the-art detection results while offering a favorable trade-off between performance and annotation cost.", "similarity": 0.5980538129806519, "summary_blocked": null, "evalScore": 0.35, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.05, "is_leaf": true, "avg_score": 4.0, "variance": 0.0, "avg_rating": 4.0, "var_rating": 0.0, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 2.25, "var_originality": 0.25}, {"id": "35", "parentIds": ["69"], "name": "Generating Physically Sound Designs from Text and a Set of Physical Constraints. We present TIDES, a text informed design approach for generating physically sound designs based on a textual descriptio", "full_text": "Generating Physically Sound Designs from Text and a Set of Physical Constraints. We present TIDES, a text informed design approach for generating physically sound designs based on a textual description and a set of physical constraints. TIDES jointly optimizes structural (topology) and visual properties. A pre-trained text-image model is used to measure the design's visual alignment with a text prompt and a differentiable physics simulator is used to measure its physical performance. We evaluate TIDES on a series of structural optimization problems operating under different load and support conditions, at different resolutions, and experimentally in the lab by performing the 3-point bending test on 2D beam designs that are extruded and 3D printed. We find that it can jointly optimize the two objectives and return designs that satisfy engineering design requirements (compliance and density) while utilizing features specified by text.", "similarity": 0.5486199855804443, "summary_blocked": null, "evalScore": 0.45, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.425, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 3.6, "variance": 1.3, "avg_rating": 3.6, "var_rating": 1.3, "avg_quality": 2.6, "var_quality": 0.3, "avg_clarity": 2.8, "var_clarity": 0.19999999999999996, "avg_significance": 2.4, "var_significance": 0.3, "avg_originality": 2.2, "var_originality": 0.19999999999999996}, {"id": "36", "parentIds": ["64"], "name": "Pancakes: Consistent Multi-Protocol Image Segmentation Across Biomedical Domains. A single biomedical image can be segmented in multiple valid ways, depending on the application. For instance, a brain", "full_text": "Pancakes: Consistent Multi-Protocol Image Segmentation Across Biomedical Domains. A single biomedical image can be segmented in multiple valid ways, depending on the application. For instance, a brain MRI may be divided according to tissue types, vascular territories, broad anatomical regions, fine-grained anatomy, or pathology. Existing automatic segmentation models typically either (1) support only a single protocol---the one they were trained on---or (2) require labor-intensive prompting to specify the desired segmentation. We introduce _Pancakes_, a framework that, given a new image from a previously unseen domain, automatically generates multi-label segmentation maps for _multiple_ plausible protocols, while maintaining semantic consistency across related images. In extensive experiments across seven previously unseen domains, _Pancakes_ consistently outperforms strong baselines, often by a wide margin, demonstrating its ability to produce diverse yet coherent segmentation maps on unseen domains.", "similarity": 0.5255228281021118, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.25, "variance": 0.9166666666666666, "avg_rating": 4.25, "var_rating": 0.9166666666666666, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.0, "var_clarity": 1.3333333333333333, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.75, "var_originality": 0.9166666666666666}, {"id": "37", "parentIds": ["70"], "name": "GyroSwin: 5D Surrogates for Gyrokinetic Plasma Turbulence Simulations. Nuclear fusion plays a pivotal role in the quest for reliable and sustainable energy production. A major roadblock to viable fusi", "full_text": "GyroSwin: 5D Surrogates for Gyrokinetic Plasma Turbulence Simulations. Nuclear fusion plays a pivotal role in the quest for reliable and sustainable energy production. A major roadblock to viable fusion power is understanding plasma turbulence, which significantly impairs plasma confinement, and is vital for next generation reactor design. Plasma turbulence is governed by the nonlinear gyrokinetic equation, which evolves a 5D distribution function over time. Due to its high computational cost, reduced-order models are often employed in practice to approximate turbulent transport of energy. However, they omit nonlinear effects unique to the full 5D dynamics. To tackle this, we introduce GyroSwin, the first scalable 5D neural surrogate that can model 5D nonlinear gyrokinetic simulations, thereby capturing the physical phenomena neglected by reduced models, while providing accurate estimates of turbulent heat transport. GyroSwin (i) extends hierarchical Vision Transformers to 5D, (ii) introduces cross-attention and integration modules for latent 3D$\\leftrightarrow$5D interactions between electrostatic potential fields and the distribution function, and (iii) performs channelwise mode separation inspired by nonlinear physics. We demonstrate that GyroSwin outperforms widely used reduced numerics on heat flux prediction, captures the turbulent energy cascade, and reduces the cost of fully resolved nonlinear gyrokinetics by three orders of magnitude while remaining physically verifiable. GyroSwin shows promising scaling laws, tested up to one billion parameters, paving the way for scalable neural surrogates for gyrokinetic simulations of plasma turbulence.", "similarity": 0.6096270680427551, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 3.8, "variance": 0.7, "avg_rating": 3.8, "var_rating": 0.7, "avg_quality": 2.8, "var_quality": 0.19999999999999996, "avg_clarity": 3.0, "var_clarity": 0.5, "avg_significance": 2.6, "var_significance": 0.3, "avg_originality": 2.6, "var_originality": 0.3}, {"id": "38", "parentIds": ["65"], "name": "Target Speaker Extraction through Comparing Noisy Positive and Negative Audio Enrollments. Target speaker extraction focuses on isolating a specific speaker's voice from an audio mixture containing mu", "full_text": "Target Speaker Extraction through Comparing Noisy Positive and Negative Audio Enrollments. Target speaker extraction focuses on isolating a specific speaker's voice from an audio mixture containing multiple speakers. To provide information about the target speaker's identity, prior works have utilized clean audio samples as conditioning inputs. However, such clean audio examples are not always readily available. For instance, obtaining a clean recording of a stranger's voice at a cocktail party without leaving the noisy environment is generally infeasible. Limited prior research has explored extracting the target speaker's characteristics from noisy enrollments, which may contain overlapping speech from interfering speakers. In this work, we explore a novel enrollment strategy that encodes target speaker information from the noisy enrollment by comparing segments where the target speaker is talking (Positive Enrollments) with segments where the target speaker is silent (Negative Enrollments). Experiments show the effectiveness of our model architecture, which achieves over 2.1 dB higher SI-SNRi compared to prior works in extracting the monaural speech from the mixture of two speakers. Additionally, the proposed two-stage training strategy accelerates convergence, reducing the number of optimization steps required to reach 3 dB SNR by 60\\%. Overall, our method achieves state-of-the-art performance in the monaural target speaker extraction conditioned on noisy enrollments. Our implementation is available at\nhttps://github.com/xu-shitong/TSE-through-Positive-Negative-Enroll .", "similarity": 0.512381911277771, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.575, "specificity_informativeness": 0.325, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 2.75, "var_clarity": 0.9166666666666666, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "39", "parentIds": ["91"], "name": "Let's Revise Step-by-Step: A Unified Local Search Framework for Code Generation with LLMs. Large Language Models (LLMs) with inference-time scaling techniques show promise for code generation, yet fac", "full_text": "Let's Revise Step-by-Step: A Unified Local Search Framework for Code Generation with LLMs. Large Language Models (LLMs) with inference-time scaling techniques show promise for code generation, yet face notable efficiency and scalability challenges. Construction-based tree-search methods suffer from rapid growth in tree size, high token consumption, and lack of anytime property. In contrast, improvement-based methods offer better performance but often struggle with uninformative reward signals and inefficient search strategies. In this work, we propose $\\textbf{ReLoc}$, a unified local search framework which effectively performs step-by-step code revision. Specifically, ReLoc explores a series of local revisions through four key algorithmic components: initial code drafting, neighborhood code generation, candidate evaluation, and incumbent code updating, each of which can be instantiated with specific decision rules to realize different local search algorithms such as Hill Climbing (HC) or Genetic Algorithm (GA). Furthermore, we develop a specialized revision reward model that evaluates code quality based on revision distance to produce fine-grained preferences that guide the local search toward more promising candidates. Finally, our extensive experimental results demonstrate that our approach achieves superior performance across diverse code generation tasks, significantly outperforming both construction-based tree search as well as the state-of-the-art improvement-based code generation methods.", "similarity": 0.6449044346809387, "summary_blocked": null, "evalScore": 0.2, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.0, "is_leaf": true, "avg_score": 4.0, "variance": 0.6666666666666666, "avg_rating": 4.0, "var_rating": 0.6666666666666666, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "40", "parentIds": ["66"], "name": "A Temporal Difference Method for Stochastic Continuous Dynamics. For continuous systems modeled by dynamical equations such as ODEs and SDEs, Bellman's principle of optimality takes the form of the Ha", "full_text": "A Temporal Difference Method for Stochastic Continuous Dynamics. For continuous systems modeled by dynamical equations such as ODEs and SDEs, Bellman's principle of optimality takes the form of the Hamilton-Jacobi-Bellman (HJB) equation, which provides the theoretical target of reinforcement learning (RL). Although recent advances in RL successfully leverage this formulation, the existing methods typically assume the underlying dynamics are known a priori because they need explicit access to the drift and diffusion coefficients to update the value function following the HJB equation. We address this inherent limitation of HJB-based RL; we propose a model-free approach still targeting the HJB equation and the corresponding temporal difference method. We prove exponential stability of the induced continuous-time dynamics, and we empirically demonstrate the resulting advantages over transition–kernel–based formulations. The proposed formulation paves the way toward bridging stochastic control and model-free reinforcement learning.", "similarity": 0.6159420013427734, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.666666666666667, "variance": 0.33333333333333337, "avg_rating": 4.666666666666667, "var_rating": 0.33333333333333337, "avg_quality": 2.6666666666666665, "var_quality": 0.33333333333333337, "avg_clarity": 3.0, "var_clarity": 1.0, "avg_significance": 3.0, "var_significance": 1.0, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "41", "parentIds": ["90"], "name": "Computational Efficiency under Covariate Shift in Kernel Ridge Regression. This paper addresses the covariate shift problem in the context of nonparametric regression within reproducing kernel Hilbert", "full_text": "Computational Efficiency under Covariate Shift in Kernel Ridge Regression. This paper addresses the covariate shift problem in the context of nonparametric regression within reproducing kernel Hilbert spaces (RKHSs). Covariate shift arises in supervised learning when the input distributions of the training and test data differ, presenting additional challenges for learning. Although kernel methods have optimal statistical properties, their high computational demands in terms of time and, particularly, memory, limit their scalability to large datasets. To address this limitation, the main focus of this paper is to explore the trade-off between computational efficiency and statistical accuracy under covariate shift. We investigate the use of random projections where the hypothesis space consists of a random subspace within a given RKHS. Our results show that, even in the presence of covariate shift, significant computational savings can be achieved without compromising learning performance.", "similarity": 0.6058147549629211, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.35, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.25, "var_originality": 0.25}, {"id": "42", "parentIds": ["73"], "name": "Faster Algorithms for Structured John Ellipsoid Computation. The famous theorem of Fritz John states that any convex body has a unique maximal volume inscribed ellipsoid, known as the John Ellipsoid. ", "full_text": "Faster Algorithms for Structured John Ellipsoid Computation. The famous theorem of Fritz John states that any convex body has a unique maximal volume inscribed ellipsoid, known as the John Ellipsoid. Computing the John Ellipsoid is a fundamental problem in convex optimization. In this paper, we focus on approximating the John Ellipsoid inscribed in a convex and centrally symmetric polytope defined by $P := \\{ x \\in \\mathbb{R}^d : -\\mathbf{1}_n \\leq A x \\leq \\mathbf{1}_n \\},$ where $ A \\in \\mathbb{R}^{n \\times d}$ is a rank-$d$ matrix and $ \\mathbf{1}_n \\in \\mathbb{R}^n $ is the all-ones vector. We develop two efficient algorithms for approximating the John Ellipsoid. The first is a sketching-based algorithm that runs in nearly input-sparsity time $ \\widetilde{O}(\\mathrm{nnz}(A) + d^\\omega) $, where $ \\mathrm{nnz}(A) $ denotes the number of nonzero entries in the matrix $A$ and $ \\omega \\approx 2.37$ is the current matrix multiplication exponent. The second is a treewidth-based algorithm that runs in time $ \\widetilde{O}(n \\tau^2)$, where $\\tau$ is the treewidth of the dual graph of the matrix $A$. Our algorithms significantly improve upon the state-of-the-art running time of $ \\widetilde{O}(n d^2) $ achieved by [Cohen, Cousins, Lee, and Yang, COLT 2019].", "similarity": 0.6497205495834351, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.05, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.5, "var_clarity": 1.6666666666666667, "avg_significance": 3.0, "var_significance": 0.0, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "43", "parentIds": ["88"], "name": "FRN: Fractal-Based Recursive Spectral Reconstruction Network. Generating hyperspectral images (HSIs) from RGB images through spectral reconstruction can significantly reduce the cost of HSI acquisitio", "full_text": "FRN: Fractal-Based Recursive Spectral Reconstruction Network. Generating hyperspectral images (HSIs) from RGB images through spectral reconstruction can significantly reduce the cost of HSI acquisition. In this paper, we propose a Fractal-Based Recursive Spectral Reconstruction Network (FRN), which differs from existing paradigms that attempt to directly integrate the full-spectrum information from the R, G, and B channels in a one-shot manner. Instead, it treats spectral reconstruction as a progressive process, predicting from broad to narrow bands or employing a coarse-to-fine approach for predicting the next wavelength. Inspired by fractals in mathematics, FRN establishes a novel spectral reconstruction paradigm by recursively invoking an atomic reconstruction module. In each invocation, only the spectral information from neighboring bands is used to provide clues for the generation of the image at the next wavelength, which follows the low-rank property of spectral data. Moreover, we design a band-aware state space model that employs a pixel-differentiated scanning strategy at different stages of the generation process, further suppressing interference from low-correlation regions caused by reflectance differences. Through extensive experimentation across different datasets, FRN achieves superior reconstruction performance compared to state-of-the-art methods. Code is available at https://github.com/mongko007/frn.", "similarity": 0.6536622643470764, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.05, "is_leaf": true, "avg_score": 4.75, "variance": iance": 0.0, "avg_rating": 5.0, "var_rating": 0.0, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 3.5, "var_clarity": 0.3333333333333333, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "45", "parentIds": ["69"], "name": "MEGADance: Mixture-of-Experts Architecture for Genre-Aware 3D Dance Generation. Music-driven 3D dance generation has attracted increasing attention in recent years, with promising applications in chor", "full_text": "MEGADance: Mixture-of-Experts Architecture for Genre-Aware 3D Dance Generation. Music-driven 3D dance generation has attracted increasing attention in recent years, with promising applications in choreography, virtual reality, and creative content creation. Previous research has generated promising realistic dance movement from audio signals. However, traditional methods underutilize genre conditioning, often treating it as auxiliary modifiers rather than core semantic drivers. This oversight compromises music-motion synchronization and disrupts dance genre continuity, particularly during complex rhythmic transitions, thereby leading to visually unsatisfactory effects. To address the challenge, we propose MEGADance, a novel architecture for music-driven 3D dance generation. By decoupling choreographic consistency into dance generality and genre specificity, MEGADance demonstrates significant dance quality and strong genre controllability. It consists of two stages: (1) High-Fidelity Dance Quantization Stage (HFDQ), which encodes dance motions into a latent representation by Finite Scalar Quantization (FSQ) and reconstructs them with kinematic-dynamic constraints, and (2) Genre-Aware Dance Generation Stage (GADG), which maps music into the latent representation by synergistic utilization of Mixture-of-Experts (MoE) mechanism with Mamba-Transformer hybrid backbone. Extensive experiments on the FineDance and AIST++ dataset demonstrate the state-of-the-art performance of MEGADance both qualitatively and quantitatively. Code is available at https://github.com/XulongT/MEGADance.", "similarity": 0.5486199855804443, "summary_blocked": null, "evalScore": 0.7, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.22499999999999998, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.25, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "46", "parentIds": ["91"], "name": "Cypher-RI: Reinforcement Learning for Integrating Schema Selection into Cypher Generation. The increasing utilization of graph databases across various fields stems from their capacity to represent in", "full_text": "Cypher-RI: Reinforcement Learning for Integrating Schema Selection into Cypher Generation. The increasing utilization of graph databases across various fields stems from their capacity to represent intricate interconnections. Nonetheless, exploiting the full capabilities of graph databases continues to be a significant hurdle, largely because of the inherent difficulty in translating natural language into Cypher. Recognizing the critical role of schema selection in database query generation and drawing inspiration from recent progress in reasoning-augmented approaches trained through reinforcement learning to enhance inference capabilities and generalization, we introduce Cypher-RI, a specialized framework for the Text-to-Cypher task. Distinct from conventional approaches, our methodology seamlessly integrates schema selection within the Cypher generation pipeline, conceptualizing it as a critical element in the reasoning process. The schema selection mechanism is guided by textual context, with its outcomes recursively shaping subsequent inference processes. Impressively, our 7B-parameter model, trained through this RL paradigm, demonstrates superior performance compared to baselines, exhibiting a 9.41\\% accuracy improvement over GPT-4o on CypherBench. These results underscore the effectiveness of our proposed reinforcement learning framework, which integrates schema selection to enhance both the accuracy and reasoning capabilities in Text-to-Cypher tasks.", "similarity": 0.6449044346809387, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.25, "var_quality": 0.25, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.0, "var_originality": 0.0}, {"id": "47", "parentIds": ["84"], "name": "Spectral Analysis of Diffusion Models with Application to Schedule Design. Diffusion models (DMs) have emerged as powerful  tools for modeling complex data distributions and generating realistic new s", "full_text": "Spectral Analysis of Diffusion Models with Application to Schedule Design. Diffusion models (DMs) have emerged as powerful  tools for modeling complex data distributions and generating realistic new samples. Over the years, advanced architectures and sampling methods have been developed to make these models practically usable. However, certain synthesis process decisions still rely on heuristics without a solid theoretical foundation. \n\nIn our work, we offer a novel analysis of the DM's inference process, introducing a comprehensive frequency response perspective. Specifically, by relying on Gaussianity assumption, we present the inference process as a closed-form spectral transfer function, capturing how the generated signal evolves in response to the initial noise. We demonstrate how the proposed analysis can be leveraged to design a noise schedule that aligns effectively with the characteristics of the data. The spectral perspective also provides insights into the underlying dynamics and sheds light on the relationship between spectral properties and noise schedule structure. Our results lead to scheduling curves that are dependent on the spectral content of the data, offering a theoretical justification for some of the heuristics taken by practitioners.", "similarity": 0.5845444202423096, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.5, "var_clarity": 0.3333333333333333, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "48", "parentIds": ["74"], "name": "MetaMind: Modeling Human Social Thoughts with Metacognitive Multi-Agent Systems. Human social interactions depend on the ability to infer others' unspoken intentions, emotions, and beliefs—a cognitive", "full_text": "MetaMind: Modeling Human Social Thoughts with Metacognitive Multi-Agent Systems. Human social interactions depend on the ability to infer others' unspoken intentions, emotions, and beliefs—a cognitive skill grounded in the psychological concept of Theory of Mind (ToM). While large language models (LLMs) excel in semantic understanding tasks, they struggle with the ambiguity and contextual nuance inherent in human communication. To bridge this gap, we introduce **MetaMind**, a multi-agent framework inspired by psychological theories of metacognition, designed to emulate human-like social reasoning. MetaMind decomposes social understanding into three collaborative stages: (1) a *Theory-of-Mind Agent* generates hypotheses about user mental states (e.g., intent, emotion), (2) a *Moral Agent* refines these hypotheses using cultural norms and ethical constraints, and (3) a *Response Agent* generates contextually appropriate responses while validating alignment with inferred intent.\nOur framework achieves state-of-the-art performance across three challenging benchmarks, with 35.7% improvement in real-world social scenarios and 6.2% gain in ToM reasoning. Notably, it enables LLMs to match human-level performance on key ToM tasks for the first time. Ablation studies confirm the necessity of all components, which showcase the framework’s ability to balance contextual plausibility, social appropriateness, and user adaptation. This work advances AI systems toward human-like social intelligence, with applications in empathetic dialogue and culturally sensitive interactions. Code is available at https://github.com/XMZhangAI/MetaMind.", "similarity": 0.7077814340591431, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.0, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 3.0, "var_significance": 0.0, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "49", "parentIds": ["92"], "name": "Vocabulary-Guided Gait Recognition. What is a gait? Appearance-based gait networks consider a gait as the human shape and motion information from images. Model-based gait networks treat a gait as the ", "full_text": "Vocabulary-Guided Gait Recognition. What is a gait? Appearance-based gait networks consider a gait as the human shape and motion information from images. Model-based gait networks treat a gait as the human inherent structure from points. However, the considerations remain vague for humans to comprehend truly. In this work, we introduce a novel paradigm Vocabulary-Guided Gait Recognition, dubbed Gait-World, which attempts to explore gait concepts through human vocabularies with Vision-Language Models (VLMs). Despite VLMs have achieved the remarkable progress in various vision tasks, the cognitive capability regarding gait modalities remains limited. The success element in Gait-World is the proper vocabulary prompt where this paradigm carefully selects gait cycle actions as Vocabulary Base, bridging the gait and vocabulary feature spaces and further promoting human understanding for the gait. How to extract gait features? Although previous gait networks have made significant progress, learning solely from gait modalities on limited gait databases makes it difficult to learn robust gait features for practicality. Therefore, we propose the first Gait-World model, dubbed $\\alpha$-Gait, which guides the gait network learning with universal vocabulary knowledge from VLMs. However, due to the heterogeneity of the modalities, directly integrating vocabulary and gait features is highly challenging as they reside in different embedding spaces. To address the issues, $\\alpha$-Gait designs Vocabulary Relation Mapper and Gait Fine-grained Detector to map and establish vocabulary relations in the gait space for detecting corresponding gait features. Extensive experiments on CASIA-B, CCPG, SUSTech1K, Gait3D and GREW reveal the potential value and research directions of vocabulary information from VLMs in the gait field.", "similarity": 0.5892847776412964, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.2, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 2.75, "var_quality": 0.9166666666666666, "avg_clarity": 3.25, "var_clarity": 0.9166666666666666, "avg_significance": 3.0, "var_significance": 0.6666666666666666, "avg_originality": 3.0, "var_originality": 0.6666666666666666}, {"id": "50", "parentIds": ["68"], "name": "Unveiling the Uncertainty in Embodied and Operational Carbon of Large AI Models through a Probabilistic Carbon Accounting Model. The rapid growth of large AI models has raised significant environmenta", "full_text": "Unveiling the Uncertainty in Embodied and Operational Carbon of Large AI Models through a Probabilistic Carbon Accounting Model. The rapid growth of large AI models has raised significant environmental concerns due to their substantial carbon footprint. Existing carbon accounting methods for AI models are fundamentally deterministic and fail to account for inherent uncertainties in embodied and operational carbon emissions. Our work aims to investigate the effect of these uncertainties on embodied and operational carbon footprint estimates for large AI models. We propose a Probabilistic Carbon Accounting Model (PCAM), which quantifies uncertainties in the carbon accounting of large AI models. We develop parameter models to quantify key components (processors, memory, storage) in the carbon footprint of AI models. To characterize the distribution of the parameters, we develop a carbon dataset by aggregating related data from various sources. Then, we generate the probabilistic distribution of the parameters from the collected dataset. We compare the performance of PCAM with LLMCarbon, the state-of-the-art carbon accounting method for large AI models. PCAM achieves $\\leq7.44\\%$ error compared to LLMCarbon’s $\\leq108.51\\%$.", "similarity": 0.67507004737854, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.0, "is_leaf": true, "avg_score": 4.75, "variance": 0.25, "avg_rating": 4.75, "var_rating": 0.25, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 2.5, "var_clarity": 0.3333333333333333, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "51", "parentIds": ["72"], "name": "Improving Decision Trees through the Lens of Parameterized Local Search. Algorithms for learning decision trees often include heuristic local-search operations such as (1) adjusting the threshold of a", "full_text": "Improving Decision Trees through the Lens of Parameterized Local Search. Algorithms for learning decision trees often include heuristic local-search operations such as (1) adjusting the threshold of a cut or (2) also exchanging the feature of that cut. We study minimizing the number of classification errors by performing a fixed number of a single type of these operations. Although we discover that the corresponding problems are NP-complete in general, we provide a comprehensive parameterized-complexity analysis with the aim of determining those properties of the problems that explain the hardness and those that make the problems tractable. For instance, we show that the problems remain hard for a small number $d$ of features or small domain size $D$ but the combination of both yields fixed-parameter tractability. That is, the problems are solvable in $(D + 1)^{2d} \\cdot |\\mathcal{I}|^{O(1)}$ time, where $|\\mathcal{I}|$ is the size of the input. We also provide a proof-of-concept implementation of this algorithm and report on empirical results.", "similarity": 0.6109022498130798, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 3.75, "variance": 0.9166666666666666, "avg_rating": 3.75, "var_rating": 0.9166666666666666, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.0, "var_significance": 0.6666666666666666, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "52", "parentIds": ["80"], "name": "Monotone and Separable Set Functions: Characterizations and Neural Models. Motivated by applications for set containment problems, we consider the following\nfundamental problem: can we design set-to-v", "full_text": "Monotone and Separable Set Functions: Characterizations and Neural Models. Motivated by applications for set containment problems, we consider the following\nfundamental problem: can we design set-to-vector functions so that the natural\npartial order on sets is preserved, namely $S \\subseteq T$ if and only if $F (S) \\leq F (T )$.\nWe call functions satisfying this property Monotone and Separating (MAS) set\nfunctions. We establish lower and upper bounds for the vector dimension necessary\nto obtain MAS functions, as a function of the cardinality of the multisets and\nthe underlying ground set. In the important case of an infinite ground set, we\nshow that MAS functions do not exist, but provide a model called MASNET\nwhich provably enjoys a relaxed MAS property we name “weakly MAS” and\nis stable in the sense of Holder continuity. We also show that MAS functions\ncan be used to construct universal models that are monotone by construction\nand can approximate all monotone set functions. Experimentally, we consider\na variety of set containment tasks. The experiments show the benefit of using\nour MASNET model, in comparison with standard set models which do not\nincorporate set containment as an inductive bias.", "similarity": 0.6813068985939026, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.0, "is_leaf": true, "avg_score": 4.75, "variance": 0.25, "avg_rating": 4.75, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "53", "parentIds": ["95"], "name": "Space Group Equivariant Crystal Diffusion. Accelerating inverse design of crystalline materials with generative models has significant implications for a range of technologies. Unlike other atomic sys", "full_text": "Space Group Equivariant Crystal Diffusion. Accelerating inverse design of crystalline materials with generative models has significant implications for a range of technologies. Unlike other atomic systems, 3D crystals are invariant to discrete groups of isometries called the space groups. Crucially, these space group symmetries are known to heavily influence materials properties. We propose SGEquiDiff, a crystal generative model which naturally handles space group constraints with space group invariant likelihoods. SGEquiDiff consists of an SE(3)-invariant, telescoping discrete sampler of crystal lattices; permutation-invariant, transformer-based autoregressive sampling of Wyckoff positions, elements, and numbers of symmetrically unique atoms; and space group equivariant diffusion of atomic coordinates. We show that space group equivariant vector fields automatically live in the tangent spaces of the Wyckoff positions. SGEquiDiff achieves state-of-the-art performance on standard benchmark datasets as assessed by quantitative proxy metrics and quantum mechanical calculations. Our code is available at https://github.com/rees-c/sgequidiff.", "similarity": 0.5096790194511414, "summary_blocked": null, "evalScore": 0.25, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.75, "variance": 0.25, "avg_rating": 4.75, "var_rating": 0.25, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 3.0, "var_clarity": 0.6666666666666666, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "54", "parentIds": ["81"], "name": "OOD-Barrier: Build a Middle-Barrier for Open-Set Single-Image Test Time Adaptation via Vision Language Models. In real-world environments, a well-designed model must be capable of handling dynamically", "full_text": "OOD-Barrier: Build a Middle-Barrier for Open-Set Single-Image Test Time Adaptation via Vision Language Models. In real-world environments, a well-designed model must be capable of handling dynamically evolving distributions, where both in-distribution (ID) and out-of-distribution (OOD) samples appear unpredictably and individually, making real-time adaptation particularly challenging. While open-set test-time adaptation has demonstrated effectiveness in adjusting to distribution shifts, existing methods often rely on batch processing and struggle to manage single-sample data stream in open-set environments. To address this limitation, we propose Open-IRT, a novel open-set Intermediate-Representation-based Test-time adaptation framework tailored for single-image test-time adaptation with vision-language models. Open-IRT comprises two key modules designed for dynamic, single-sample adaptation in open-set scenarios. The first is Polarity-aware Prompt-based OOD Filter module, which fully constructs the ID-OOD distribution, considering both the absolute semantic alignment and relative semantic polarity. The second module, Intermediate Domain-based Test-time Adaptation module, constructs an intermediate domain and indirectly decomposes the ID-OOD distributional discrepancy to refine the separation boundary during the test-time. Extensive experiments on a range of domain adaptation benchmarks demonstrate the superiority of Open-IRT. Compared to previous state-of-the-art methods, it achieves significant improvements on representative benchmarks, such as CIFAR-100C and SVHN — with gains of +8.45\\% in accuracy, -10.80\\% in FPR95, and +11.04\\% in AUROC.", "similarity": 0.6565032005310059, "summary_blocked": null, "evalScore": 0.25, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.05, "is_leaf": true, "avg_score": 4.0, "variance": 0.0, "avg_rating": 4.0, "var_rating": 0.0, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 2.5, "var_clarity": 1.6666666666666667, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "55", "parentIds": ["83"], "name": "MOBO-OSD: Batch Multi-Objective Bayesian Optimization via Orthogonal Search Directions. Bayesian Optimization (BO) is a powerful tool for optimizing expensive black-box objective functions. While exte", "full_text": "MOBO-OSD: Batch Multi-Objective Bayesian Optimization via Orthogonal Search Directions. Bayesian Optimization (BO) is a powerful tool for optimizing expensive black-box objective functions. While extensive research has been conducted on the single-objective optimization problem, the multi-objective optimization problem remains challenging. In this paper, we propose MOBO-OSD, a multi-objective Bayesian Optimization algorithm designed to generate a diverse set of Pareto optimal solutions by solving multiple constrained optimization problems, referred to as MOBO-OSD subproblems, along orthogonal search directions (OSDs) defined with respect to an approximated convex hull of individual objective minima. By employing a well-distributed set of OSDs, MOBO-OSD ensures broad coverage of the objective space, enhancing both solution diversity and hypervolume performance. To further improve the density of the set of the Pareto optimal candidate solutions without requiring an excessive number of subproblems, we leverage a Pareto Front Estimation technique to generate additional solutions in the neighborhood of existing solutions. Additionally, MOBO-OSD supports batch optimization, enabling parallel function evaluations to accelerate the optimization process when resources are available. Through extensive experiments and analysis on a variety of synthetic and real-world benchmark functions with two to six objectives, we demonstrate that MOBO-OSD consistently outperform the state-of-the-art algorithms.", "similarity": 0.5871168971061707, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 5.0, "variance": 0.0, "avg_rating": 5.0, "var_rating": 0.0, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "56", "parentIds": ["67"], "name": "Soft-consensual Federated Learning for Data Heterogeneity via Multiple Paths. Federated learning enables collaborative training while preserving the privacy of all participants. However, the heterogen", "full_text": "Soft-consensual Federated Learning for Data Heterogeneity via Multiple Paths. Federated learning enables collaborative training while preserving the privacy of all participants. However, the heterogeneity in data distribution across multiple training nodes poses significant challenges to the construction of federated models. Prior studies were dedicated to mitigating the effects of data heterogeneity by using global information as a blueprint and restricting the local update of the model for reaching a \"hard consensus\". But this practice makes it difficult to balance local and global information, and it neglects to negotiate amicably between local and global models to reach mutually agreeable results, called ``soft consensus\". In this paper, a multiple-path solving method is proposed to balance global and local features and combine these two feature preference paths to reach a soft consensus. Rather than relying on global information as the sole criterion, a negotiation process is employed to address the same objective by accommodating diverse feature preferences, thereby facilitating the discovery of a more plausible solution through multiple distinct pathways. Considering the overwhelming power of local features during local training, a swapping strategy is applied to weaken them to balance the solution paths. Moreover, to minimize the additional communication cost caused by the introduction of multiple paths, the solution of the task network is converted into data adaptation to reduce the amount of parameter transmission. Extensive experiments are conducted to demonstrate the advantages of the proposed method.", "similarity": 0.4762704372406006, "summary_blocked": null, "evalScore": 0.7, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.0, "avg_clarity": 3.0, "var_clarity": 0.6666666666666666, "avg_significance": 3.0, "var_significance": 0.0, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "57", "parentIds": ["82"], "name": "Under the Shadow: Exploiting Opacity Variation for Fine-grained Shadow Detection. Shadow characteristics are of great importance for scene understanding.\n    Existing works mainly consider shadow regi", "full_text": "Under the Shadow: Exploiting Opacity Variation for Fine-grained Shadow Detection. Shadow characteristics are of great importance for scene understanding.\n    Existing works mainly consider shadow regions as binary masks, often leading to imprecise detection results and suboptimal performance for scene understanding.\n    We demonstrate that such an assumption oversimplifies light-object interactions in the scene, as the scene details under either hard or soft shadows remain visible to a certain degree.\n    Based on this insight, we aim to reformulate the shadow detection paradigm from the opacity perspective, and introduce a new fine-grained shadow detection method.\n    In particular, given an input image, we first propose a shadow opacity augmentation module to generate realistic images with varied shadow opacities.\n    We then introduce a shadow feature separation module to learn the shadow position and opacity representations separately, followed by an opacity mask prediction module that fuses these representations and predicts fine-grained shadow detection results.\n    In addition, we construct a new dataset with opacity-annotated shadow masks across varied scenarios.\n    Extensive experiments demonstrate that our method outperforms the baselines qualitatively and quantitatively, enhancing a wide range of applications, including shadow removal, shadow editing, and 3D reconstruction.", "similarity": 0.5980538129806519, "summary_blocked": null, "evalScore": 0.7, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.25, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.0, "var_clarity": 0.6666666666666666, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "58", "parentIds": ["68"], "name": "Improving Perturbation-based Explanations by Understanding the Role of Uncertainty Calibration. Perturbation-based explanations are widely utilized to enhance the transparency of machine-learning mode", "full_text": "Improving Perturbation-based Explanations by Understanding the Role of Uncertainty Calibration. Perturbation-based explanations are widely utilized to enhance the transparency of machine-learning models in practice. However, their reliability is often compromised by the unknown model behavior under the specific perturbations used. This paper investigates the relationship between uncertainty calibration - the alignment of model confidence with actual accuracy - and perturbation-based explanations. We show that models systematically produce unreliable probability estimates when subjected to explainability-specific perturbations and theoretically prove that this directly undermines global and local explanation quality. To address this, we introduce ReCalX, a novel approach to recalibrate models for improved explanations while preserving their original predictions. Empirical evaluations across diverse models and datasets demonstrate that ReCalX consistently reduces perturbation-specific miscalibration most effectively while enhancing explanation robustness and the identification of globally important input features.", "similarity": 0.67507004737854, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.0, "is_leaf": true, "avg_score": 5.0, "variance": 0.6666666666666666, "avg_rating": 5.0,  null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.125, "is_leaf": true, "avg_score": 4.2, "variance": 0.7, "avg_rating": 4.2, "var_rating": 0.7, "avg_quality": 3.2, "var_quality": 0.19999999999999996, "avg_clarity": 3.2, "var_clarity": 0.7, "avg_significance": 2.4, "var_significance": 0.3, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "60", "parentIds": ["93"], "name": "Distributed mediation analysis with  communication efficiency. We study the mediation analysis under the distributed framework, where data are stored and processed across different worker machines due", "full_text": "Distributed mediation analysis with  communication efficiency. We study the mediation analysis under the distributed framework, where data are stored and processed across different worker machines due to storage limitations or privacy concerns. Building upon the classic Sobel's test and MaxP test, we introduce the distributed Sobel's test and distributed MaxP test, respectively. These tests are both communication-efficient and easy to implement. Theoretical analysis and numerical experiments show that, compared to the global test obtained by pooling all data together, the proposed tests achieve nearly identical power, independent of the number of machines. Furthermore, based on these two distributed test statistics, many enhanced mediation tests derived from the Sobel's or MaxP tests can be easily adapted to the distributed system. We apply our method to an educational study, testing whether the effect of high school mathematics on college-level Probability and Mathematical Statistics courses is mediated by Calculus. Our method successfully detects the mediation effect, which would not be identifiable using data from only the first or second class, highlighting the advantage of our approach.", "similarity": 0.5910847187042236, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.05, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.5, "var_clarity": 0.3333333333333333, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "61", "parentIds": ["83"], "name": "Towards Realistic Earth-Observation Constellation Scheduling: Benchmark and Methodology. Agile Earth Observation Satellites (AEOSs) constellations offer unprecedented flexibility for monitoring the Ea", "full_text": "Towards Realistic Earth-Observation Constellation Scheduling: Benchmark and Methodology. Agile Earth Observation Satellites (AEOSs) constellations offer unprecedented flexibility for monitoring the Earth’s surface, but their scheduling remains challenging under large-scale scenarios, dynamic environments, and stringent constraints. \n  Existing methods often simplify these complexities, limiting their real-world performance. \n  We address this gap with a unified framework integrating a standardized benchmark suite and a novel scheduling model.\n  Our benchmark suite, AEOS-Bench, contains $3,907$ finely tuned satellite assets and $16,410$ scenarios.\n  Each scenario features $1$ to $50$ satellites and $50$ to $300$ imaging tasks.\n  These scenarios are generated via a high-fidelity simulation platform, ensuring realistic satellite behavior such as orbital dynamics and resource constraints.\n  Ground truth scheduling annotations are provided for each scenario.\n  To our knowledge, AEOS-Bench is the first large-scale benchmark suite tailored for realistic constellation scheduling.\n  Building upon this benchmark, we introduce AEOS-Former, a Transformer-based scheduling model that incorporates a constraint-aware attention mechanism. \n  A dedicated internal constraint module explicitly models the physical and operational limits of each satellite.\n  Through simulation-based iterative learning, AEOS-Former adapts to diverse scenarios, offering a robust solution for AEOS constellation scheduling.\n  Experimental results demonstrate that AEOS-Former outperforms baseline models in task completion and energy efficiency, with ablation studies highlighting the contribution of each component.\n  Code and data are provided in https://github.com/buaa-colalab/AEOSBench.", "similarity": 0.5871168971061707, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.6, "variance": 0.30000000000000004, "avg_rating": 4.6, "var_rating": 0.30000000000000004, "avg_quality": 3.0, "var_quality": 0.0, "avg_clarity": 2.6, "var_clarity": 0.3, "avg_significance": 2.8, "var_significance": 0.19999999999999998, "avg_originality": 3.2, "var_originality": 0.19999999999999996}, {"id": "62", "parentIds": ["73"], "name": "The Flood Complex: Large-Scale Persistent Homology on Millions of Points. We consider the problem of computing persistent homology (PH) for large-scale Euclidean point cloud data, aimed at downstream ", "full_text": "The Flood Complex: Large-Scale Persistent Homology on Millions of Points. We consider the problem of computing persistent homology (PH) for large-scale Euclidean point cloud data, aimed at downstream machine learning tasks, where the exponential growth of the most widely-used Vietoris-Rips complex imposes serious computational limitations. Although more scalable alternatives such as the Alpha complex or sparse Rips approximations exist, they often still result in a prohibitively large number of simplices. This poses challenges in the complex construction and in the subsequent PH computation, prohibiting their use on large-scale point clouds. To mitigate these issues, we introduce the Flood complex, inspired by the advantages of the Alpha and Witness complex constructions. Informally, at a given filtration value $r\\geq 0$, the Flood complex contains all simplices from a Delaunay triangulation of a small subset of a point cloud $X$ that are fully covered by the union of balls of radius $r$ emanating from $X$, a process we call flooding. Our construction allows for efficient PH computation, possesses several desirable theoretical properties, and is amenable to GPU parallelization. Scaling experiments on 3D point cloud data show that we can compute PH of up to dimension 2 on several millions of points. Importantly, when evaluating object classification performance on real-world and synthetic data, we provide evidence that this scaling capability is needed, especially if objects are geometrically or topologically complex, yielding performance superior to other PH-based methods and neural networks for point cloud data.\n\nSource code and datasets are available on GitHub: https://github.com/plus-rkwitt/flooder", "similarity": 0.6497205495834351, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.75, "variance": 0.25, "avg_rating": 4.75, "var_rating": 0.25, "avg_quality": 3.25, "var_quality": 0.9166666666666666, "avg_clarity": 3.25, "var_clarity": 0.9166666666666666, "avg_significance": 2.75, "var_significance": 0.9166666666666666, "avg_originality": 2.5, "var_originality": 1.0}, {"id": "63", "parentIds": ["86"], "name": "STAR: Spatial-Temporal Tracklet Matching for Multi-Object Tracking. Existing tracking-by-detection Multi-Object Tracking methods mainly rely on associating objects with tracklets using motion and appe", "full_text": "STAR: Spatial-Temporal Tracklet Matching for Multi-Object Tracking. Existing tracking-by-detection Multi-Object Tracking methods mainly rely on associating objects with tracklets using motion and appearance features. However, variations in viewpoint and occlusions can result in discrepancies between the features of current objects and those of historical tracklets. To tackle these challenges, this paper proposes a novel Spatial-Temporal Tracklet Graph Matching paradigm (STAR). The core idea of STAR is to achieve long-term, reliable object association through the association of ``tracklet clips (TCs)\". TCs are segments of confidently associated multi-object trajectories, which are linked through graph matching. Specifically, STAR initializes TCs using a Confident Initial Tracklet Generator (CITG) and constructs a TC graph via Tracklet Clip Graph Construction (TCGC). In TCGC, each object in a TC is treated as a vertex, with the appearance and local topology features encoded on the vertex. The vertices and edges of the TC graph are then updated through message propagation to capture higher-order features. Finally, a Tracklet Clip Graph Matching (TCGM) method is proposed to efficiently and accurately associate the TCs through graph matching. STAR is model-agnostic, allowing for seamless integration with existing methods to enhance their performance. Extensive experiments on diverse datasets, including MOTChallenge, DanceTrack, and VisDrone2021-MOT, demonstrate the robustness and versatility of STAR, significantly improving tracking performance under challenging conditions.", "similarity": 0.6084103584289551, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.25, "variance": 0.9166666666666666, "avg_rating": 4.25, "var_rating": 0.916666666   <style>
    :root {
      --side: 15%;

    /* ----- layout ---------------------------------------------------- */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: flex;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f9f9f9;
      height: 100vh;
      overflow: hidden;
    }

    #full-text-box {
      width: 100%;
      overflow-wrap: break-word;
      font-size: 1em;
    }

    #side {
      flex: 0 0 var(--side);
      font-size: clamp(12px, 0.8vw + 0.5rem, 16px);
      line-height: 1.35;
      /* min-width: 220px; */
      /* max-width: 480px; */
      border-right: 1px solid #e5e5e5;
      background: #fff;
      overflow: auto;
    }


    #tree-container {
      flex: 1;
      position: relative;
      overflow: auto;
    }

    #tree-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ----- legend ---------------------------------------------------- */
    #legend {
      padding: 12px 16px 8px;
      border-bottom: 1px solid #e5e5e5;
      font-size: 3em;
    }

    .swatch {
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-right: 8px;
      border: 1px solid #999;
      vertical-align: middle;
    }

    .swatch.high {
      background: #2ca02c
    }

    .swatch.med {
      background: #ff7f0e
    }

    .swatch.low {
      background: #d62728
    }

    .swatch.na {
      background: #ccc;
      border-color: #ccc
    }

    /* ----- tooltip --------------------------------------------------- */
    .tooltip {
      position: absolute;
      background: rgba(255, 255, 255, .95);
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 2px;
      font-size: 12px;
      pointer-events: none;
      max-width: 300px;
      box-shadow: 1px 1px 4px rgba(0, 0, 0, .2);
      opacity: 0;
      transition: opacity .15s;
    }

    /* ----- nodes / links -------------------------------------------- */
    .link {
      fill: none;
      stroke: #bbb;
      stroke-width: 2px;
    }

    .node circle {
      /* stroke: steelblue; */
      stroke-width: 2px;
      transition: r .15s;
    }

    .node:hover circle {
      r: 7;
      cursor: pointer;
    }

    /* clicked node */
    .node.selected circle {
      stroke: #000;
      stroke-width: 1px;
    }

    /* direct parents & children */
    .node.related circle {
      stroke: #1f77b4;
      stroke-width: 1px;
    }

    .node.dimmed {
      opacity: 0.2;
    }
