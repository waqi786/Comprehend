trightarrow$5D interactions between electrostatic potential fields and the distribution function, and (iii) performs channelwise mode separation inspired by nonlinear physics. We demonstrate that GyroSwin outperforms widely used reduced numerics on heat flux prediction, captures the turbulent energy cascade, and reduces the cost of fully resolved nonlinear gyrokinetics by three orders of magnitude while remaining physically verifiable. GyroSwin shows promising scaling laws, tested up to one billion parameters, paving the way for scalable neural surrogates for gyrokinetic simulations of plasma turbulence.", "similarity": 0.5404545068740845, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 3.8, "variance": 0.7, "avg_rating": 3.8, "var_rating": 0.7, "avg_quality": 2.8, "var_quality": 0.19999999999999996, "avg_clarity": 3.0, "var_clarity": 0.5, "avg_significance": 2.6, "var_significance": 0.3, "avg_originality": 2.6, "var_originality": 0.3}, {"id": "38", "parentIds": ["67"], "name": "Target Speaker Extraction through Comparing Noisy Positive and Negative Audio Enrollments. Target speaker extraction focuses on isolating a specific speaker's voice from an audio mixture containing mu", "full_text": "Target Speaker Extraction through Comparing Noisy Positive and Negative Audio Enrollments. Target speaker extraction focuses on isolating a specific speaker's voice from an audio mixture containing multiple speakers. To provide information about the target speaker's identity, prior works have utilized clean audio samples as conditioning inputs. However, such clean audio examples are not always readily available. For instance, obtaining a clean recording of a stranger's voice at a cocktail party without leaving the noisy environment is generally infeasible. Limited prior research has explored extracting the target speaker's characteristics from noisy enrollments, which may contain overlapping speech from interfering speakers. In this work, we explore a novel enrollment strategy that encodes target speaker information from the noisy enrollment by comparing segments where the target speaker is talking (Positive Enrollments) with segments where the target speaker is silent (Negative Enrollments). Experiments show the effectiveness of our model architecture, which achieves over 2.1 dB higher SI-SNRi compared to prior works in extracting the monaural speech from the mixture of two speakers. Additionally, the proposed two-stage training strategy accelerates convergence, reducing the number of optimization steps required to reach 3 dB SNR by 60\\%. Overall, our method achieves state-of-the-art performance in the monaural target speaker extraction conditioned on noisy enrollments. Our implementation is available at\nhttps://github.com/xu-shitong/TSE-through-Positive-Negative-Enroll .", "similarity": 0.5905542373657227, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.575, "specificity_informativeness": 0.325, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 2.75, "var_clarity": 0.9166666666666666, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "39", "parentIds": ["71"], "name": "Let's Revise Step-by-Step: A Unified Local Search Framework for Code Generation with LLMs. Large Language Models (LLMs) with inference-time scaling techniques show promise for code generation, yet fac", "full_text": "Let's Revise Step-by-Step: A Unified Local Search Framework for Code Generation with LLMs. Large Language Models (LLMs) with inference-time scaling techniques show promise for code generation, yet face notable efficiency and scalability challenges. Construction-based tree-search methods suffer from rapid growth in tree size, high token consumption, and lack of anytime property. In contrast, improvement-based methods offer better performance but often struggle with uninformative reward signals and inefficient search strategies. In this work, we propose $\\textbf{ReLoc}$, a unified local search framework which effectively performs step-by-step code revision. Specifically, ReLoc explores a series of local revisions through four key algorithmic components: initial code drafting, neighborhood code generation, candidate evaluation, and incumbent code updating, each of which can be instantiated with specific decision rules to realize different local search algorithms such as Hill Climbing (HC) or Genetic Algorithm (GA). Furthermore, we develop a specialized revision reward model that evaluates code quality based on revision distance to produce fine-grained preferences that guide the local search toward more promising candidates. Finally, our extensive experimental results demonstrate that our approach achieves superior performance across diverse code generation tasks, significantly outperforming both construction-based tree search as well as the state-of-the-art improvement-based code generation methods.", "similarity": 0.6029634475708008, "summary_blocked": null, "evalScore": 0.2, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.0, "is_leaf": true, "avg_score": 4.0, "variance": 0.6666666666666666, "avg_rating": 4.0, "var_rating": 0.6666666666666666, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "40", "parentIds": ["66"], "name": "A Temporal Difference Method for Stochastic Continuous Dynamics. For continuous systems modeled by dynamical equations such as ODEs and SDEs, Bellman's principle of optimality takes the form of the Ha", "full_text": "A Temporal Difference Method for Stochastic Continuous Dynamics. For continuous systems modeled by dynamical equations such as ODEs and SDEs, Bellman's principle of optimality takes the form of the Hamilton-Jacobi-Bellman (HJB) equation, which provides the theoretical target of reinforcement learning (RL). Although recent advances in RL successfully leverage this formulation, the existing methods typically assume the underlying dynamics are known a priori because they need explicit access to the drift and diffusion coefficients to update the value function following the HJB equation. We address this inherent limitation of HJB-based RL; we propose a model-free approach still targeting the HJB equation and the corresponding temporal difference method. We prove exponential stability of the induced continuous-time dynamics, and we empirically demonstrate the resulting advantages over transition–kernel–based formulations. The proposed formulation paves the way toward bridging stochastic control and model-free reinforcement learning.", "similarity": 0.5779645442962646, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.666666666666667, "variance": 0.33333333333333337, "avg_rating": 4.666666666666667, "var_rating": 0.33333333333333337, "avg_quality": 2.6666666666666665, "var_quality": 0.33333333333333337, "avg_clarity": 3.0, "var_clarity": 1.0, "avg_significance": 3.0, "var_significance": 1.0, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "41", "parentIds": ["70"], "name": "Computational Efficiency under Covariate Shift in Kernel Ridge Regression. This paper addresses the covariate shift problem in the context of nonparametric regression within reproducing kernel Hilbert", "full_text": "Computational Efficiency under Covariate Shift in Kernel Ridge Regression. This paper addresses the covariate shift problem in the context of nonparametric regression within reproducing kernel Hilbert spaces (RKHSs). Covariate shift arises in supervised learning when the input distributions of the training and test data differ, presenting additional challenges for learning. Although kernel methods have optimal statistical properties, their high computational demands in terms of time and, particularly, memory, limit their scalability to large datasets. To address this limitation, the main focus of this paper is to explore the trade-off between computational efficiency and statistical accuracy under covariate shift. We investigate the use of random projections where the hypothesis space consists of a random subspace within a given RKHS. Our results show that, even in the presence of covariate shift, significant computational savings can be achieved without compromising learning performance.", "similarity": 0.6596512794494629, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.35, "specificity_informativeness": 0.275, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.25, "var_originality": 0.25}, {"id": "42", "parentIds": ["73"], "name": "Faster Algorithms for Structured John Ellipsoid Computation. The famous theorem of Fritz John states that any convex body has a unique maximal volume inscribed ellipsoid, known as the John Ellipsoid. ", "full_text": "Faster Algorithms for Structured John Ellipsoid Computation. The famous theorem of Fritz John states that any convex body has a unique maximal volume inscribed ellipsoid, known as the John Ellipsoid. Computing the John Ellipsoid is a fundamental problem in convex optimization. In this paper, we focus on approximating the John Ellipsoid inscribed in a convex and centrally symmetric polytope defined by $P := \\{ x \\in \\mathbb{R}^d : -\\mathbf{1}_n \\leq A x \\leq \\mathbf{1}_n \\},$ where $ A \\in \\mathbb{R}^{n \\times d}$ is a rank-$d$ matrix and $ \\mathbf{1}_n \\in \\mathbb{R}^n $ is the all-ones vector. We develop two efficient algorithms for approximating the John Ellipsoid. The first is a sketching-based algorithm that runs in nearly input-sparsity time $ \\widetilde{O}(\\mathrm{nnz}(A) + d^\\omega) $, where $ \\mathrm{nnz}(A) $ denotes the number of nonzero entries in the matrix $A$ and $ \\omega \\approx 2.37$ is the current matrix multiplication exponent. The second is a treewidth-based algorithm that runs in time $ \\widetilde{O}(n \\tau^2)$, where $\\tau$ is the treewidth of the dual graph of the matrix $A$. Our algorithms significantly improve upon the state-of-the-art running time of $ \\widetilde{O}(n d^2) $ achieved by [Cohen, Cousins, Lee, and Yang, COLT 2019].", "similarity": 0.6218153834342957, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.05, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.5, "var_clarity": 1.6666666666666667, "avg_significance": 3.0, "var_significance": 0.0, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "43", "parentIds": ["76"], "name": "FRN: Fractal-Based Recursive Spectral Reconstruction Network. Generating hyperspectral images (HSIs) from RGB images through spectral reconstruction can significantly reduce the cost of HSI acquisitio", "full_text": "FRN: Fractal-Based Recursive Spectral Reconstruction Network. Generating hyperspectral images (HSIs) from RGB images through spectral reconstruction can significantly reduce the cost of HSI acquisition. In this paper, we propose a Fractal-Based Recursive Spectral Reconstruction Network (FRN), which differs from existing paradigms that attempt to directly integrate the full-spectrum information from the R, G, and B channels in a one-shot manner. Instead, it treats spectral reconstruction as a progressive process, predicting from broad to narrow bands or employing a coarse-to-fine approach for predicting the next wavelength. Inspired by fractals in mathematics, FRN establishes a novel spectral reconstruction paradigm by recursively invoking an atomic reconstruction module. In each invocation, only the spectral information from neighboring bands is used to provide clues for the generation of the image at the next wavelength, which follows the low-rank property of spectral data. Moreover, we design a band-aware state space model that employs a pixel-differentiated scanning strategy at different stages of the generation process, further suppressing interference from low-correlation regions caused by reflectance differences. Through extensive experimentation across different datasets, FRN achieves superior reconstruction performance compared to state-of-the-art methods. Code is available at https://github.com/mongko007/frn.", "similarity": 0.5936451554298401, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.05, "is_leaf": true, "avg_score": 4.75, "variance": 2.25, "avg_rating": 4.75, "var_rating": 2.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 3.25, "var_significance": 0.9166666666666666, "avg_originality": 3.0, "var_originality": 0.6666666666666666}, {"id": "44", "parentIds": ["77"], "name": "Understanding the Generalization of Stochastic Gradient Adam in Learning Neural Networks. Adam is a popular and widely used adaptive gradient method in deep learning, which has also received tremendou", "full_text": "Understanding the Generalization of Stochastic Gradient Adam in Learning Neural Networks. Adam is a popular and widely used adaptive gradient method in deep learning, which has also received tremendous focus in theoretical research. However, most existing theoretical work primarily analyzes its full-batch version, which differs fundamentally from the stochastic variant used in practice. Unlike SGD, stochastic Adam does not converge to its full-batch counterpart even with infinitesimal learning rates. We present the first theoretical characterization of how batch size affects Adam's generalization, analyzing two-layer over-parameterized CNNs on image data. Our results reveal that while both Adam and AdamW with proper weight decay $\\lambda$ converge to poor test error solutions, their mini-batch variants can achieve near-zero test error. We further prove Adam has a strictly smaller effective weight decay bound than AdamW, theoretically explaining why Adam requires more sensitive $\\lambda$ tuning. Extensive experiments validate our findings, demonstrating the critical role of batch size and weight decay in Adam's generalization performance.", "similarity": 0.7148225903511047, "summary_blocked": null, "evalScore": 0.25, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 5.0, "variance": 0.0, "avg_rating": 5.0, "var_rating": 0.0, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 3.5, "var_clarity": 0.3333333333333333, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "45", "parentIds": ["65"], "name": "MEGADance: Mixture-of-Experts Architecture for Genre-Aware 3D Dance Generation. Music-driven 3D dance generation has attracted increasing attention in recent years, with promising applications in chor", "full_text": "MEGADance: Mixture-of-Experts Architecture for Genre-Aware 3D Dance Generation. Music-driven 3D dance generation has attracted increasing attention in recent years, with promising applications in choreography, virtual reality, and creative content creation. Previous research has generated promising realistic dance movement from audio signals. However, traditional methods underutilize genre conditioning, often treating it as auxiliary modifiers rather than core semantic drivers. This oversight compromises music-motion synchronization and disrupts dance genre continuity, particularly during complex rhythmic transitions, thereby leading to visually unsatisfactory effects. To address the challenge, we propose MEGADance, a novel architecture for music-driven 3D dance generation. By decoupling choreographic consistency into dance generality and genre specificity, MEGADance demonstrates significant dance quality and strong genre controllability. It consists of two stages: (1) High-Fidelity Dance Quantization Stage (HFDQ), which encodes dance motions into a latent representation by Finite Scalar Quantization (FSQ) and reconstructs them with kinematic-dynamic constraints, and (2) Genre-Aware Dance Generation Stage (GADG), which maps music into the latent representation by synergistic utilization of Mixture-of-Experts (MoE) mechanism with Mamba-Transformer hybrid backbone. Extensive experiments on the FineDance and AIST++ dataset demonstrate the state-of-the-art performance of MEGADance both qualitatively and quantitatively. Code is available at https://github.com/XulongT/MEGADance.", "similarity": 0.619796633720398, "summary_blocked": null, "evalScore": 0.7, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.22499999999999998, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.25, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "46", "parentIds": ["68"], "name": "Cypher-RI: Reinforcement Learning for Integrating Schema Selection into Cypher Generation. The increasing utilization of graph databases across various fields stems from their capacity to represent in", "full_text": "Cypher-RI: Reinforcement Learning for Integrating Schema Selection into Cypher Generation. The increasing utilization of graph databases across various fields stems from their capacity to represent intricate interconnections. Nonetheless, exploiting the full capabilities of graph databases continues to be a significant hurdle, largely because of the inherent difficulty in translating natural language into Cypher. Recognizing the critical role of schema selection in database query generation and drawing inspiration from recent progress in reasoning-augmented approaches trained through reinforcement learning to enhance inference capabilities and generalization, we introduce Cypher-RI, a specialized framework for the Text-to-Cypher task. Distinct from conventional approaches, our methodology seamlessly integrates schema selection within the Cypher generation pipeline, conceptualizing it as a critical element in the reasoning process. The schema selection mechanism is guided by textual context, with its outcomes recursively shaping subsequent inference processes. Impressively, our 7B-parameter model, trained through this RL paradigm, demonstrates superior performance compared to baselines, exhibiting a 9.41\\% accuracy improvement over GPT-4o on CypherBench. These results underscore the effectiveness of our proposed reinforcement learning framework, which integrates schema selection to enhance both the accuracy and reasoning capabilities in Text-to-Cypher tasks.", "similarity": 0.6183314919471741, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.25, "var_quality": 0.25, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.0, "var_originality": 0.0}, {"id": "47", "parentIds": ["72"], "name": "Spectral Analysis of Diffusion Models with Application to Schedule Design. Diffusion models (DMs) have emerged as powerful  tools for modeling complex data distributions and generating realistic new s", "full_text": "Spectral Analysis of Diffusion Models with Application to Schedule Design. Diffusion models (DMs) have emerged as powerful  tools for modeling complex data distributions and generating realistic new samples. Over the years, advanced architectures and sampling methods have been developed to make these models practically usable. However, certain synthesis process decisions still rely on heuristics without a solid theoretical foundation. \n\nIn our work, we offer a novel analysis of the DM's inference process, introducing a comprehensive frequency response perspective. Specifically, by relying on Gaussianity assumption, we present the inference process as a closed-form spectral transfer function, capturing how the generated signal evolves in response to the initial noise. We demonstrate how the proposed analysis can be leveraged to design a noise schedule that aligns effectively with the characteristics of the data. The spectral perspective also provides insights into the underlying dynamics and sheds light on the relationship between spectral properties and noise schedule structure. Our results lead to scheduling curves that are dependent on the spectral content of the data, offering a theoretical justification for some of the heuristics taken by practitioners.", "similarity": 0.5696829557418823, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.5, "var_clarity": 0.3333333333333333, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "48", "parentIds": ["91"], "name": "MetaMind: Modeling Human Social Thoughts with Metacognitive Multi-Agent Systems. Human social interactions depend on the ability to infer others' unspoken intentions, emotions, and beliefs—a cognitive", "full_text": "MetaMind: Modeling Human Social Thoughts with Metacognitive Multi-Agent Systems. Human social interactions depend on the ability to infer others' unspoken intentions, emotions, and beliefs—a cognitive skill grounded in the psychological concept of Theory of Mind (ToM). While large language models (LLMs) excel in semantic understanding tasks, they struggle with the ambiguity and contextual nuance inherent in human communication. To bridge this gap, we introduce **MetaMind**, a multi-agent framework inspired by psychological theories of metacognition, designed to emulate human-like social reasoning. MetaMind decomposes social understanding into three collaborative stages: (1) a *Theory-of-Mind Agent* generates hypotheses about user mental states (e.g., intent, emotion), (2) a *Moral Agent* refines these hypotheses using cultural norms and ethical constraints, and (3) a *Response Agent* generates contextually appropriate responses while validating alignment with inferred intent.\nOur framework achieves state-of-the-art performance across three challenging benchmarks, with 35.7% improvement in real-world social scenarios and 6.2% gain in ToM reasoning. Notably, it enables LLMs to match human-level performance on key ToM tasks for the first time. Ablation studies confirm the necessity of all components, which showcase the framework’s ability to balance contextual plausibility, social appropriateness, and user adaptation. This work advances AI systems toward human-like social intelligence, with applications in empathetic dialogue and culturally sensitive interactions. Code is available at https://github.com/XMZhangAI/MetaMind.", "similarity": 0.6978740692138672, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.0, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 3.0, "var_significance": 0.0, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "49", "parentIds": ["92"], "name": "Vocabulary-Guided Gait Recognition. What is a gait? Appearance-based gait networks consider a gait as the human shape and motion information from images. Model-based gait networks treat a gait as the ", "full_text": "Vocabulary-Guided Gait Recognition. What is a gait? Appearance-based gait networks consider a gait as the human shape and motion information from images. Model-based gait networks treat a gait as the human inherent structure from points. However, the considerations remain vague for humans to comprehend truly. In this work, we introduce a novel paradigm Vocabulary-Guided Gait Recognition, dubbed Gait-World, which attempts to explore gait concepts through human vocabularies with Vision-Language Models (VLMs). Despite VLMs have achieved the remarkable progress in various vision tasks, the cognitive capability regarding gait modalities remains limited. The success element in Gait-World is the proper vocabulary prompt where this paradigm carefully selects gait cycle actions as Vocabulary Base, bridging the gait and vocabulary feature spaces and further promoting human understanding for the gait. How to extract gait features? Although previous gait networks have made significant progress, learning solely from gait modalities on limited gait databases makes it difficult to learn robust gait features for practicality. Therefore, we propose the first Gait-World model, dubbed $\\alpha$-Gait, which guides the gait network learning with universal vocabulary knowledge from VLMs. However, due to the heterogeneity of the modalities, directly integrating vocabulary and gait features is highly challenging as they reside in different embedding spaces. To address the issues, $\\alpha$-Gait designs Vocabulary Relation Mapper and Gait Fine-grained Detector to map and establish vocabulary relations in the gait space for detecting corresponding gait features. Extensive experiments on CASIA-B, CCPG, SUSTech1K, Gait3D and GREW reveal the potential value and research directions of vocabulary information from VLMs in the gait field.", "similarity": 0.7178339958190918, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.2, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 2.75, "var_quality": 0.9166666666666666, "avg_clarity": 3.25, "var_clarity": 0.9166666666666666, "avg_significance": 3.0, "var_significance": 0.6666666666666666, "avg_originality": 3.0, "var_originality": 0.6666666666666666}, {"id": "50", "parentIds": ["81"], "name": "Unveiling the Uncertainty in Embodied and Operational Carbon of Large AI Models through a Probabilistic Carbon Accounting Model. The rapid growth of large AI models has raised significant environmenta", "full_text": "Unveiling the Uncertainty in Embodied and Operational Carbon of Large AI Models through a Probabilistic Carbon Accounting Model. The rapid growth of large AI models has raised significant environmental concerns due to their substantial carbon footprint. Existing carbon accounting methods for AI models are fundamentally deterministic and fail to account for inherent uncertainties in embodied and operational carbon emissions. Our work aims to investigate the effect of these uncertainties on embodied and operational carbon footprint estimates for large AI models. We propose a Probabilistic Carbon Accounting Model (PCAM), which quantifies uncertainties in the carbon accounting of large AI models. We develop parameter models to quantify key components (processors, memory, storage) in the carbon footprint of AI models. To characterize the distribution of the parameters, we develop a carbon dataset by aggregating related data from various sources. Then, we generate the probabilistic distribution of the parameters from the collected dataset. We compare the performance of PCAM with LLMCarbon, the state-of-the-art carbon accounting method for large AI models. PCAM achieves $\\leq7.44\\%$ error compared to LLMCarbon’s $\\leq108.51\\%$.", "similarity": 0.399437814950943, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.0, "is_leaf": true, "avg_score": 4.75, "variance": 0.25, "avg_rating": 4.75, "var_rating": 0.25, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 2.5, "var_clarity": 0.3333333333333333, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "51", "parentIds": ["84"], "name": "Improving Decision Trees through the Lens of Parameterized Local Search. Algorithms for learning decision trees often include heuristic local-search operations such as (1) adjusting the threshold of a", "full_text": "Improving Decision Trees through the Lens of Parameterized Local Search. Algorithms for learning decision trees often include heuristic local-search operations such as (1) adjusting the threshold of a cut or (2) also exchanging the feature of that cut. We study minimizing the number of classification errors by performing a fixed number of a single type of these operations. Although we discover that the corresponding problems are NP-complete in general, we provide a comprehensive parameterized-complexity analysis with the aim of determining those properties of the problems that explain the hardness and those that make the problems tractable. For instance, we show that the problems remain hard for a small number $d$ of features or small domain size $D$ but the combination of both yields fixed-parameter tractability. That is, the problems are solvable in $(D + 1)^{2d} \\cdot |\\mathcal{I}|^{O(1)}$ time, where $|\\mathcal{I}|$ is the size of the input. We also provide a proof-of-concept implementation of this algorithm and report on empirical results.", "similarity": 0.5217393636703491, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 3.75, "variance": 0.9166666666666666, "avg_rating": 3.75, "var_rating": 0.9166666666666666, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 2.75, "var_clarity": 0.25, "avg_significance": 2.0, "var_significance": 0.6666666666666666, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "52", "parentIds": ["90"], "name": "Monotone and Separable Set Functions: Characterizations and Neural Models. Motivated by applications for set containment problems, we consider the following\nfundamental problem: can we design set-to-v", "full_text": "Monotone and Separable Set Functions: Characterizations and Neural Models. Motivated by applications for set containment problems, we consider the following\nfundamental problem: can we design set-to-vector functions so that the natural\npartial order on sets is preserved, namely $S \\subseteq T$ if and only if $F (S) \\leq F (T )$.\nWe call functions satisfying this property Monotone and Separating (MAS) set\nfunctions. We establish lower and upper bounds for the vector dimension necessary\nto obtain MAS functions, as a function of the cardinality of the multisets and\nthe underlying ground set. In the important case of an infinite ground set, we\nshow that MAS functions do not exist, but provide a model called MASNET\nwhich provably enjoys a relaxed MAS property we name “weakly MAS” and\nis stable in the sense of Holder continuity. We also show that MAS functions\ncan be used to construct universal models that are monotone by construction\nand can approximate all monotone set functions. Experimentally, we consider\na variety of set containment tasks. The experiments show the benefit of using\nour MASNET model, in comparison with standard set models which do not\nincorporate set containment as an inductive bias.", "similarity": 0.7026243209838867, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.0, "is_leaf": true, "avg_score": 4.75, "variance": 0.25, "avg_rating": 4.75, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.0, "var_clarity": 0.0, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "53", "parentIds": ["79"], "name": "Space Group Equivariant Crystal Diffusion. Accelerating inverse design of crystalline materials with generative models has significant implications for a range of technologies. Unlike other atomic sys", "full_text": "Space Group Equivariant Crystal Diffusion. Accelerating inverse design of crystalline materials with generative models has significant implications for a range of technologies. Unlike other atomic systems, 3D crystals are invariant to discrete groups of isometries called the space groups. Crucially, these space group symmetries are known to heavily influence materials properties. We propose SGEquiDiff, a crystal generative model which naturally handles space group constraints with space group invariant likelihoods. SGEquiDiff consists of an SE(3)-invariant, telescoping discrete sampler of crystal lattices; permutation-invariant, transformer-based autoregressive sampling of Wyckoff positions, elements, and numbers of symmetrically unique atoms; and space group equivariant diffusion of atomic coordinates. We show that space group equivariant vector fields automatically live in the tangent spaces of the Wyckoff positions. SGEquiDiff achieves state-of-the-art performance on standard benchmark datasets as assessed by quantitative proxy metrics and quantum mechanical calculations. Our code is available at https://github.com/rees-c/sgequidiff.", "similarity": 0.5404545068740845, "summary_blocked": null, "evalScore": 0.25, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.75, "variance": 0.25, "avg_rating": 4.75, "var_rating": 0.25, "avg_quality": 3.0, "var_quality": 0.6666666666666666, "avg_clarity": 3.0, "var_clarity": 0.6666666666666666, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "54", "parentIds": ["92"], "name": "OOD-Barrier: Build a Middle-Barrier for Open-Set Single-Image Test Time Adaptation via Vision Language Models. In real-world environments, a well-designed model must be capable of handling dynamically", "full_text": "OOD-Barrier: Build a Middle-Barrier for Open-Set Single-Image Test Time Adaptation via Vision Language Models. In real-world environments, a well-designed model must be capable of handling dynamically evolving distributions, where both in-distribution (ID) and out-of-distribution (OOD) samples appear unpredictably and individually, making real-time adaptation particularly challenging. While open-set test-time adaptation has demonstrated effectiveness in adjusting to distribution shifts, existing methods often rely on batch processing and struggle to manage single-sample data stream in open-set environments. To address this limitation, we propose Open-IRT, a novel open-set Intermediate-Representation-based Test-time adaptation framework tailored for single-image test-time adaptation with vision-language models. Open-IRT comprises two key modules designed for dynamic, single-sample adaptation in open-set scenarios. The first is Polarity-aware Prompt-based OOD Filter module, which fully constructs the ID-OOD distribution, considering both the absolute semantic alignment and relative semantic polarity. The second module, Intermediate Domain-based Test-time Adaptation module, constructs an intermediate domain and indirectly decomposes the ID-OOD distributional discrepancy to refine the separation boundary during the test-time. Extensive experiments on a range of domain adaptation benchmarks demonstrate the superiority of Open-IRT. Compared to previous state-of-the-art methods, it achieves significant improvements on representative benchmarks, such as CIFAR-100C and SVHN — with gains of +8.45\\% in accuracy, -10.80\\% in FPR95, and +11.04\\% in AUROC.", "similarity": 0.7178339958190918, "summary_blocked": null, "evalScore": 0.25, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.05, "is_leaf": true, "avg_score": 4.0, "variance": 0.0, "avg_rating": 4.0, "var_rating": 0.0, "avg_quality": 2.5, "var_quality": 0.3333333333333333, "avg_clarity": 2.5, "var_clarity": 1.6666666666666667, "avg_significance": 2.75, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "55", "parentIds": ["70"], "name": "MOBO-OSD: Batch Multi-Objective Bayesian Optimization via Orthogonal Search Directions. Bayesian Optimization (BO) is a powerful tool for optimizing expensive black-box objective functions. While exte", "full_text": "MOBO-OSD: Batch Multi-Objective Bayesian Optimization via Orthogonal Search Directions. Bayesian Optimization (BO) is a powerful tool for optimizing expensive black-box objective functions. While extensive research has been conducted on the single-objective optimization problem, the multi-objective optimization problem remains challenging. In this paper, we propose MOBO-OSD, a multi-objective Bayesian Optimization algorithm designed to generate a diverse set of Pareto optimal solutions by solving multiple constrained optimization problems, referred to as MOBO-OSD subproblems, along orthogonal search directions (OSDs) defined with respect to an approximated convex hull of individual objective minima. By employing a well-distributed set of OSDs, MOBO-OSD ensures broad coverage of the objective space, enhancing both solution diversity and hypervolume performance. To further improve the density of the set of the Pareto optimal candidate solutions without requiring an excessive number of subproblems, we leverage a Pareto Front Estimation technique to generate additional solutions in the neighborhood of existing solutions. Additionally, MOBO-OSD supports batch optimization, enabling parallel function evaluations to accelerate the optimization process when resources are available. Through extensive experiments and analysis on a variety of synthetic and real-world benchmark functions with two to six objectives, we demonstrate that MOBO-OSD consistently outperform the state-of-the-art algorithms.", "similarity": 0.6596512794494629, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 5.0, "variance": 0.0, "avg_rating": 5.0, "var_rating": 0.0, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.25, "var_clarity": 0.25, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 2.75, "var_originality": 0.25}, {"id": "56", "parentIds": ["84"], "name": "Soft-consensual Federated Learning for Data Heterogeneity via Multiple Paths. Federated learning enables collaborative training while preserving the privacy of all participants. However, the heterogen", "full_text": "Soft-consensual Federated Learning for Data Heterogeneity via Multiple Paths. Federated learning enables collaborative training while preserving the privacy of all participants. However, the heterogeneity in data distribution across multiple training nodes poses significant challenges to the construction of federated models. Prior studies were dedicated to mitigating the effects of data heterogeneity by using global information as a blueprint and restricting the local update of the model for reaching a \"hard consensus\". But this practice makes it difficult to balance local and global information, and it neglects to negotiate amicably between local and global models to reach mutually agreeable results, called ``soft consensus\". In this paper, a multiple-path solving method is proposed to balance global and local features and combine these two feature preference paths to reach a soft consensus. Rather than relying on global information as the sole criterion, a negotiation process is employed to address the same objective by accommodating diverse feature preferences, thereby facilitating the discovery of a more plausible solution through multiple distinct pathways. Considering the overwhelming power of local features during local training, a swapping strategy is applied to weaken them to balance the solution paths. Moreover, to minimize the additional communication cost caused by the introduction of multiple paths, the solution of the task network is converted into data adaptation to reduce the amount of parameter transmission. Extensive experiments are conducted to demonstrate the advantages of the proposed method.", "similarity": 0.5217393636703491, "summary_blocked": null, "evalScore": 0.7, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.5, "variance": 0.3333333333333333, "avg_rating": 4.5, "var_rating": 0.3333333333333333, "avg_quality": 3.0, "var_quality": 0.0, "avg_clarity": 3.0, "var_clarity": 0.6666666666666666, "avg_significance": 3.0, "var_significance": 0.0, "avg_originality": 3.25, "var_originality": 0.25}, {"id": "57", "parentIds": ["87"], "name": "Under the Shadow: Exploiting Opacity Variation for Fine-grained Shadow Detection. Shadow characteristics are of great importance for scene understanding.\n    Existing works mainly consider shadow regi", "full_text": "Under the Shadow: Exploiting Opacity Variation for Fine-grained Shadow Detection. Shadow characteristics are of great importance for scene understanding.\n    Existing works mainly consider shadow regions as binary masks, often leading to imprecise detection results and suboptimal performance for scene understanding.\n    We demonstrate that such an assumption oversimplifies light-object interactions in the scene, as the scene details under either hard or soft shadows remain visible to a certain degree.\n    Based on this insight, we aim to reformulate the shadow detection paradigm from the opacity perspective, and introduce a new fine-grained shadow detection method.\n    In particular, given an input image, we first propose a shadow opacity augmentation module to generate realistic images with varied shadow opacities.\n    We then introduce a shadow feature separation module to learn the shadow position and opacity representations separately, followed by an opacity mask prediction module that fuses these representations and predicts fine-grained shadow detection results.\n    In addition, we construct a new dataset with opacity-annotated shadow masks across varied scenarios.\n    Extensive experiments demonstrate that our method outperforms the baselines qualitatively and quantitatively, enhancing a wide range of applications, including shadow removal, shadow editing, and 3D reconstruction.", "similarity": 0.6809576749801636, "summary_blocked": null, "evalScore": 0.7, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.25, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.0, "var_clarity": 0.6666666666666666, "avg_significance": 2.25, "var_significance": 0.25, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "58", "parentIds": ["69"], "name": "Improving Perturbation-based Explanations by Understanding the Role of Uncertainty Calibration. Perturbation-based explanations are widely utilized to enhance the transparency of machine-learning mode", "full_text": "Improving Perturbation-based Explanations by Understanding the Role of Uncertainty Calibration. Perturbation-based explanations are widely utilized to enhance the transparency of machine-learning models in practice. However, their reliability is often compromised by the unknown model behavior under the specific perturbations used. This paper investigates the relationship between uncertainty calibration - the alignment of model confidence with actual accuracy - and perturbation-based explanations. We show that models systematically produce unreliable probability estimates when subjected to explainability-specific perturbations and theoretically prove that this directly undermines global and local explanation quality. To address this, we introduce ReCalX, a novel approach to recalibrate models for improved explanations while preserving their original predictions. Empirical evaluations across diverse models and datasets demonstrate that ReCalX consistently reduces perturbation-specific miscalibration most effectively while enhancing explanation robustness and the identification of globally important input features.", "similarity": 0.5562021136283875, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.0, "is_leaf": true, "avg_score": 5.0, "variance": 0.6666666666666666, "avg_rating": 5.0, "var_rating": 0.6666666666666666, "avg_quality": 3.5, "var_quality": 0.3333333333333333, "avg_clarity": 3.75, "var_clarity": 0.25, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "59", "parentIds": ["75"], "name": "Unbalanced Optimal Total Variation Transport: A Theoretical Approach to Spatial Resource Allocation Problems. We propose and analyze a new class of unbalanced weak optimal transport (OT) problems with", "full_text": "Unbalanced Optimal Total Variation Transport: A Theoretical Approach to Spatial Resource Allocation Problems. We propose and analyze a new class of unbalanced weak optimal transport (OT) problems with total variation penalties, motivated by spatial resource allocation tasks. Unlike classical OT, our framework accommodates general unbalanced nonnegative measures and incorporates cost objectives that directly capture operational trade-offs between transport cost and supply–demand mismatch. In the general setting, we establish the existence of optimal solutions and a dual formulation. We then focus on the semi-discrete setting, where one measure is discrete and the other is absolutely continuous, a structure relevant to applications such as service area partitioning for facilities like schools or medical stations. Exploiting a tessellation-based structure, we derive the corresponding explicit optimality conditions. \nWe further address a quantization problem that jointly optimizes the locations and weights of discrete support points, applicable to facility location tasks such as the cost-efficient deployment of battery swap stations or e-commerce warehouses, informed by demand-side data. The dual-tessellation structure also yields explicit gradient expressions, enabling efficient numerical optimization in finite dimensions.", "similarity": 0.4625876545906067, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.3, "specificity_informativeness": 0.125, "is_leaf": true, "avg_score": 4.2, "variance": 0.7, "avg_rating": 4.2, "var_rating": 0.7, "avg_quality": 3.2, "var_quality": 0.19999999999999996, "avg_clarity": 3.2, "var_clarity": 0.7, "avg_significance": 2.4, "var_significance": 0.3, "avg_originality": 3.0, "var_originality": 0.0}, {"id": "60", "parentIds": ["95"], "name": "Distributed mediation analysis with  communication efficiency. We study the mediation analysis under the distributed framework, where data are stored and processed across different worker machines due", "full_text": "Distributed mediation analysis with  communication efficiency. We study the mediation analysis under the distributed framework, where data are stored and processed across different worker machines due to storage limitations or privacy concerns. Building upon the classic Sobel's test and MaxP test, we introduce the distributed Sobel's test and distributed MaxP test, respectively. These tests are both communication-efficient and easy to implement. Theoretical analysis and numerical experiments show that, compared to the global test obtained by pooling all data together, the proposed tests achieve nearly identical power, independent of the number of machines. Furthermore, based on these two distributed test statistics, many enhanced mediation tests derived from the Sobel's or MaxP tests can be easily adapted to the distributed system. We apply our method to an educational study, testing whether the effect of high school mathematics on college-level Probability and Mathematical Statistics courses is mediated by Calculus. Our method successfully detects the mediation effect, which would not be identifiable using data from only the first or second class, highlighting the advantage of our approach.", "similarity": 0.5242500305175781, "summary_blocked": null, "evalScore": 0.75, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.05, "is_leaf": true, "avg_score": 4.25, "variance": 0.25, "avg_rating": 4.25, "var_rating": 0.25, "avg_quality": 2.75, "var_quality": 0.25, "avg_clarity": 3.5, "var_clarity": 0.3333333333333333, "avg_significance": 2.5, "var_significance": 0.3333333333333333, "avg_originality": 2.5, "var_originality": 0.3333333333333333}, {"id": "61", "parentIds": ["86"], "name": "Towards Realistic Earth-Observation Constellation Scheduling: Benchmark and Methodology. Agile Earth Observation Satellites (AEOSs) constellations offer unprecedented flexibility for monitoring the Ea", "full_text": "Towards Realistic Earth-Observation Constellation Scheduling: Benchmark and Methodology. Agile Earth Observation Satellites (AEOSs) constellations offer unprecedented flexibility for monitoring the Earth’s surface, but their scheduling remains challenging under large-scale scenarios, dynamic environments, and stringent constraints. \n  Existing methods often simplify these complexities, limiting their real-world performance. \n  We address this gap with a unified framework integrating a standardized benchmark suite and a novel scheduling model.\n  Our benchmark suite, AEOS-Bench, contains $3,907$ finely tuned satellite assets and $16,410$ scenarios.\n  Each scenario features $1$ to $50$ satellites and $50$ to $300$ imaging tasks.\n  These scenarios are generated via a high-fidelity simulation platform, ensuring realistic satellite behavior such as orbital dynamics and resource constraints.\n  Ground truth scheduling annotations are provided for each scenario.\n  To our knowledge, AEOS-Bench is the first large-scale benchmark suite tailored for realistic constellation scheduling.\n  Building upon this benchmark, we introduce AEOS-Former, a Transformer-based scheduling model that incorporates a constraint-aware attention mechanism. \n  A dedicated internal constraint module explicitly models the physical and operational limits of each satellite.\n  Through simulation-based iterative learning, AEOS-Former adapts to diverse scenarios, offering a robust solution for AEOS constellation scheduling.\n  Experimental results demonstrate that AEOS-Former outperforms baseline models in task completion and energy efficiency, with ablation studies highlighting the contribution of each component.\n  Code and data are provided in https://github.com/buaa-colalab/AEOSBench.", "similarity": 0.6916353106498718, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.0, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.6, "variance": 0.30000000000000004, "avg_rating": 4.6, "var_rating": 0.30000000000000004, "avg_quality": 3.0, "var_quality": 0.0, "avg_clarity": 2.6, "var_clarity": 0.3, "avg_significance": 2.8, "var_significance": 0.19999999999999998, "avg_originality": 3.2, "var_originality": 0.19999999999999996}, {"id": "62", "parentIds": ["88"], "name": "The Flood Complex: Large-Scale Persistent Homology on Millions of Points. We consider the problem of computing persistent homology (PH) for large-scale Euclidean point cloud data, aimed at downstream ", "full_text": "The Flood Complex: Large-Scale Persistent Homology on Millions of Points. We consider the problem of computing persistent homology (PH) for large-scale Euclidean point cloud data, aimed at downstream machine learning tasks, where the exponential growth of the most widely-used Vietoris-Rips complex imposes serious computational limitations. Although more scalable alternatives such as the Alpha complex or sparse Rips approximations exist, they often still result in a prohibitively large number of simplices. This poses challenges in the complex construction and in the subsequent PH computation, prohibiting their use on large-scale point clouds. To mitigate these issues, we introduce the Flood complex, inspired by the advantages of the Alpha and Witness complex constructions. Informally, at a given filtration value $r\\geq 0$, the Flood complex contains all simplices from a Delaunay triangulation of a small subset of a point cloud $X$ that are fully covered by the union of balls of radius $r$ emanating from $X$, a process we call flooding. Our construction allows for efficient PH computation, possesses several desirable theoretical properties, and is amenable to GPU parallelization. Scaling experiments on 3D point cloud data show that we can compute PH of up to dimension 2 on several millions of points. Importantly, when evaluating object classification performance on real-world and synthetic data, we provide evidence that this scaling capability is needed, especially if objects are geometrically or topologically complex, yielding performance superior to other PH-based methods and neural networks for point cloud data.\n\nSource code and datasets are available on GitHub: https://github.com/plus-rkwitt/flooder", "similarity": 0.6121571660041809, "summary_blocked": null, "evalScore": 0.4, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.075, "is_leaf": true, "avg_score": 4.75, "variance": 0.25, "avg_rating": 4.75, "var_rating": 0.25, "avg_quality": 3.25, "var_quality": 0.9166666666666666, "avg_clarity": 3.25, "var_clarity": 0.9166666666666666, "avg_significance": 2.75, "var_significance": 0.9166666666666666, "avg_originality": 2.5, "var_originality": 1.0}, {"id": "63", "parentIds": ["89"], "name": "STAR: Spatial-Temporal Tracklet Matching for Multi-Object Tracking. Existing tracking-by-detection Multi-Object Tracking methods mainly rely on associating objects with tracklets using motion and appe", "full_text": "STAR: Spatial-Temporal Tracklet Matching for Multi-Object Tracking. Existing tracking-by-detection Multi-Object Tracking methods mainly rely on associating objects with tracklets using motion and appearance features. However, variations in viewpoint and occlusions can result in discrepancies between the features of current objects and those of historical tracklets. To tackle these challenges, this paper proposes a novel Spatial-Temporal Tracklet Graph Matching paradigm (STAR). The core idea of STAR is to achieve long-term, reliable object association through the association of ``tracklet clips (TCs)\". TCs are segments of confidently associated multi-object trajectories, which are linked through graph matching. Specifically, STAR initializes TCs using a Confident Initial Tracklet Generator (CITG) and constructs a TC graph via Tracklet Clip Graph Construction (TCGC). In TCGC, each object in a TC is treated as a vertex, with the appearance and local topology features encoded on the vertex. The vertices and edges of the TC graph are then updated through message propagation to capture higher-order features. Finally, a Tracklet Clip Graph Matching (TCGM) method is proposed to efficiently and accurately associate the TCs through graph matching. STAR is model-agnostic, allowing for seamless integration with existing methods to enhance their performance. Extensive experiments on diverse datasets, including MOTChallenge, DanceTrack, and VisDrone2021-MOT, demonstrate the robustness and versatility of STAR, significantly improving tracking performance under challenging conditions.", "similarity": 0.6289553642272949, "summary_blocked": null, "evalScore": 0.3, "entail1": null, "entail2": null, "faithfulness1": null, "faithfulness2": null, "informativeness1": null, "informativeness2": null, "specificity_faithfulness": 0.15, "specificity_informativeness": 0.15, "is_leaf": true, "avg_score": 4.25, "variance": 0.9166666666666666, "avg_rating": 4.25, "var_rating": 0.916     }

    /* ----- legend ---------------------------------------------------- */
    #legend {
      padding: 12px 16px 8px;
      border-bottom: 1px solid #e5e5e5;
      font-size: 3em;
    }

    .swatch {
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-right: 8px;
      border: 1px solid #999;
      vertical-align: middle;
    }

    .swatch.high {
      background: #2ca02c
    }

    .swatch.med {
      background: #ff7f0e
    }

    .swatch.low {
      background: #d62728
    }

    .swatch.na {
      background: #ccc;
      border-color: #ccc
    }

    /* ----- tooltip --------------------------------------------------- */
    .tooltip {
      position: absolute;
      background: rgba(255, 255, 255, .95);
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 2px;
      font-size: 12px;
      pointer-events: none;
      max-width: 300px;
      box-shadow: 1px 1px 4px rgba(0, 0, 0, .2);
      opacity: 0;
      transition: opacity .15s;
    }

    /* ----- nodes / links -------------------------------------------- */
    .link {
      fill: none;
      stroke: #bbb;
      stroke-width: 2px;
    }

    .node circle {
      /* stroke: steelblue; */
      stroke-width: 2px;
      transition: r .15s;
    }

    .node:hover circle {
      r: 7;
      cursor: pointer;
    }

    /* clicked node */
    .node.selected circle {
      stroke: #000;
      stroke-width: 1px;
    }

    /* direct parents & children */
    .node.related circle {
      stroke: #1f77b4;
      stroke-width: 1px;
    }

    .node.dimmed {
      opacity: 0.2;
    }
  </style>
</head>

<body>
  <!-- sticky panel -->
  <div id="side">
    <div id="full-text-box" style="padding:16px;white-space:pre-wrap;"></div>
  </div>

  <!-- search box -->
  <input id="searchBox" placeholder="Search full text..."
    style="position:absolute;top:10px;left:10px;z-index:10;padding:4px;" />
  <!-- tree container -->
  <div
    style="position: absolute; top: 10px; right: 20px; z-index: 1000; background: white; padding: 6px 10px; border-radius: 6px; box-shadow: 0 0 6px rgba(0,0,0,0.1);">
    <label for="score-select">Score:</label>
    <select id="score-select"></select>
  </div>

  <div id="tree-container"></div>
  <div id="tooltip" class="tooltip"></div>
  <button id="resetBtn" style="position:absolute;bottom:10px;right:10px;z-index:10;">Reset</button>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/d3-dag@0.6"></script>
  <script>
    /* canvas size */
    const margin = { top: 80, right: 80, bottom: 80, left: 80 };
    const NODE_R = 5;                   // base node radius
    const MAX_INITIAL_SCALE = 1         // auto-fit won’t zoom past this
    const TARGET_SCALE = 1.8;   // how far we zoom in on a click
    let currentZoom = 1;                 // track live scale for tooltip
    const BASE = 200;   // horizontal room for deeper layers
    const STEP = 200;
    const V_GAP = 120;   // vertical gap between layers (unchanged)


    let selectedScoreField = ''; // populated after data loads

    /** Collect score field names from wb_scores dict and legacy top-level fields. */
    function collectScoreFields(data) {
      const keys = new Set();
      for (const node of data) {
        if (node.wb_scores && typeof node.wb_scores === 'object') {
          Object.keys(node.wb_scores).forEach(k => keys.add(k));
        }
        if (node.wb_score_mistral != null && node.wb_score_mistral !== '-') keys.add('wb_score_mistral');
        if (node.wb_score_llama != null && node.wb_score_llama !== '-') keys.add('wb_score_llama');
      }
      return [...keys];
    }

    function getScoreValue(node, field) {
      const fromDict = node?.wb_scores?.[field];
      if (fromDict != null && fromDict !== '-') return fromDict;
      const legacy = node?.[field];
      if (legacy != null && legacy !== '-') return legacy;
      return null;
    }

    const colour = d => {
      // Sir's requirement: color NODE based on selected metric
      const val = d.data[selectedScoreField];
      if (val == null || isNaN(val)) return '#ccc';
      // Different scales for avg vs var metrics
      if (selectedScoreField.startsWith('var_')) {
        // variance range ~0-0.5
        const v = Math.max(0, Math.min(0.5, val));
        return d3.scaleLinear()
          .domain([0, 0.15, 0.3, 0.5])
          .range(['#2ca02c', '#98df8a', '#ffbb78', '#d62728'])
          .interpolate(d3.interpolateLab)(v);
      } else {
        // avg range ~1-6 (review score)
        const v = Math.max(1, Math.min(6, val));
        return d3.scaleLinear()
          .domain([1, 2.5, 4, 5, 6])
          .range(['#b00020', '#ff7f0e', '#ffdd57', '#98df8a', '#2ca02c'])
          .interpolate(d3.interpolateLab)(v);
      }
    };
    /* helper for node colour */
    // const colour = sim =>
    //   sim == null || isNaN(sim) ? '#ccc'
    //     : sim > 0.8 ? '#2ca02c'
    //       : sim > 0.6 ? '#ff7f0e'
    //         : '#d62728';

    /* ── globals we update ──────────────────────────────────── */
    const container = document.getElementById('tree-container');
    let svg, g, zoomBehaviour, tooltip, txtBox, root, fitted = false;

    /** DAG JSON via ?data=...: a basename (served from visualisation/) or a
     *  repo-relative path like demo_trees/foo.json (served from the repo root).
     *  Traversal/absolute/unsafe values fall back to tree_data.json. */
    function resolveViewerDataFile() {
      const raw = new URLSearchParams(location.search).get('data');
      const fallback = 'tree_data.json';
      if (!raw || raw.includes('..') || raw.startsWith('/') || raw.includes('\\')
          || !/^[\w][\w.\/-]*\.json$/.test(raw)) {
        return fallback;
      }
      // paths resolve from the served repo root; bare basenames stay relative
      // to viewer.html (i.e. inside visualisation/)
      return raw.includes('/') ? '/' + raw : raw;
    }

    /* ── build everything once ──────────────────────────────── */
    function init() {
      svg = d3.select(container).append('svg');
      g = svg.append('g');

      tooltip = d3.select('#tooltip');
      txtBox = d3.select('#full-text-box');

      const dataFile = resolveViewerDataFile();
      Promise.resolve(window.__EMBEDDED_TREE_DATA__).then(data => {
        const scoreKeys = ['avg_rating','avg_quality','avg_clarity','avg_significance','avg_originality','var_rating','var_quality','var_clarity','var_significance','var_originality'];
        const sel = document.getElementById('score-select');
        sel.innerHTML = scoreKeys.map(k =>
          `<option value="${k}">${k}</option>`
        ).join('');
        selectedScoreField = scoreKeys[0] ?? '';

        const stratify = d3.dagStratify()
          .id(d => d.id)
          .parentIds(d => d.parentIds || []);
        root = stratify(data);
        const layout = d3.sugiyama().size([container.clientWidth - margin.left - margin.right,
        container.clientHeight - margin.top - margin.bottom]);
        layout(root);
        update();
      });

      // blank-click = clear side panel
      d3.select(container).on('click', e => {
        if (e.target.tagName !== 'circle') {
          txtBox.html('');
          g.selectAll('.node').classed('dimmed selected related', false);
        }
      });

      // on window resize, redraw & refit
      window.addEventListener('resize', () => {
        fitted = false;
        update();
      });
      document.getElementById('score-select').addEventListener('change', function () {
        selectedScoreField = this.value;
        update(); // re-color nodes
      });

    }

    function update() {
      if (!root) return;

      const W = container.clientWidth;
      const H = container.clientHeight;
      const w = W - margin.left - margin.right;
      const h = H - margin.top - margin.bottom;

      const bottomLayer = d3.max(root.descendants(), n => n.layer);

      // d3-dag layout
      const layout = d3.sugiyama()
        .size([w, h])
        .layering(d3.layeringSimplex())
        .decross(d3.decrossTwoLayer())
        .nodeSize(n => {
          const layersAboveLeaf = bottomLayer - n.layer;
          const width = layersAboveLeaf === 0
            ? BASE
            : BASE * Math.pow(2, layersAboveLeaf);
          return [width, V_GAP];
        })
        .coord(d3.coordCenter());
      layout(root);

      // zoom behaviour (re-attach each draw)
      zoomBehaviour = d3.zoom()
        .extent([[0, 0], [W, H]])
        .scaleExtent([0.1, 4])
        .filter(e => !(e.type === 'wheel' && !e.ctrlKey))
        .on('zoom', e => {
          currentZoom = e.transform.k;
          g.attr('transform', e.transform);
          g.selectAll('.node foreignObject > div')
            .style('font-size', `${Math.max(5, 5 / currentZoom)}px`);
        });
      svg.call(zoomBehaviour);

      /* links */
      const link = g.selectAll('.link')
        .data(root.links(), d => d.target.data.id || d.target.data.name);

      const linkVertical = d3.linkVertical()
        .x(d => d.x)
        .y(d => d.y)

      link.join(
        enter => enter.append('path').attr('class', 'link'),
        update => update,
        exit => exit.remove()
      )
        .attr('d', d => linkVertical({ source: d.source, target: d.target }))
        .style('stroke-width', d => {
          // Use child (target) node's per-edge eval score; map 0..1 -> 1..6 px
          const s = (d && d.target && typeof d.target.data?.evalScore === 'number')
            ? Math.max(0, Math.min(1, d.target.data.evalScore))
            : null;
          return s == null ? 2 : (1 + 5 * s);
        });

      /* nodes */
      const node = g.selectAll('.node')
        .data(root.descendants(), d => d.data.id || d.data.prompt || '');

      const nodeEnter = node.enter().append('g').attr('class', 'node');

      nodeEnter.append('circle').attr('r', NODE_R);

      // SCORE BADGE (avg ± variance) above node
      nodeEnter.append('text')
        .attr('class', 'score-badge')
        .attr('x', 0).attr('y', -NODE_R - 2)
        .attr('text-anchor', 'middle')
        .style('font-size', '4.5px')
        .style('font-weight', 'bold')
        .style('pointer-events', 'none')
        .text('');

      // label (prompt text, truncated)
      nodeEnter.append('foreignObject')
        .attr('x', -60).attr('y', NODE_R + 0.5)
        .attr('width', 120).attr('height', 40)
        .append('xhtml:div')
        .style('font-size', '5px')
        .style('text-align', 'center')
        .style('word-wrap', 'break-word')
        .style('width', '120px');

      nodeEnter.merge(node)
        .attr('transform', d => `translate(${d.x},${d.y})`)
        .on('mouseover', (e, d) => {
          //console.log("Hovered node:", d.data);
          tooltip.style('opacity', 1)
            .html(`<strong>Similarity:</strong> ${d.data.similarity ?? '-'}<br>
                    <strong>Eval:</strong> ${d.data.evalScore ?? '-'}<br>
                    <strong>Entail-1:</strong> ${d.data.entail1}<br>
                    <strong>Entail-2:</strong> ${d.data.entail2}<br>
                    <strong>Faithfulness-1:</strong> ${d.data.faithfulness1 ?? '-'}<br>
                    <strong>Faithfulness-2:</strong> ${d.data.faithfulness2 ?? '-'}<br>
                    <strong>Informativeness-1:</strong> ${d.data.informativeness1 ?? '-'}<br>
                    <strong>Informativeness-2:</strong> ${d.data.informativeness2 ?? '-'}<br>
                    <strong>Spec-Faithful:</strong> ${d.data.specificity_faithfulness ?? '-'}<br>
                    <strong>Spec-Informative:</strong> ${d.data.specificity_informativeness ?? '-'}<br>
                    <strong>Avg Score:</strong> ${d.data.avg_score != null ? d.data.avg_score.toFixed(3) : '-'}<br>
                    <strong>Variance:</strong> ${d.data.variance != null ? d.data.variance.toFixed(3) : '-'}<br>
                    <strong>Is Leaf:</strong> ${d.data.is_leaf ?? false}<br>
                    <strong>Summary Blocked:</strong> ${d.data.summary_blocked}<br>
                    <strong>${selectedScoreField.replace(/^score_/, '').replace(/^wb_score_/, '')} Score:</strong> ${getScoreValue(d.data, selectedScoreField) ?? 'n/a'}`)
            .style('left', (e.pageX + 10) + 'px')
            .style('top', (e.pageY + 5) + 'px')
            .style('transform-origin', 'top left')
            .style('transform', `scale(${currentZoom})`);
        })
        .on('mouseout', () => tooltip.style('opacity', 0))
        .on('click', (e, d) => {

          /* -------- side-panel text -------- */
          txtBox.html(
            `<strong>Full Text:</strong><br>${(d.data.full_text || '')
              .replace(/\n/g, '<br>')}`
          );
          nodeEnter.merge(node).select('circle')
            .attr('fill', d => colour(d));
          //above for colored nodes.
          // .attr('fill', d => "#ccc");

          /* -------- zoom to the node -------- */
          const W = container.clientWidth;
          const H = container.clientHeight;

          const scale = Math.min(TARGET_SCALE, zoomBehaviour.scaleExtent()[1]);
          const x = d.x * scale;
          const y = d.y * scale;

          const transform = d3.zoomIdentity
            .translate(W / 2 - x, H / 2 - y)
            .scale(scale);

          svg.transition()
            .duration(750)
            .call(zoomBehaviour.transform, transform);

          /* -------- highlight logic -------- */
          // clear any previous highlights
          g.selectAll('.node').classed('selected related', false);

          // mark the clicked node itself
          d3.select(e.currentTarget).classed('selected', true);

          const related = new Set();
          root.links().forEach(l => {
            if (l.source === d) related.add(l.target); // child
            if (l.target === d) related.add(l.source); // parent
          });

          // mark direct parents and children
          g.selectAll('.node')
            .filter(n => related.has(n))
            .classed('related', true);

          // Dimming all nodes first
          g.selectAll('.node').classed('dimmed', true);

          // Keep selected and related nodes fully visible
          g.selectAll('.node.selected, .node.related').classed('dimmed', false);

          document.getElementById('searchBox').value = '';

          txtBox.html(`<strong>Full Text:</strong><br>${(d.data.full_text || '').replace(/\n/g, '<br>')}`);
        })


      nodeEnter.merge(node).select('circle')
        .attr('fill', d => colour(d));

      nodeEnter.merge(node).select('foreignObject > div')
        .html(d => {
          const t = d.data.prompt || d.data.name || '';
          return t.length > 40 ? t.slice(0, 40) + '…' : t;
        });

      nodeEnter.merge(node).select('.score-badge')
        .text(d => {
          const avg = d.data.avg_score;
          const v = d.data.variance;
          if (avg == null || isNaN(avg)) return '';
          if (d.data.is_leaf) {
            return avg.toFixed(2) + (v != null ? ' ± ' + v.toFixed(2) : '');
          }
          return avg.toFixed(2);
        })
        .style('fill', '#333');  /* fixed neutral text color; node circle shows metric */

      node.exit().remove();

      /* auto-fit once per draw (or after resize) */
      if (!fitted) {
        fitToScreen(W, H);
        fitted = true;
      }
    }

    /* ── auto-fit whole tree to viewport ─────────────────────── */
    function fitToScreen(W, H) {
      const bbox = g.node().getBBox();
      const scale = Math.min(
        (W - margin.left - margin.right) / bbox.width,
        (H - margin.top - margin.bottom) / bbox.height,
        MAX_INITIAL_SCALE
      );
      const xOff = (W - bbox.width * scale) / 2 - bbox.x * scale;
      const yOff = (H - bbox.height * scale) / 2 - bbox.y * scale;

      const t = d3.zoomIdentity.translate(xOff, yOff).scale(scale);
      svg.call(zoomBehaviour.transform, t);
      currentZoom = scale;
    }

    init();
    // Search logic
    document.getElementById('searchBox').addEventListener('input', e => {
      const term = e.target.value.toLowerCase();
      g.selectAll('.node')
        .classed('dimmed', d => {
          const text = (d.data.full_text || '').toLowerCase();
          return !text.includes(term);
        });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      console.log('[RESET] clicked. g:', !!g, 'svg:', !!svg, 'zoomBehaviour:', !!zoomBehaviour, 'root:', !!root);
      if (!svg || !g || !root || !zoomBehaviour) {
        console.warn('[RESET] aborting - not ready');
        return;
      }
      
      const W = container.clientWidth;
      const H = container.clientHeight;
      
      // 1) Clear search box
      const sb = document.getElementById('searchBox');
      if (sb) sb.value = '';
      
      // 2) Remove all highlight / dim classes from nodes and links
      g.selectAll('.node')
        .classed('dimmed', false)
        .classed('selected', false)
        .classed('related', false);
      g.selectAll('.link')
        .classed('highlighted', false)
        .classed('dimmed', false);
      
      // 3) Clear the side panel
      const tb = document.getElementById('full-text-box');
      if (tb) tb.innerHTML = '';
      
      // 4) Hard reset zoom to identity
      svg.transition().duration(0).call(zoomBehaviour.transform, d3.zoomIdentity);
      currentZoom = 1;
      
      // 5) Reset re-fit flag and fit to screen
      fitted = false;
      try {
        fitToScreen(W, H);
      } catch (e) {
        console.warn('[RESET] fitToScreen failed:', e);
      }
      
      console.log('[RESET] done');
    });
  </script>
</body>

</html>
