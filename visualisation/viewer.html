<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Entailment Tree Viewer</title>
<style>
:root { --side: 15%; }
* { box-sizing: border-box; }
body { margin: 0; display: flex; font-family: "Segoe UI", Arial, sans-serif; background: #f9f9f9; height: 100vh; overflow: hidden; }
#full-text-box { width: 100%; overflow-wrap: break-word; font-size: 1em; }
#side { flex: 0 0 var(--side); font-size: clamp(12px, 0.8vw + 0.5rem, 16px); line-height: 1.35; border-right: 1px solid #e5e5e5; background: #fff; overflow: auto; }
#tree-container { flex: 1; position: relative; overflow: auto; }
#tree-container svg { width: 100%; height: 100%; display: block; }
.tooltip { position: absolute; background: rgba(255,255,255,.95); padding: 8px; border: 1px solid #ccc; border-radius: 2px; font-size: 12px; pointer-events: none; max-width: 320px; box-shadow: 1px 1px 4px rgba(0,0,0,.2); opacity: 0; transition: opacity .15s; }
.link { fill: none; stroke: #bbb; stroke-width: 2px; }
.node circle { stroke: #333; stroke-width: 1px; transition: r .15s, fill .2s; }
.node:hover circle { r: 8; cursor: pointer; }
.node.selected circle { stroke: #000; stroke-width: 3px; }
.node.related circle { stroke: #1f77b4; stroke-width: 2px; }
.node.dimmed { opacity: 0.15; }
</style>
</head>
<body>
<div id="side"><div id="full-text-box" style="padding:16px;white-space:pre-wrap;"></div></div>
<input id="searchBox" placeholder="Search full text..." style="position:absolute;top:10px;left:10px;z-index:10;padding:4px;" />
<div style="position: absolute; top: 10px; right: 20px; z-index: 1000; background: white; padding: 6px 10px; border-radius: 6px; box-shadow: 0 0 6px rgba(0,0,0,0.1);">
  <label for="score-select">Score:</label>
  <select id="score-select"></select>
</div>
<div id="tree-container"></div>
<div id="tooltip" class="tooltip"></div>
<button id="resetBtn" style="position:absolute;bottom:10px;right:10px;z-index:10;">Reset</button>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/d3-dag@0.6"></script>
<script>
const margin = { top: 80, right: 80, bottom: 80, left: 80 };
const NODE_R = 5, MAX_INITIAL_SCALE = 1, TARGET_SCALE = 1.8;
let currentZoom = 1;
const BASE = 200, V_GAP = 120;

const SCORE_KEYS = ['avg_rating','avg_quality','avg_clarity','avg_significance','avg_originality','var_rating','var_quality','var_clarity','var_significance','var_originality'];
let selectedScoreField = 'avg_rating';

const container = document.getElementById('tree-container');
let svg, g, zoomBehaviour, tooltip, txtBox, root, fitted = false;

function getVal(node, field) {
  let v = node[field];
  if (v === null || v === undefined || v === '' || v === '-') return null;
  v = parseFloat(v);
  return isNaN(v) ? null : v;
}

function colour(d) {
  const val = getVal(d.data, selectedScoreField);
  if (val === null) return '#cccccc';
  if (selectedScoreField.startsWith('var_')) {
    const v = Math.max(0, Math.min(0.5, val));
    return d3.scaleLinear().domain([0, 0.15, 0.3, 0.5]).range(['#2ca02c','#98df8a','#ffbb78','#d62728']).interpolate(d3.interpolateLab)(v);
  } else {
    const v = Math.max(1, Math.min(6, val));
    return d3.scaleLinear().domain([1, 2.5, 4, 5, 6]).range(['#b00020','#ff7f0e','#ffdd57','#98df8a','#2ca02c']).interpolate(d3.interpolateLab)(v);
  }
}

function resolveViewerDataFile() {
  const raw = new URLSearchParams(location.search).get('data');
  const fb = 'tree_data.json';
  if (!raw || raw.includes('..') || raw.startsWith('/') || raw.includes('\\') || !/^[\w][\w.\/-]*\.json$/.test(raw)) return fb;
  return raw.includes('/') ? '/' + raw : raw;
}

function fmt(v, d) { return (v !== null && v !== undefined && !isNaN(v)) ? Number(v).toFixed(d) : '-'; }

function init() {
  svg = d3.select(container).append('svg');
  g = svg.append('g');
  tooltip = d3.select('#tooltip');
  txtBox = d3.select('#full-text-box');
  const sel = document.getElementById('score-select');
  sel.innerHTML = SCORE_KEYS.map(k => '<option value="' + k + '">' + k + '</option>').join('');
  sel.value = selectedScoreField;

  d3.json(resolveViewerDataFile()).then(data => {
    const stratify = d3.dagStratify().id(d => d.id).parentIds(d => d.parentIds || []);
    root = stratify(data);
    const layout = d3.sugiyama().size([container.clientWidth - margin.left - margin.right, container.clientHeight - margin.top - margin.bottom]);
    layout(root);
    update();
  });

  d3.select(container).on('click', e => {
    if (e.target.tagName !== 'circle') { txtBox.html(''); g.selectAll('.node').classed('dimmed selected related', false); }
  });
  window.addEventListener('resize', () => { fitted = false; update(); });
  document.getElementById('score-select').addEventListener('change', function () { selectedScoreField = this.value; update(); });
}

function update() {
  if (!root) return;
  const W = container.clientWidth, H = container.clientHeight;
  const w = W - margin.left - margin.right, h = H - margin.top - margin.bottom;
  const bottomLayer = d3.max(root.descendants(), n => n.layer);
  const layout = d3.sugiyama().size([w, h]).layering(d3.layeringSimplex()).decross(d3.decrossTwoLayer())
    .nodeSize(n => { const l = bottomLayer - n.layer; return [l === 0 ? BASE : BASE * Math.pow(2, l), V_GAP]; })
    .coord(d3.coordCenter());
  layout(root);
  zoomBehaviour = d3.zoom().extent([[0,0],[W,H]]).scaleExtent([0.1,4]).filter(e => !(e.type === 'wheel' && !e.ctrlKey))
    .on('zoom', e => { currentZoom = e.transform.k; g.attr('transform', e.transform); g.selectAll('.node foreignObject > div').style('font-size', Math.max(5, 5 / currentZoom) + 'px'); });
  svg.call(zoomBehaviour);

  const link = g.selectAll('.link').data(root.links(), d => d.target.data.id || d.target.data.name);
  const lv = d3.linkVertical().x(d => d.x).y(d => d.y);
  link.join(e => e.append('path').attr('class', 'link'), u => u, e => e.remove())
    .attr('d', d => lv({ source: d.source, target: d.target }))
    .style('stroke-width', d => { const s = (d && d.target && typeof d.target.data?.evalScore === 'number') ? Math.max(0, Math.min(1, d.target.data.evalScore)) : null; return s == null ? 2 : (1 + 5 * s); });

  const node = g.selectAll('.node').data(root.descendants(), d => d.data.id || d.data.prompt || '');
  const nodeEnter = node.enter().append('g').attr('class', 'node');
  nodeEnter.append('circle').attr('r', NODE_R);
  nodeEnter.append('text').attr('class', 'score-badge').attr('x', 0).attr('y', -NODE_R - 2).attr('text-anchor', 'middle').style('font-size', '4.5px').style('font-weight', 'bold').style('pointer-events', 'none').text('');
  nodeEnter.append('foreignObject').attr('x', -60).attr('y', NODE_R + 0.5).attr('width', 120).attr('height', 40)
    .append('xhtml:div').style('font-size', '5px').style('text-align', 'center').style('word-wrap', 'break-word').style('width', '120px');

  nodeEnter.merge(node)
    .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')')
    .on('mouseover', (e, d) => {
      const n = d.data;
      tooltip.style('opacity', 1).html(
        '<strong>Selected Metric:</strong> ' + selectedScoreField + ' = ' + fmt(getVal(n, selectedScoreField), 3) + '<br>' +
        '<strong>Similarity:</strong> ' + fmt(n.similarity, 3) + '<br>' +
        '<strong>Eval:</strong> ' + fmt(n.evalScore, 3) + '<br>' +
        '<strong>Entail-1:</strong> ' + fmt(n.entail1, 3) + '<br>' +
        '<strong>Entail-2:</strong> ' + fmt(n.entail2, 3) + '<br>' +
        '<strong>Avg Rating:</strong> ' + fmt(n.avg_rating, 2) + '<br>' +
        '<strong>Var Rating:</strong> ' + fmt(n.var_rating, 3) + '<br>' +
        '<strong>Avg Quality:</strong> ' + fmt(n.avg_quality, 2) + '<br>' +
        '<strong>Var Quality:</strong> ' + fmt(n.var_quality, 3) + '<br>' +
        '<strong>Avg Clarity:</strong> ' + fmt(n.avg_clarity, 2) + '<br>' +
        '<strong>Var Clarity:</strong> ' + fmt(n.var_clarity, 3) + '<br>' +
        '<strong>Avg Significance:</strong> ' + fmt(n.avg_significance, 2) + '<br>' +
        '<strong>Var Significance:</strong> ' + fmt(n.var_significance, 3) + '<br>' +
        '<strong>Avg Originality:</strong> ' + fmt(n.avg_originality, 2) + '<br>' +
        '<strong>Var Originality:</strong> ' + fmt(n.var_originality, 3) + '<br>' +
        '<strong>Faithfulness-1:</strong> ' + fmt(n.faithfulness1, 3) + '<br>' +
        '<strong>Informativeness-1:</strong> ' + fmt(n.informativeness1, 3) + '<br>' +
        '<strong>Spec-Faithful:</strong> ' + fmt(n.specificity_faithfulness, 3) + '<br>' +
        '<strong>Spec-Informative:</strong> ' + fmt(n.specificity_informativeness, 3)
      ).style('left', (e.pageX + 10) + 'px').style('top', (e.pageY + 5) + 'px');
    })
    .on('mouseout', () => tooltip.style('opacity', 0))
    .on('click', (e, d) => {
      txtBox.html('<strong>Full Text:</strong><br>' + (d.data.full_text || '').replace(/\n/g, '<br>'));
      const scale = Math.min(TARGET_SCALE, zoomBehaviour.scaleExtent()[1]);
      svg.transition().duration(750).call(zoomBehaviour.transform, d3.zoomIdentity.translate(container.clientWidth/2 - d.x*scale, container.clientHeight/2 - d.y*scale).scale(scale));
      g.selectAll('.node').classed('selected related', false);
      d3.select(e.currentTarget).classed('selected', true);
      const related = new Set();
      root.links().forEach(l => { if (l.source === d) related.add(l.target); if (l.target === d) related.add(l.source); });
      g.selectAll('.node').filter(n => related.has(n)).classed('related', true);
      g.selectAll('.node').classed('dimmed', true);
      g.selectAll('.node.selected, .node.related').classed('dimmed', false);
    });

  // APPLY COLORS
  nodeEnter.merge(node).select('circle').attr('fill', d => colour(d)).attr('stroke', '#333').attr('stroke-width', 1);

  nodeEnter.merge(node).select('foreignObject > div').html(d => {
    const t = d.data.prompt || d.data.name || '';
    return t.length > 40 ? t.slice(0, 40) + '...' : t;
  });

  nodeEnter.merge(node).select('.score-badge').text(d => {
    const v = getVal(d.data, selectedScoreField);
    return v === null ? '' : v.toFixed(2);
  }).style('fill', '#333');

  node.exit().remove();
  if (!fitted) { fitToScreen(W, H); fitted = true; }
}

function fitToScreen(W, H) {
  const bbox = g.node().getBBox();
  const scale = Math.min((W - margin.left - margin.right) / bbox.width, (H - margin.top - margin.bottom) / bbox.height, MAX_INITIAL_SCALE);
  const xOff = (W - bbox.width * scale) / 2 - bbox.x * scale;
  const yOff = (H - bbox.height * scale) / 2 - bbox.y * scale;
  svg.call(zoomBehaviour.transform, d3.zoomIdentity.translate(xOff, yOff).scale(scale));
  currentZoom = scale;
}

init();
document.getElementById('searchBox').addEventListener('input', e => {
  const term = e.target.value.toLowerCase();
  g.selectAll('.node').classed('dimmed', d => !(d.data.full_text || '').toLowerCase().includes(term));
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!svg || !g || !root || !zoomBehaviour) return;
  const sb = document.getElementById('searchBox'); if (sb) sb.value = '';
  g.selectAll('.node').classed('dimmed', false).classed('selected', false).classed('related', false);
  const tb = document.getElementById('full-text-box'); if (tb) tb.innerHTML = '';
  svg.transition().duration(0).call(zoomBehaviour.transform, d3.zoomIdentity);
  currentZoom = 1; fitted = false;
  try { fitToScreen(container.clientWidth, container.clientHeight); } catch(e) {}
});
</script>
</body>
</html>
